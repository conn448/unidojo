<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidojo — Quiz</title><style>html,body{margin:0;background:#080808;color:#fff;font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}main{max-width:720px;margin:auto;padding:22px 16px 40px}.brand{font-size:25px;font-weight:900;margin-bottom:24px}.brand span{color:#ff9800}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.15em;color:#ff9800}.card{background:#151515;border:1px solid #303030;border-radius:20px;padding:22px;margin:14px 0}h1{font-size:32px;line-height:1.08;margin:8px 0 14px}.muted{color:#aaa}.choice{display:block;width:100%;min-height:56px;margin:10px 0;padding:14px 16px;border-radius:14px;border:1px solid #444;background:#202020;color:#fff;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation}.choice:hover{background:#292929}.choice.correct{border-color:#35d399;background:#09271f}.choice.wrong{border-color:#ff5d73;background:#2b1117}.choice:disabled{cursor:default}.primary{display:block;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:14px;background:#ff9800;color:#111;font-weight:900;font:inherit;cursor:pointer}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:#ff9800;width:0}.score{display:flex;justify-content:space-between;color:#aaa}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:10px}</style></head><body><main><div class="brand">uni<span>dojo</span></div><a class="back" href="index.html">← Back to Unidojo</a><div id="app"></div></main><script>(function(){"use strict";var lessons=[['Runway maths','🏃','FOUNDATION','£420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10/day','£17.14/day','£60/day','£70/day'],1],['Net income','🧾','INCOME','A £30,000 gross salary is offered. Which figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],['Opportunity cost','⚔️','DECISIONS','You have £90 flexible money. Spending £45 on a night out means that £45 cannot fund another goal. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],['Credit comparison','💳','CREDIT','Two cards advertise 19%. Card A has no mandatory fee; Card B has a compulsory £60 annual fee. What should you compare?',['Only headline rate','APR / total borrowing cost','Minimum payment only','Lender reputation'],1],['Real returns','📈','ECONOMICS','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],['Compounding','🌱','INVESTING','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],['Buffer design','🧱','RESILIENCE','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],['Behaviour design','🧠','BEHAVIOUR','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking entirely','Set an impossible target'],1],['Concentration risk','🎯','INVESTING','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],['Debt vs investing','💰','CREDIT','You can clear a £600 high-APR card or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],['Weekly reset','🥋','MASTERY','Plan £120 flexible spend; actual £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],['Rent reality','🏠','LIFE','Option A costs £725/month. B costs £775/month but saves £35/month transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],['Subscription trap','🔁','BEHAVIOUR','Subscriptions cost £7, £6, £5, £5, £4 and £3 monthly. Cancelling £6 and £5 saves…',['£11/year','£11/month','£66/month','£132/month'],1],['Liquidity first','🚨','RESILIENCE','You need £800 for a guaranteed university cost in three months. Strongest default principle?',['Take equity risk for upside','Keep required money accessible and low-risk','Use credit and invest the £800','Ignore the date'],1]];var state={xp:Number(localStorage.getItem('unidojo-quiz-xp')||0),done:JSON.parse(localStorage.getItem('unidojo-quiz-done')||'[]')};var app=document.getElementById('app');var current=0;function save(){localStorage.setItem('unidojo-quiz-xp',state.xp);localStorage.setItem('unidojo-quiz-done',JSON.stringify(state.done))}function render(i){current=i;var l=lessons[i];app.innerHTML='<div class="score"><span>Challenge '+(i+1)+' / '+lessons.length+'</span><span>XP '+state.xp+'</span></div><div class="progress"><i style="width:'+((i+1)/lessons.length*100)+'%"></i></div><section class="card"><div class="eyebrow">'+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><p>'+l[3]+'</p><div id="answers"></div></section>';var box=document.getElementById('answers');l[4].forEach(function(text,j){var b=document.createElement('button');b.className='choice';b.type='button';b.dataset.index=j;b.textContent=String.fromCharCode(65+j)+' · '+text;box.appendChild(b)});box.addEventListener('click',function(e){var b=e.target.closest('button.choice');if(!b||b.disabled)return;answer(Number(b.dataset.index))})}function answer(selected){var l=lessons[current],buttons=[].slice.call(document.querySelectorAll('.choice')),correct=selected===l[5];buttons.forEach(function(b){b.disabled=true});buttons[selected].classList.add(correct?'correct':'wrong');if(!correct)buttons[l[5]].classList.add('correct');if(correct&&!state.done.includes(current)){state.done.push(current);state.xp+=25}else if(correct)state.xp+=8;save();var note=document.createElement('div');note.className='card';note.innerHTML='<div class="eyebrow">COACH</div><h1>'+(correct?'You nailed it.':'Good miss.')+'</h1><p>The strongest answer is <b>'+String.fromCharCode(65+l[5])+' · '+l[4][l[5]]+'</b>.</p><button class="primary" id="next">'+(current+1<lessons.length?'Next challenge →':'Finish →')+'</button>';app.appendChild(note);document.getElementById('next').addEventListener('click',function(){render((current+1)%lessons.length)})}render(0)})();</script></body></html>
