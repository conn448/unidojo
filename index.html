<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--card:#151515;--card2:#202020;--line:#303030;--text:#fff;--muted:#9b9b9b;--orange:#ff9800;--green:#35d399;--red:#ff5d73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{border:1px solid #3a3a3a;border-radius:14px;background:var(--card2);color:#fff;padding:12px 14px;min-height:48px;cursor:pointer;touch-action:manipulation;user-select:none}
button:hover{border-color:#666}button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:default}.primary{background:var(--orange);border-color:var(--orange);color:#111;font-weight:900}
.wrap{max-width:760px;margin:auto;padding:15px 14px 105px}.brand{font-size:25px;font-weight:950;margin:3px 3px 17px}.brand span{color:var(--orange)}h1{font-size:34px;line-height:1.05;margin:8px 0 12px}h2{margin:4px 0 10px}.muted{color:var(--muted)}
.eyebrow,.tag{font-size:10px;font-weight:950;letter-spacing:.16em;color:var(--orange)}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#252525;color:#bbb;font-size:11px;font-weight:900}
.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{padding:21px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#0d0d0d;border:1px solid #292929;border-radius:15px;padding:12px;text-align:center}.stat b{font-size:20px}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--orange)}
.actions{display:flex;gap:9px}.actions>*{flex:1}.choice{display:block;width:100%;text-align:left;margin:8px 0;position:relative;z-index:2}.choice.selected{border-color:var(--orange);background:#30200c}.choice.correct{border-color:var(--green);background:#09271f}.choice.wrong{border-color:var(--red);background:#2b1117}
.input{display:block;width:100%;padding:13px;border:1px solid #3d3d3d;border-radius:13px;background:#090909;color:#fff;margin:7px 0 14px;outline:none}.lesson{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #2c2c2c;background:#141414;text-align:left;margin:7px 0;padding:12px;border-radius:16px}.node{width:46px;height:46px;display:grid;place-items:center;flex:0 0 46px;border-radius:14px;background:#222;border:1px solid #3c3c3c;font-size:20px}.nav{position:fixed;z-index:100;left:0;right:0;bottom:0;background:rgba(9,9,9,.98);border-top:1px solid #292929;display:flex;padding:7px 8px}.nav button{flex:1;border:0;background:transparent;font-size:12px;padding:7px 3px}.nav button.active{color:var(--orange);background:#1d1d1d}.toast{position:fixed;z-index:999;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 15px;border-radius:99px;font-weight:900;display:none}.toast.show{display:block}.up{color:var(--green)}.down{color:var(--red)}.mini{font-size:12px;color:var(--muted)}.stockrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #242424;gap:10px}.chart{height:230px;width:100%;background:#0b0b0b;border:1px solid #292929;border-radius:15px;margin:12px 0}.scenario{background:#0e0e0e;border-radius:15px;padding:14px;margin:10px 0}.success{color:var(--green)}.danger{color:var(--red)}
@media(max-width:520px){h1{font-size:30px}.grid3{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head>
<body>
<div id="toast" class="toast"></div><main class="wrap"><div class="brand">uni<span>dojo</span></div><div id="app"></div></main>
<nav class="nav"><button data-nav="home">⌂<br>Today</button><button data-nav="markets">◈<br>Markets</button><button data-nav="train">◎<br>Train</button><button data-nav="account">●<br>Profile</button></nav>
<script>
(function(){'use strict';
const KEY='unidojo-mvp-v4';
const OLD_KEY='unidojo-mvp-v3';
try{localStorage.removeItem(OLD_KEY)}catch(e){}
const DEFAULT={profile:null,xp:0,streak:0,lastDay:null,completed:[],hearts:5,cash:10000,holdings:{}};
let S=load(), step=1, screen='home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&typeof x==='object'?Object.assign({},DEFAULT,x):JSON.parse(JSON.stringify(DEFAULT))}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(x){return '£'+(Number(x)||0).toFixed(2)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
const LESSONS=[['Runway maths','🏃','Foundation','Calculate genuinely flexible cash.'],['Net income','🧾','Income','Use money you can actually spend.'],['Opportunity cost','⚔️','Decisions','Make trade-offs explicit.'],['Credit comparison','💳','Credit','Compare total borrowing cost.'],['Real returns','📈','Economics','Separate nominal return from purchasing power.'],['Compounding','🌱','Investing','See why time matters.'],['Buffer design','🧱','Resilience','Protect money needed for shocks.'],['Behaviour design','🧠','Behaviour','Build systems that survive real life.'],['Concentration risk','🎯','Investing','See single-company risk.'],['Debt vs investing','💰','Credit','Compare known borrowing costs with uncertain returns.'],['Weekly reset','🥋','Mastery','Turn spending data into one intervention.'],['Rent reality','🏠','Life','Compare total living costs.']];
const QUESTIONS=[
['You have £420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10','£17.14','£60','£70'],0,'£420 − £300 − £50 = £70; £70 ÷ 7 = £10.'],
['Which income figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer cost','Headline bonus'],1,'A spending plan starts from money you can actually access.'],
['You have £90 flexible money. Spending £45 tonight means £45 cannot fund another goal. What is that trade-off?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1,'Opportunity cost is what you give up by choosing the next-best alternative.'],
['Two cards advertise 19%. One has a compulsory annual fee. What should you compare?',['Headline rate only','APR / total borrowing cost','Minimum payment only','Brand'],1,'Fees can change the real cost. Compare APR and total borrowing cost.'],
['Savings return is 4% and inflation is 3%. Approximate real gain?',['7%','4%','1%','3%'],2,'A rough shortcut is 4% − 3% = about 1%.'],
['Why can starting earlier be powerful with the same monthly investment?',['More time for compounding','Risk disappears','Returns are guaranteed','Fees vanish'],0,'Time gives returns more opportunity to compound; it does not remove risk.'],
['You have £250 cash, irregular income and no emergency reserve. Best default?',['Spend it','Keep a protected reserve','Put it all in a high-risk asset','Borrow instead'],1,'A buffer improves resilience when income or expenses move unexpectedly.'],
['You repeatedly overspend on food during busy weeks. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking','Set an impossible target'],1,'Good behaviour design makes the desired action easier and realistic.'],
['Which portfolio has the clearest concentration risk?',['100% one company','Diversified global index fund','Cash across protected banks','Mixed asset classes'],0,'Holding one company creates substantial company-specific risk.'],
['You have a high-APR £600 card balance and £600 spare. What should you compare first?',['Expected investment return vs borrowing cost/risk','Best investment year','Card colour','Minimum payment'],0,'Borrowing costs are a known drag while investment returns are uncertain.'],
['Your £120 flexible plan became £154. Food +£8, transport +£4, social +£22. What is the best first intervention?',['Blame yourself','Target the largest controllable variance','Delete the budget','Cut everything'],1,'The largest controllable variance is social at +£22, so that is the clearest first intervention.'],
['Option A rent £725. Option B £775 but saves £35 transport monthly. Which is cheaper on rent + transport alone?',['A by £180/year','B by £180/year','B by £600/year','Same'],0,'B costs £600 more rent but saves £420 transport, so A is £180 cheaper per year.']];
const SCENARIOS=[['The £80 week','Budgeting','You have £120 flexible money. Food £52, transport £18 and social £25. What remains?',['£15','£25','£35','£45'],1,'£120 − £52 − £18 − £25 = £25.'],['The 25% fall','Investing','A £2,000 diversified portfolio falls 25%. New value?',['£500','£1,250','£1,500','£1,750'],2,'You retain 75%: £2,000 × 0.75 = £1,500.'],['The buffer','Resilience','You need £700 in 10 weeks for a known university cost. Best home?',['Volatile stock','Accessible low-risk cash','Speculative token','Long-term locked investment'],1,'Match risk and access to the timing and certainty of the liability.']];
const STOCKS={AAPL:['Apple',332.27,5.4,'Technology'],NVDA:['NVIDIA',176.10,12.8,'Semiconductors'],MSFT:['Microsoft',510.20,3.1,'Technology'],AMZN:['Amazon',232.15,-2.7,'Consumer'],GOOGL:['Alphabet',246.30,6.8,'Technology'],META:['Meta',748.40,9.2,'Technology'],TSLA:['Tesla',350.70,-6.4,'Automotive'],V:['Visa',350.10,2.2,'Financials']};
function ready(){return !!(S.profile&&S.profile.done)}function nav(which){screen=which;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===which))}
function render(){try{if(!ready()){renderOnboarding();return}({home,markets,train,account}[screen]||home)()}catch(e){document.getElementById('app').innerHTML='<div class="card"><div class="eyebrow danger">RECOVERED ERROR</div><h1>Unidojo recovered.</h1><p class="muted">'+esc(e.message||e)+'</p><button class="primary" data-action="reload">Reload dojo</button></div>'}}
function renderOnboarding(){nav('');const p=S.profile||{};let body='';if(step===1)body='<div class="card hero"><span class="pill">SET UP · 1/4</span><h1>Build your money profile.</h1><p class="muted">A quick starting point so Unidojo can teach from your reality.</p><label>First name</label><input class="input" id="name" value="'+esc(p.name||'')+'" placeholder="e.g. Conn"><label>Age</label><input class="input" id="age" type="number" value="'+esc(p.age||'')+'" placeholder="18"></div>';
if(step===2)body='<div class="card hero"><span class="pill">SET UP · 2/4</span><h1>Know your monthly reality.</h1><p class="muted">Rough numbers are fine.</p><label>Monthly income / money available (£)</label><input class="input" id="income" type="number" value="'+esc(p.income||'')+'" placeholder="850"><label>Monthly rent / housing (£)</label><input class="input" id="rent" type="number" value="'+esc(p.rent||'')+'" placeholder="750"><label>Typical weekly flexible spend (£)</label><input class="input" id="spend" type="number" value="'+esc(p.spend||'')+'" placeholder="80"></div>';
if(step===3)body='<div class="card hero"><span class="pill">SET UP · 3/4</span><h1>What do you want to get better at?</h1><p class="muted">Tap one. The whole button is clickable.</p>'+[['control','🎯 Control my spending'],['save','🧱 Build a cash buffer'],['invest','📈 Understand investing'],['debt','💳 Understand debt'],['all','🥋 Become good with money overall']].map(x=>'<button type="button" class="choice '+(p.goal===x[0]?'selected':'')+'" data-goal="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
if(step===4)body='<div class="card hero"><span class="pill">SET UP · 4/4</span><h1>How confident are you?</h1><p class="muted">Tap one. The whole button is clickable.</p>'+[['1','😵 I often feel lost'],['2','🙂 I know the basics'],['3','💪 I am fairly confident'],['4','🧠 I want harder questions']].map(x=>'<button type="button" class="choice '+(Number(p.confidence)===Number(x[0])?'selected':'')+'" data-confidence="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
document.getElementById('app').innerHTML=body+'<div class="progress"><i style="width:'+step*25+'%"></i></div><div class="actions"><button type="button" data-action="back">'+(step>1?'← Back':'')+'</button><button type="button" class="primary" data-action="next">'+(step===4?'Enter my dojo':'Continue →')+'</button></div>'}
function next(){const p=S.profile||{};if(step===1){p.name=(document.getElementById('name').value||'').trim();p.age=Number(document.getElementById('age').value);if(!p.name||!p.age){toast('Add your name and age');return}}else if(step===2){p.income=Number(document.getElementById('income').value)||0;p.rent=Number(document.getElementById('rent').value)||0;p.spend=Number(document.getElementById('spend').value)||0}else if(step===3&&!p.goal){toast('Pick a goal first');return}else if(step===4&&!p.confidence){toast('Pick your confidence first');return}S.profile=p;if(step===4){p.done=true;save();screen='home';toast('Your dojo is ready');setTimeout(render,200);return}save();step++;render()}
function focus(){const g=S.profile.goal||'all';return g==='invest'?'Investing':g==='debt'?'Credit':g==='save'?'Resilience':g==='control'?'Behaviour':'Foundation'}function belt(){return S.xp>=900?'BLACK':S.xp>=550?'RED':S.xp>=250?'BLUE':S.xp>=80?'GREEN':'WHITE'}
function home(){nav('home');const p=S.profile,remaining=LESSONS.map((_,i)=>i).filter(i=>!S.completed.includes(i));const id=remaining[0]??0;document.getElementById('app').innerHTML='<div class="eyebrow">TODAY</div><h1>Train your money brain.</h1><p class="muted">Good morning, '+esc(p.name)+'. Your next focus is <b>'+focus()+'</b>.</p><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">BELT</div><b>'+belt()+'</b></div><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">MASTERED</div><b>'+S.completed.length+'</b></div></div><div class="progress"><i style="width:'+Math.min(100,S.completed.length/LESSONS.length*100)+'%"></i></div><p class="muted">Next: <b>'+LESSONS[id][0]+'</b></p><button class="primary" data-lesson="'+id+'">Start today’s training →</button></div><div class="card"><div class="eyebrow">BRAIN INSIGHT</div><h2>Personalised by design</h2><p class="muted">Your goal and confidence set the starting point. Your answers build the learning loop.</p></div>'}
function train(){nav('train');let h='<div class="eyebrow">TRAINING ACADEMY</div><h1>Build real financial judgement.</h1><p class="muted">Short concepts, decisions and practical explanations.</p><div class="card">';LESSONS.forEach((l,i)=>{h+='<button class="lesson" data-lesson="'+i+'"><span class="node">'+l[1]+'</span><span><b>'+l[0]+'</b><small class="mini">'+(S.completed.includes(i)?'✓ Mastered · ':'')+l[3]+'</small></span></button>'});h+='</div><div class="card"><div class="eyebrow">SCENARIO LAB</div><h2>Real-life decisions</h2>';SCENARIOS.forEach((s,i)=>h+='<button class="lesson" data-scenario="'+i+'"><span class="node">⚡</span><span><b>'+s[0]+'</b><small class="mini">'+s[1]+' · decision challenge</small></span></button>');h+='</div>';document.getElementById('app').innerHTML=h}
function lesson(i){const l=LESSONS[i],q=QUESTIONS[i];document.getElementById('app').innerHTML='<div class="eyebrow">'+l[2].toUpperCase()+' · LESSON '+(i+1)+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="card hero"><p>'+q[0]+'</p>'+q[1].map((o,a)=>'<button class="choice" data-lesson="'+i+'" data-answer="'+a+'" data-correct="'+q[2]+'">'+o+'</button>').join('')+'</div><p class="muted">Lesson '+(i+1)+' of '+LESSONS.length+'</p>'}
function answer(i,a,c){const buttons=[...document.querySelectorAll('[data-answer]')];buttons.forEach(b=>b.disabled=true);const ok=a===c;if(buttons[a])buttons[a].classList.add(ok?'correct':'wrong');if(ok&&!S.completed.includes(i)){S.completed.push(i);S.xp+=30;save();toast('+30 XP')}const q=QUESTIONS[i];document.getElementById('app').insertAdjacentHTML('beforeend','<div class="card"><div class="eyebrow '+(ok?'success':'danger')+'">'+(ok?'CORRECT':'NOT QUITE')+'</div><h2>'+(ok?'Good judgement.':'That is the trap.')+'</h2><p class="muted">'+q[3]+'</p><button class="primary" data-nav-action="train">Continue training →</button></div>')}
function scenario(i){const s=SCENARIOS[i];document.getElementById('app').innerHTML='<div class="eyebrow">SCENARIO LAB · '+s[1].toUpperCase()+'</div><h1>⚡ '+s[0]+'</h1><div class="card hero"><div class="scenario"><b>'+s[2]+'</b></div>'+s[3].map((o,a)=>'<button class="choice" data-scenario="'+i+'" data-sanswer="'+a+'" data-scorrect="'+s[4]+'">'+o+'</button>').join('')+'</div>'}
function scenarioAnswer(i,a,c){const s=SCENARIOS[i],bs=[...document.querySelectorAll('[data-sanswer]')];bs.forEach(b=>b.disabled=true);const ok=a===c;if(bs[a])bs[a].classList.add(ok?'correct':'wrong');if(ok){S.xp+=50;save();toast('+50 XP')}document.getElementById('app').insertAdjacentHTML('beforeend','<div class="card"><div class="eyebrow '+(ok?'success':'danger')+'">'+(ok?'STRONG DECISION':'LEARNING MOMENT')+'</div><p class="muted">'+s[5]+'</p><button class="primary" data-nav-action="train">Continue →</button></div>')}
function portfolio(){let v=S.cash;Object.keys(S.holdings||{}).forEach(t=>v+=STOCKS[t][1]*(S.holdings[t]||0));return v}
function markets(){nav('markets');let h='<div class="eyebrow">PAPER MARKET</div><h1>Learn the market by doing.</h1><p class="muted">Simulated £10,000 account. No real money.</p><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">PORTFOLIO</div><b>'+money(portfolio())+'</b></div><div class="stat"><div class="tag">CASH</div><b>'+money(S.cash)+'</b></div><div class="stat"><div class="tag">POSITIONS</div><b>'+Object.keys(S.holdings||{}).length+'</b></div></div></div><div class="card"><div class="eyebrow">WATCHLIST</div>';Object.entries(STOCKS).forEach(([t,x])=>h+='<div class="stockrow"><div><b>'+t+' · '+x[0]+'</b><div class="mini">'+x[3]+' · '+money(x[1])+'</div></div><div><b class="'+(x[2]>=0?'up':'down')+'">'+(x[2]>=0?'+':'')+x[2].toFixed(1)+'%</b></div></div>');h+='</div>';document.getElementById('app').innerHTML=h}
function account(){nav('account');const p=S.profile;document.getElementById('app').innerHTML='<div class="eyebrow">PROFILE</div><h1>'+esc(p.name)+'’s dojo.</h1><div class="card hero"><div class="grid"><div><div class="tag">GOAL</div><h2>'+esc(p.goal||'all')+'</h2></div><div><div class="tag">CONFIDENCE</div><h2>'+p.confidence+'/4</h2></div></div><div class="grid"><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">STREAK</div><b>'+S.streak+' days</b></div></div></div><div class="card"><div class="eyebrow">FINANCIAL SNAPSHOT</div><div class="grid"><div class="stat"><div class="tag">MONTHLY MONEY</div><b>'+money(p.income)+'</b></div><div class="stat"><div class="tag">HOUSING</div><b>'+money(p.rent)+'</b></div></div></div><button data-action="reset">Reset demo profile</button>'}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.nav){nav(b.dataset.nav);render();return}
if(b.dataset.navAction){screen=b.dataset.navAction;render();return}
if(b.dataset.goal){S.profile=S.profile||{};S.profile.goal=b.dataset.goal;save();renderOnboarding();return}
if(b.dataset.confidence){S.profile=S.profile||{};S.profile.confidence=Number(b.dataset.confidence);save();renderOnboarding();return}
if(b.dataset.action==='next'){next();return}if(b.dataset.action==='back'){if(step>1){step--;renderOnboarding()}return}if(b.dataset.action==='reset'){localStorage.removeItem(KEY);S=load();step=1;screen='home';render();return}if(b.dataset.action==='reload'){location.reload();return}
if(b.dataset.lesson!==undefined){lesson(Number(b.dataset.lesson));return}if(b.dataset.scenario!==undefined){scenario(Number(b.dataset.scenario));return}
if(b.dataset.answer!==undefined){answer(Number(b.dataset.lesson||0),Number(b.dataset.answer),Number(b.dataset.correct));return}
if(b.dataset.sanswer!==undefined){scenarioAnswer(Number(b.dataset.scenario||0),Number(b.dataset.sanswer),Number(b.dataset.scorrect));return}
});
window.addEventListener('storage',()=>{S=load();render()});
if(!S.profile||!S.profile.done)renderOnboarding();else render();
})();
</script></body></html>
