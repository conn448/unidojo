<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--card:#151515;--card2:#1d1d1d;--line:#303030;--text:#fff;--muted:#9b9b9b;--orange:#ff9800;--green:#35d399;--red:#ff5d73}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid #3b3b3b;border-radius:14px;background:var(--card2);color:#fff;padding:12px 15px;min-height:48px;cursor:pointer}button.primary{background:var(--orange);border-color:var(--orange);color:#111;font-weight:900}.wrap{max-width:720px;margin:auto;padding:16px 14px 100px}.brand{font-size:25px;font-weight:950;margin:2px 3px 18px}.brand span{color:var(--orange)}h1{font-size:34px;line-height:1.05;margin:8px 0 13px}h2{margin:5px 0 12px}.muted{color:var(--muted)}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--orange)}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#252525;color:#bbb;font-size:11px;font-weight:900}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{padding:21px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0c0c0c;border:1px solid #292929;border-radius:15px;padding:12px;text-align:center}.big{font-size:42px;font-weight:950}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--orange)}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.correct{border-color:var(--green);background:#09271f}.choice.wrong{border-color:var(--red);background:#2b1117}.actions{display:flex;gap:9px}.actions>*{flex:1}.input{display:block;width:100%;padding:13px;border:1px solid #3d3d3d;border-radius:13px;background:#090909;color:#fff;margin:7px 0 14px;outline:none}.lesson{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;margin:2px 0}.node{width:50px;height:50px;display:grid;place-items:center;flex:0 0 50px;border-radius:16px;background:#202020;border:1px solid #3c3c3c}.locked{opacity:.35}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(9,9,9,.97);border-top:1px solid #292929;display:flex;padding:7px 8px}.nav button{flex:1;border:0;background:transparent;font-size:12px;padding:7px 3px}.nav button.active{color:var(--orange);background:#1d1d1d}.toast{position:fixed;z-index:99;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 15px;border-radius:99px;font-weight:900;display:none}.toast.show{display:block}.error{color:#ff9aaa}.success{color:var(--green)}@media(max-width:480px){h1{font-size:30px}.grid{gap:8px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<main class="wrap"><div class="brand">uni<span>dojo</span></div><div id="app"><div class="card hero"><div class="eyebrow">BOOTING</div><h1>Loading your dojo…</h1><p class="muted">Starting the local Unidojo engine.</p></div></div></main>
<nav class="nav"><button id="nToday" onclick="home()">⌂<br>Today</button><button id="nMarkets" onclick="markets()">◈<br>Markets</button><button id="nTrain" onclick="train()">◎<br>Train</button><button id="nAccount" onclick="account()">●<br>Account</button></nav>
<script>
(function(){
'use strict';
window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!window.__dojoBooted){a.innerHTML='<div class="card hero"><div class="eyebrow">BOOT ERROR</div><h1>Unidojo hit a JavaScript error.</h1><p class="error">'+String(e.message||'Unknown error').replace(/[<>]/g,'')+'</p><p class="muted">The shell is alive. This error is now visible instead of showing a blank page.</p></div>';}});
var app=document.getElementById('app'),KEY='unidojo-core-v6';
var LESSONS=[
['Runway maths','🏃','FOUNDATION','£420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10/day','£17.14/day','£60/day','£70/day'],1],
['Net income','🧾','INCOME','A £30,000 gross salary is offered. Which figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],
['Opportunity cost','⚔️','DECISIONS','You have £90 flexible money. Spending £45 on a night out means that £45 cannot fund another goal. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],
['Credit comparison','💳','CREDIT','Two cards advertise 19%. Card A has no mandatory fee; Card B has a compulsory £60 annual fee. What should you compare?',['Only headline rate','APR / total borrowing cost','Minimum payment only','Lender reputation'],1],
['Real returns','📈','ECONOMICS','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],
['Compounding','🌱','INVESTING','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],
['Buffer design','🧱','RESILIENCE','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],
['Behaviour design','🧠','BEHAVIOUR','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking entirely','Set an impossible target'],1],
['Concentration risk','🎯','INVESTING','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],
['Debt vs investing','💰','CREDIT','You can clear a £600 high-APR card or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],
['Weekly reset','🥋','MASTERY','Plan £120 flexible spend; actual £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],
['Rent reality','🏠','LIFE','Option A costs £725/month. B costs £775/month but saves £35/month transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],
['Subscription trap','🔁','BEHAVIOUR','Subscriptions cost £7, £6, £5, £5, £4 and £3 monthly. Cancelling £6 and £5 saves…',['£11/year','£11/month','£66/month','£132/month'],1],
['Liquidity first','🚨','RESILIENCE','You need £800 for a guaranteed university cost in three months. Strongest default principle?',['Take equity risk for upside','Keep required money accessible and low-risk','Use credit and invest the £800','Ignore the date'],1]
];
var STOCKS=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','V','NFLX','JPM','KO','MCD'];
var N={AAPL:'Apple',MSFT:'Microsoft',NVDA:'NVIDIA',AMZN:'Amazon',GOOGL:'Alphabet',META:'Meta',TSLA:'Tesla',V:'Visa',NFLX:'Netflix',JPM:'JPMorgan',KO:'Coca-Cola',MCD:"McDonald's"};
var SEED={AAPL:332.27,MSFT:510,NVDA:176,AMZN:232,GOOGL:246,META:748,TSLA:350,V:350,NFLX:1180,JPM:300,KO:70,MCD:310};
var S={profile:null,xp:0,streak:0,lastDay:null,completed:[],lesson:0,hearts:5,decisions:[],saved:0,cash:10000,holdings:{}};
try{var old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('unidojo-core-v5')||'{}');Object.assign(S,old)}catch(e){} if(typeof S.cash!=='number'||S.cash<0)S.cash=10000;if(!S.holdings)S.holdings={};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function money(n){return '£'+Math.max(0,Number(n)||0).toFixed(2)}function today(){return new Date().toISOString().slice(0,10)}function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1400)}function nav(a){['Today','Markets','Train','Account'].forEach(function(k){document.getElementById('n'+k).classList.toggle('active',a===k.toLowerCase())})}function ready(){return !!(S.profile&&S.profile.onboardingComplete)}function belt(){return S.xp>=800?'BLACK':S.xp>=450?'RED':S.xp>=220?'BLUE':S.xp>=80?'GREEN':'WHITE'}function xp(n){S.xp+=n;save();toast('+'+n+' XP')}
function onboarding(step){nav('');var p=S.profile||{},c='';if(step===1)c='<div class="card hero"><span class="pill">SET UP · 1/4</span><h1>Build your money profile.</h1><p class="muted">A quick starting point so Unidojo can teach from your reality.</p><label>First name</label><input class="input" id="name" value="'+(p.name||'')+'" placeholder="e.g. Conn"><label>Age</label><input class="input" id="age" type="number" value="'+(p.age||'')+'" placeholder="18"></div>';if(step===2)c='<div class="card hero"><span class="pill">SET UP · 2/4</span><h1>Know your monthly reality.</h1><p class="muted">Rough numbers are fine.</p><label>Monthly income / money available (£)</label><input class="input" id="income" type="number" value="'+(p.income??'')+'" placeholder="850"><label>Monthly rent / housing (£)</label><input class="input" id="rent" type="number" value="'+(p.rent??'')+'" placeholder="750"><label>Typical weekly flexible spend (£)</label><input class="input" id="spend" type="number" value="'+(p.weeklySpend??'')+'" placeholder="80"></div>';if(step===3)c='<div class="card hero"><span class="pill">SET UP · 3/4</span><h1>What do you want to get better at?</h1>'+['control|🎯 Control my spending','save|🧱 Build a cash buffer','invest|📈 Understand investing','debt|💳 Understand debt','all|🥋 Become good with money overall'].map(function(x){var a=x.split('|');return '<button class="choice '+(p.goal===a[0]?'selected':'')+'" onclick="goal(\''+a[0]+'\')">'+a[1]+'</button>'}).join('')+'</div>';if(step===4)c='<div class="card hero"><span class="pill">SET UP · 4/4</span><h1>How confident are you?</h1><p class="muted">This tunes your starting difficulty.</p>'+['1|😵 I often feel lost','2|🙂 I know the basics','3|💪 I am fairly confident','4|🧠 I want harder questions'].map(function(x){var a=x.split('|');return '<button class="choice '+(p.confidence==a[0]?'selected':'')+'" onclick="conf('+a[0]+')">'+a[1]+'</button>'}).join('')+'</div>';app.innerHTML=c+'<div class="progress"><i style="width:'+step*25+'%"></i></div><div class="actions"><button onclick="'+(step>1?'onback()':'')+'">'+(step>1?'← Back':'')+'</button><button class="primary" onclick="onnext('+step+')">'+(step===4?'Finish setup':'Continue →')+'</button></div>'}
function goal(v){S.profile=S.profile||{};S.profile.goal=v;save();onboarding(3)}function conf(v){S.profile=S.profile||{};S.profile.confidence=v;save();onboarding(4)}function onback(){onboarding(Math.max(1,(S.onStep||1)-1))}
function onnext(step){S.onStep=step;var p=S.profile||{};if(step===1){p.name=document.getElementById('name').value.trim();p.age=+document.getElementById('age').value;if(!p.name||!p.age)return toast('Add your name and age')}if(step===2){p.income=+document.getElementById('income').value||0;p.rent=+document.getElementById('rent').value||0;p.weeklySpend=+document.getElementById('spend').value||0}if(step===3&&!p.goal)return toast('Pick a goal');if(step===4&&!p.confidence)return toast('Pick your confidence level');if(step===4)p.onboardingComplete=true;S.profile=p;save();if(step===4)gate();else onboarding(step+1)}
function gate(){nav('');app.innerHTML='<div class="card hero"><span class="pill">YOUR DOJO IS READY</span><h1>Save your progress?</h1><p class="muted">Create a free account to sync progress across devices, or start immediately as a guest.</p><div class="actions"><button class="primary" onclick="account()">Create account</button><button onclick="home()">Continue as guest</button></div></div>'}
function home(){if(!ready())return onboarding(1);nav('today');var daily=S.lastDay===today();if(!daily){S.streak=S.lastDay&&new Date(today())-new Date(S.lastDay)===86400000?S.streak+1:1;S.lastDay=today();S.lesson=(S.lesson+1)%LESSONS.length;save()}var l=LESSONS[S.lesson],d=S.profile||{};app.innerHTML='<div class="row"><div><div class="eyebrow">TODAY</div><h1>Train your money brain.</h1></div><span class="pill">🔥 '+S.streak+' day'+(S.streak===1?'':'s')+'</span></div><div class="card hero"><div class="grid"><div><div class="muted">BELT</div><h2>'+belt()+'</h2></div><div style="text-align:right"><div class="muted">XP</div><b>'+S.xp+'</b></div></div><div class="progress"><i style="width:'+Math.min(100,(S.xp%80)/80*100)+'%"></i></div></div><div class="card"><div class="eyebrow">TODAY’S MISSION</div><h2>'+l[1]+' '+l[0]+'</h2><p>'+l[3]+'</p><button class="primary" onclick="lesson('+S.lesson+')">Start challenge →</button></div><div class="card"><div class="eyebrow">REAL MONEY</div><h2>Can I afford it?</h2><input class="input" id="purchase" type="number" placeholder="Purchase amount (£)"><button class="primary" onclick="afford()">Check the trade-off</button></div><div class="grid"><div class="stat"><b>'+money(S.saved)+'</b><br><small class="muted">retained</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">decisions</small></div></div><div class="card"><div class="eyebrow">FEATURE</div><h2>Markets</h2><p class="muted">Practise investing with £10,000 virtual cash.</p><button onclick="markets()">Open Markets →</button></div>'}
function afford(){var n=+document.getElementById('purchase').value||0;if(n<=0)return toast('Enter a purchase amount');var daily=(+S.profile.weeklySpend||0)/7;app.innerHTML='<button onclick="home()">← Today</button><div class="card hero"><div class="eyebrow">TRADE-OFF</div><div class="big">'+money(n)+'</div><p>Your usual flexible spend is about <b>'+money(daily)+'</b> per day.</p><div class="grid"><div class="stat"><b>'+money(Math.max(0,daily-n/7))+'</b><br><small class="muted">daily room after</small></div><div class="stat"><b>'+(n>daily*7?'HIGH':'WITHIN PLAN')+'</b><br><small class="muted">vs weekly spend</small></div></div><p class="muted">Unidojo makes the trade-off visible; it does not tell you what to buy.</p><div class="actions"><button class="primary" onclick="decision(\'bought\','+n+')">I bought it</button><button onclick="decision(\'skipped\','+n+')">I skipped it</button></div></div>'}
function decision(out,n){S.decisions.push({amount:n,outcome:out,date:today()});if(out==='skipped'){S.saved+=n;xp(10)}else xp(5);setTimeout(home,600)}
function train(){if(!ready())return onboarding(1);nav('train');var html='<div class="eyebrow">TRAIN</div><h1>Your money skill tree.</h1><p class="muted">Master real financial decisions. The route and question format rotate.</p><div class="card"><b>'+S.completed.length+'/'+LESSONS.length+' skills cleared</b><div class="progress"><i style="width:'+(S.completed.length/LESSONS.length*100)+'%"></i></div></div><div class="card">';LESSONS.forEach(function(l,i){var done=S.completed.indexOf(i)>=0,locked=i>0&&S.completed.indexOf(i-1)<0;html+='<button class="lesson '+(locked?'locked':'')+'" '+(locked?'disabled':'')+' onclick="lesson('+i+')"><span class="node">'+(done?'✓':l[1])+'</span><span><b>'+l[0]+'</b><br><small class="muted">'+l[2]+' · '+(done?'MASTERED':locked?'LOCKED':'READY')+'</small></span></button>'});html+='</div>';app.innerHTML=html}
function lesson(i){var l=LESSONS[i],formats=['SCENARIO','RAPID FIRE','MONEY MATH','WHAT WOULD YOU DO?','SPOT THE TRAP'],f=formats[(i+S.xp)%formats.length];app.innerHTML='<button onclick="train()">← Skill tree</button><div class="card hero"><span class="pill">'+f+'</span><div class="eyebrow">'+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><p>'+l[3]+'</p><div id="answers">'+l[4].map(function(x,j){return '<button class="choice" onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+' · '+x+'</button>'}).join('')+'</div></div>'}
function answer(i,a){var l=LESSONS[i],bs=[].slice.call(document.querySelectorAll('#answers .choice'));bs.forEach(function(b){b.disabled=true});var ok=a===l[5];bs[a].classList.add(ok?'correct':'wrong');if(!ok)bs[l[5]].classList.add('correct');if(ok&&!S.completed.includes(i)){S.completed.push(i);xp(25)}else if(ok)xp(8);else{S.hearts=Math.max(0,S.hearts-1);save();toast('Not quite — study the correction')}setTimeout(function(){app.innerHTML='<div class="card hero"><div class="eyebrow">COACH</div><h1>'+ (ok?'You nailed it.':'Good miss. That is what practice is for.')+'</h1><p>'+l[4][l[5]]+'</p><button class="primary" onclick="nextLesson()">Next challenge →</button></div>'},500)}
function nextLesson(){var pool=LESSONS.map(function(_,i){return i}).filter(function(i){return !S.completed.includes(i)});lesson(pool.length?pool[Math.floor(Math.random()*pool.length)]:Math.floor(Math.random()*LESSONS.length))}
function markets(){if(!ready())return onboarding(1);nav('markets');app.innerHTML='<div class="eyrow">FEATURE</div><h1>Markets</h1><div class="card"><div class="muted">VIRTUAL CASH</div><div class="big">'+money(S.cash)+'</div><p class="muted">Paper trading is one feature of Unidojo.</p></div>'+STOCKS.map(function(t){return '<div class="card"><div class="grid"><div><b>'+t+'</b><br><span class="muted">'+N[t]+'</span></div><div style="text-align:right"><b>$'+SEED[t].toFixed(2)+'</b></div></div><button class="primary" onclick="trade(\''+t+'\')">Open '+t+' →</button></div>'}).join('')}
function trade(t){var p=SEED[t];app.innerHTML='<button onclick="markets()">← Markets</button><div class="card hero"><div class="eyebrow">'+N[t]+' · '+t+'</div><h1>$'+p.toFixed(2)+'</h1><label>Quantity</label><input class="input" id="qty" type="number" min="1" value="1"><div class="grid"><div class="stat"><b>'+money(S.cash)+'</b><br><small class="muted">cash</small></div><div class="stat"><b>'+(S.holdings[t]||0)+'</b><br><small class="muted">shares</small></div></div><div class="actions"><button class="primary" onclick="buy(\''+t+'\')">Buy shares</button><button onclick="sell(\''+t+'\')">Sell shares</button></div></div>'}
function buy(t){var q=Math.max(1,Math.floor(+document.getElementById('qty').value||1)),c=q*SEED[t];if(c>S.cash)return toast('Not enough virtual cash');S.cash-=c;S.holdings[t]=(S.holdings[t]||0)+q;save();toast('Bought '+q+' shares');trade(t)}function sell(t){var q=Math.max(1,Math.floor(+document.getElementById('qty').value||1));if((S.holdings[t]||0)<q)return toast('Not enough shares');S.holdings[t]-=q;S.cash+=q*SEED[t];save();toast('Sold '+q+' shares');trade(t)}
function account(){nav('account');app.innerHTML='<div class="eyebrow">ACCOUNT</div><h1>Save your dojo.</h1><div class="card"><p class="muted">Guest progress stays on this device. Accounts will sync progress across devices.</p><label>Email</label><input class="input" id="email" type="email" placeholder="you@example.com"><label>Password</label><input class="input" id="pw" type="password" placeholder="8+ characters"><div class="actions"><button class="primary" onclick="auth(\'signup\')">Create account</button><button onclick="auth(\'signin\')">Sign in</button></div><div id="auth"></div></div><div class="card"><div class="grid"><div class="stat"><b>'+S.xp+'</b><br><small class="muted">XP</small></div><div class="stat"><b>'+belt()+'</b><br><small class="muted">belt</small></div></div></div>'}
function auth(mode){var msg=document.getElementById('auth');msg.innerHTML='<p class="muted">Account service loading…</p>';var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=function(){fetch('supabase-config.js').then(function(r){return r.text()}).then(function(txt){(0,eval)(txt);var c=window.supabase.createClient(window.UNIDOJO_SUPABASE_URL,window.UNIDOJO_SUPABASE_KEY);var email=document.getElementById('email').value,pw=document.getElementById('pw').value;var op=mode==='signup'?c.auth.signUp({email:email,password:pw}):c.auth.signInWithPassword({email:email,password:pw});return op}).then(function(r){msg.innerHTML=r.error?'<p class="error">'+r.error.message+'</p>':'<p class="success">'+(mode==='signup'&&!r.data.session?'Check your email to confirm your account.':'Signed in.')+'</p>'}).catch(function(e){msg.innerHTML='<p class="error">'+String(e.message||e)+'</p>'})};s.onerror=function(){msg.innerHTML='<p class="error">Account service could not load. Unidojo itself is working.</p>'};document.head.appendChild(s)}
window.home=home;window.markets=markets;window.train=train;window.account=account;window.goal=goal;window.conf=conf;window.onnext=onnext;window.onback=onback;window.lesson=lesson;window.answer=answer;window.nextLesson=nextLesson;window.afford=afford;window.decision=decision;window.trade=trade;window.buy=buy;window.sell=sell;window.auth=auth;
window.__dojoBooted=true;save();if(ready())home();else onboarding(1);
})();
</script>
</body>
</html>
