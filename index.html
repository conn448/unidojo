<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><meta name="apple-mobile-web-app-capable" content="yes"><title>Unidojo — Train your money brain</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#080808;--panel:#111;--panel2:#171717;--line:#292929;--text:#fafafa;--muted:#949494;--orange:#ff8a00;--orange2:#ffb000;--green:#35d399;--red:#ff5d73;--blue:#67a8ff;--shadow:0 18px 50px #0008}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#2a1705 0,#0b0b0b 30%,#080808 65%);background-attachment:fixed;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 17px calc(112px + env(safe-area-inset-bottom));}.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;padding:2px 0 13px;z-index:5;background:linear-gradient(#090909 65%,transparent)}.brand{font-weight:950;font-size:25px;letter-spacing:-1.2px}.brand span,.orange{color:var(--orange)}.stats{display:flex;gap:8px}.mini{border:1px solid #333;background:#151515;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.eyebrow{color:var(--orange);font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.muted{color:var(--muted)}h1{font-size:36px;line-height:.98;letter-spacing:-1.7px;margin:7px 0 12px}h2{letter-spacing:-.7px;margin:6px 0}.sub{font-size:15px;line-height:1.5}.panel,.mission,.decision{background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #2c2c2c;border-radius:23px;padding:18px;box-shadow:0 10px 35px #0005}.hero{position:relative;overflow:hidden;padding:22px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-70px;background:#ff8a0018;filter:blur(4px)}.big{font-size:53px;line-height:1;font-weight:950;letter-spacing:-3px}.btn{width:100%;border:0;border-radius:15px;padding:15px 18px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#111;font:inherit;font-weight:950;cursor:pointer;margin-top:13px;box-shadow:0 5px 0 #a95100,0 10px 25px #ff8a0018;transition:.15s transform}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a95100}.secondary{background:#242424;color:#fff;box-shadow:0 4px 0 #050505}.ghost{background:transparent;color:#aaa;border:1px solid #333;box-shadow:none}.danger{color:#ff8a8a}.field{width:100%;margin-top:7px;padding:15px;border-radius:14px;border:1px solid #3b3b3b;background:#090909;color:#fff;font:inherit}.field:focus{outline:2px solid var(--orange)}label{display:block;margin-top:16px;font-size:13px;font-weight:850}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:13px;text-align:center}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:99px}.pill,.tag{display:inline-block;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:950}.pill{background:#2b1d08;color:#ffc15c}.good{background:#073b2b;color:#86efac}.bad{background:#42121b;color:#fda4af}.mission{border-color:#4b3211;background:linear-gradient(145deg,#211708,#11100e)}.decision{border:1px solid #784600;background:linear-gradient(145deg,#211506,#12100d)}.bottom{position:fixed;left:0;right:0;bottom:0;background:#090909ed;backdrop-filter:blur(16px);border-top:1px solid #252525;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom-in{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{border:0;background:none;color:#777;padding:10px 3px 9px;font:inherit;font-size:10px;font-weight:900;cursor:pointer}.bottom button.active{color:var(--orange)}.bottom b{display:block;font-size:20px;margin-bottom:2px}.choice{display:block;width:100%;margin-top:10px;padding:15px;border:2px solid #2e2e2e;border-radius:15px;background:#111;color:#fff;text-align:left;font:inherit;cursor:pointer;transition:.15s}.choice:hover{border-color:#555;transform:translateY(-1px)}.choice.correct{border-color:var(--green);background:#09271f}.choice.wrong{border-color:var(--red);background:#2b1117}.choice:disabled{cursor:default}.node{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:#202020;border:1px solid #3a3a3a;font-size:22px;flex:none}.lesson{display:flex;gap:13px;align-items:center;width:100%;padding:13px 2px;background:none;color:#fff;border:0;text-align:left;cursor:pointer}.lesson:disabled{opacity:.3}.game{border:1px solid #333;border-radius:22px;padding:17px;background:linear-gradient(145deg,#161616,#0d0d0d);cursor:pointer;text-align:left;color:#fff;width:100%;margin-top:11px;transition:.16s}.game:hover{transform:translateY(-2px);border-color:#555}.game-icon{font-size:34px;float:right}.score{font-size:38px;font-weight:950}.timer{height:7px;background:#292929;border-radius:99px;overflow:hidden}.timer i{display:block;height:100%;background:var(--orange);width:100%;transform-origin:left}.combo{font-weight:950;color:#ffc15c}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 16px;border-radius:99px;font-weight:950;z-index:99;display:none;box-shadow:0 8px 25px #000}.toast.show{display:block}.small{font-size:12px}.spacer{height:8px}.float{animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}.pop{animation:pop .22s ease-out}.streak-fire{font-size:42px}@media(min-width:700px){.app{padding-top:25px}}
</style></head><body><div id="toast" class="toast"></div><main id="app"></main><script>(()=>{'use strict';
const KEY='unidojo-duo-v7',day=()=>new Date().toISOString().slice(0,10),$=s=>document.querySelector(s),money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2),days=d=>Math.max(1,Math.ceil((new Date(d)-new Date(day()))/864e5));
const L=[
['Runway maths','🏃','FOUNDATION','£420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10','£17.14','£60','£70'],1],['Net income','🧾','INCOME','A £30,000 gross salary is quoted. Which figure belongs in your monthly spending plan?',['£30,000 gross','Expected net pay received','Employer payroll cost','Headline bonus'],1],['Opportunity cost','⚔️','DECISIONS','You have £90 flexible money. Spending £45 on a night out means that £45 cannot fund another goal this week. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],['Credit comparison','💳','CREDIT','Two cards advertise 19%. Card A has no mandatory fee; Card B has a compulsory £60 annual fee. What should you compare?',['Only headline rate','APR / total borrowing cost','Minimum payment only','Lender reputation'],1],['Real returns','📈','ECONOMICS','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],['Compounding','🌱','INVESTING','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],['Buffer design','🧱','RESILIENCE','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],['Behaviour design','🧠','BEHAVIOUR','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking entirely','Set an impossible target'],1],['Concentration risk','🎯','INVESTING','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],['Debt vs investing','💰','CREDIT','You can clear a £600 high-APR card or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],['Weekly reset','🥋','MASTERY','Plan £120 flexible spend; actual £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],['Rent reality','🏠','LIFE','Option A costs £725/month. B costs £775/month but saves £35/month transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],['Subscription trap','🔁','BEHAVIOUR','Subscriptions cost £7, £6, £5, £5, £4 and £3 monthly. Cancelling £6 and £5 saves…',['£11/year','£11/month','£66/month','£132/month'],1],['Liquidity first','🚨','RESILIENCE','You need £800 for a guaranteed university cost in three months. Strongest default principle?',['Take equity risk for upside','Keep required money accessible and low-risk','Use credit and invest the £800','Ignore the date'],1]];
const GAMES=[['sprint','⚡','Money Sprint','Beat the clock. Fast finance decisions.','Speed + accuracy'],['duel','⚔️','Decision Duel','Two choices. One real-world consequence.','Judgement under pressure'],['streak','🔥','Streak Run','Stack small wins across your week.','Consistency > perfection']];
let S={profile:null,tab:'today',xp:0,streak:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,purchase:0,missionDay:null,missionDone:false,skips:0,saved:0,weekQuests:0,game:null,gameIndex:0,gameScore:0,combo:0,gameDone:false};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(t){let x=$('#toast');if(!x)return;x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function M(){let p=S.profile||{},d=days(p.payday),a=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0));return{d,a,daily:a/d}}function belt(){return S.xp>=800?'BLACK':S.xp>=450?'RED':S.xp>=220?'BLUE':S.xp>=80?'GREEN':'WHITE'}function next(){return S.xp<80?80:S.xp<220?220:S.xp<450?450:S.xp<800?800:1200}
function nav(){return '<nav class="bottom"><div class="bottom-in">'+[['today','⌂','Today'],['train','◈','Train'],['dojo','♛','Dojo']].map(x=>'<button type="button" data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>'}function shell(x,n=true){return '<div class="app">'+x+(n?nav():'')+'</div>'}function top(){return '<div class="top"><div class="brand">uni<span>dojo</span></div><div class="stats"><span class="mini">🔥 '+S.streak+'</span><span class="mini">♥ '+S.hearts+'</span></div></div>'}
function welcome(){return shell(top()+'<section style="padding-top:35px" class="pop"><div class="streak-fire float">🥋</div><div class="eyebrow" style="margin-top:15px">THE MONEY TRAINING GROUND</div><h1 style="font-size:48px">Stop learning<br>money. <span class="orange">Train it.</span></h1><p class="muted sub">A game for real student decisions. Build your financial instincts, climb the belts and get better with every move.</p><div class="panel hero" style="margin-top:20px"><div class="eyebrow">YOUR FIRST RUN</div><h2>Can you survive the week?</h2><p class="muted">Set your runway. Make decisions. Beat challenges. Unlock harder levels.</p><div class="grid2"><span class="tag">⚡ fast challenges</span><span class="tag">🏆 belts + XP</span><span class="tag">🔥 streaks</span><span class="tag">🧠 real finance</span></div></div><button type="button" class="btn" data-act="setup">Enter the dojo →</button><p class="muted small" style="text-align:center">No bank connection · Your data stays on this device</p></section>',false)}
function setup(s){let p=S.profile||{};if(s===1)return shell(top()+'<div style="margin-top:32px"><div class="eyebrow">SETUP / 01</div><h1>Load your starting stats.</h1><p class="muted sub">Your game adapts to your actual cash runway.</p><label>Current balance<input id="balance" class="field" type="number" min="0" step=".01" value="'+(p.balance??'')+'" placeholder="180"></label><label>Next payday / income<input id="payday" class="field" type="date" min="'+day()+'" value="'+(p.payday||'')+'"></label><button type="button" class="btn" data-act="setup2">Next →</button></div>',false);return shell(top()+'<button type="button" class="btn ghost" data-act="setup1">← Back</button><div style="margin-top:24px"><div class="eyebrow">SETUP / 02</div><h1>Protect the essentials.</h1><p class="muted sub">Only money you should not casually spend before payday.</p><label>Essentials due<input id="bills" class="field" type="number" min="0" step=".01" value="'+(p.bills??'')+'" placeholder="40"></label><label>Protected buffer<input id="buffer" class="field" type="number" min="0" step=".01" value="'+(p.buffer??'')+'" placeholder="20"></label><button type="button" class="btn" data-act="finishSetup">Launch dojo ⚡</button></div>',false)}
function mission(){let done=S.missionDay===day()&&S.missionDone;return '<div class="mission"><div class="eyebrow">🎯 DAILY QUEST · +25 XP</div><h2>'+(done?'Quest complete. Come back tomorrow.':'Make one real money decision.')+'</h2><p class="muted">'+(done?'Your streak is alive. Your next move is waiting.':'Use the decision engine on something you might actually buy today.')+'</p><button type="button" class="btn '+(done?'secondary':'')+'" data-act="decide">'+(done?'Replay decision':'Start quest')+'</button></div>'}
function today(){let m=M(),left=Math.max(0,m.daily-S.spent),p=Math.min(100,S.spent/(m.daily||1)*100);return shell(top()+'<div style="margin-top:20px"><div class="eyebrow">DAY '+(S.streak||1)+' · '+belt()+' BELT</div><h1>Your money.<br><span class="orange">Your game.</span></h1><div class="panel hero"><div class="eyebrow">FLEXIBLE ROOM / DAY</div><div class="big orange">'+money(m.daily)+'</div><p class="muted">'+m.d+' days to payday · '+money(left)+' left after today’s logged spend</p><div class="progress"><i style="width:'+p+'%"></i></div></div><div style="margin-top:13px">'+mission()+'</div><div class="eyebrow" style="margin-top:25px">PLAY</div><button type="button" class="game" data-act="gameMenu"><span class="game-icon">⚡</span><div class="eyebrow">ARCADE</div><h2>Play a finance game</h2><p class="muted small">Fast rounds, combos and high scores. '+S.xp+' XP earned.</p></button><div class="decision" style="margin-top:12px"><div class="eyebrow">REAL-WORLD MODE</div><h2>Can I afford it?</h2><p class="muted">The one game where the answer affects your actual week.</p><button type="button" class="btn" data-act="decide">Check a purchase</button></div><div class="grid2" style="margin-top:12px"><div class="stat"><b class="orange">'+S.xp+'</b><br><small class="muted">XP</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">decisions</small></div></div></div>')}
function decide(){return shell(top()+'<button type="button" class="btn ghost" data-act="today">← Back</button><div style="margin-top:25px"><div class="eyebrow">REAL-WORLD MODE</div><h1>Make the call.</h1><p class="muted sub">No judgement. See the consequence before you spend.</p><label>Purchase amount<input id="purchase" class="field" type="number" min="0" step=".01" inputmode="decimal" placeholder="18" style="font-size:26px;font-weight:900"></label><button type="button" class="btn" data-act="analyse">Show consequence →</button></div>',false)}
function result(){let m=M(),v=+S.purchase||0,after=Math.max(0,m.a-v),ad=after/m.d,ratio=m.daily?v/m.daily:99;return shell(top()+'<button type="button" class="btn ghost" data-act="decide">← Change amount</button><div style="margin-top:25px"><div class="eyebrow">TRADE-OFF</div><div class="panel hero" style="margin-top:12px;text-align:center"><span class="pill '+(ratio>2?'bad':ratio>1?'':'good')+'">'+(ratio>2?'BIG MOVE · PAUSE':ratio>1?'CHECK THE TRADE-OFF':'FITS YOUR PLAN')+'</span><div class="big orange">'+money(v)+'</div><div class="muted">purchase</div><div class="grid2" style="margin-top:18px"><div class="stat"><small class="muted">BEFORE</small><br><b>'+money(m.daily)+'</b>/day</div><div class="stat"><small class="muted">AFTER</small><br><b>'+money(ad)+'</b>/day</div></div></div><div class="decision" style="margin-top:13px"><b>'+money(Math.max(0,m.daily-ad))+' less daily room.</b><p class="muted small">Now make the real-world call. Logging it teaches your future Unidojo.</p></div><div class="grid2"><button type="button" class="btn" data-act="bought">Bought it</button><button type="button" class="btn secondary" data-act="skipped">Skipped it</button></div></div>',false)}
function gameMenu(){return shell(top()+'<div style="margin-top:25px"><div class="eyebrow">ARCADE</div><h1>Pick your mode.</h1><p class="muted sub">Three ways to train the same thing: better financial judgement.</p>'+GAMES.map(g=>'<button type="button" class="game" data-act="startGame" data-game="'+g[0]+'"><span class="game-icon">'+g[1]+'</span><div class="eyebrow">'+g[4]+'</div><h2>'+g[2]+'</h2><p class="muted small">'+g[3]+'</p><span class="tag">PLAY →</span></button>').join('')+'</div>',false)}
function sprint(){let q=L[S.gameIndex%L.length],total=5;return shell(top()+'<div style="margin-top:20px"><div class="top" style="position:static"><div><div class="eyebrow">⚡ MONEY SPRINT</div><b>ROUND '+(S.gameIndex+1)+' / '+total+'</b></div><div class="score orange">'+S.gameScore+'</div></div><div class="timer" style="margin-top:10px"><i id="timerbar"></i></div><div class="panel hero" style="margin-top:16px"><span class="pill">COMBO ×'+Math.max(1,S.combo)+'</span><h2 style="margin-top:16px">'+q[3]+'</h2></div>'+q[4].map((o,i)=>'<button type="button" class="choice" data-act="gameAnswer" data-i="'+i+'">'+o+'</button>').join('')+'<p class="muted small" style="text-align:center;margin-top:16px">Fast answer = more points. Accuracy keeps the combo.</p></div>',false)}
function duel(){let a=[['You have £75 until Friday. A £35 night out is offered.','Skip or downgrade the night out','Go and hope'],['Your food budget is leaking by £22/week.','Fix the default meal option','Make the budget more complicated'],['A card charges 29.9% APR. You have spare cash.','Clear expensive debt first','Invest it regardless']][S.gameIndex%3];return shell(top()+'<div style="margin-top:20px"><div class="eyebrow">⚔️ DECISION DUEL</div><div class="score orange">'+S.gameScore+' XP</div><div class="panel hero" style="margin-top:15px"><h2>'+a[0]+'</h2><p class="muted">Which move has the stronger financial logic?</p></div><button type="button" class="choice" data-act="duelAnswer" data-i="0">A · '+a[1]+'</button><button type="button" class="choice" data-act="duelAnswer" data-i="1">B · '+a[2]+'</button></div>',false)}
function streakGame(){let q=[['What protects a student from a surprise £150 cost?','A protected cash buffer','A bigger subscription'],['Which habit is easier to sustain?','A realistic weekly rule','An impossible daily target'],['What is a recurring leak?','A subscription you rarely use','A one-off purchase']][S.gameIndex%3];return shell(top()+'<div style="margin-top:20px"><div class="eyebrow">🔥 STREAK RUN</div><h1>Stack the wins.</h1><div class="panel"><span class="pill">ROUND '+(S.gameIndex+1)+' / 3</span><h2>'+q[0]+'</h2><button type="button" class="choice" data-act="streakAnswer" data-i="0">'+q[1]+'</button><button type="button" class="choice" data-act="streakAnswer" data-i="1">'+q[2]+'</button></div></div>',false)}
function game(){if(S.game==='sprint')return sprint();if(S.game==='duel')return duel();return streakGame()}
function gameResult(){return shell(top()+'<div style="padding-top:35px;text-align:center" class="pop"><div style="font-size:65px">'+(S.gameScore>=40?'🏆':'⚡')+'</div><div class="eyebrow">RUN COMPLETE</div><h1>'+S.gameScore+' <span class="orange">XP</span></h1><p class="muted sub">'+(S.combo>2?'🔥 Combo master. You were cooking.':'Solid run. Come back and beat your score.')+'</p><div class="panel"><div class="grid2"><div class="stat"><b>'+S.gameScore+'</b><br><small class="muted">score</small></div><div class="stat"><b>×'+S.combo+'</b><br><small class="muted">best combo</small></div></div></div><button type="button" class="btn" data-act="gameMenu">Play again</button><button type="button" class="btn secondary" data-act="today">Back to dojo</button></div>',false)}
function train(){let prog=Math.min(100,S.xp/next()*100);return shell(top()+'<div style="margin-top:23px"><div class="eyebrow">TRAIN</div><h1>Build your<br><span class="orange">money brain.</span></h1><div class="panel"><b>'+belt()+' BELT</b><span class="orange" style="float:right">'+S.xp+' XP</span><div class="progress" style="margin-top:13px"><i style="width:'+prog+'%"></i></div><p class="muted small">'+Math.max(0,next()-S.xp)+' XP to next belt</p></div><button type="button" class="game" data-act="gameMenu"><span class="game-icon">⚡</span><div class="eyebrow">ARCADE</div><h2>Play instead of reading.</h2><p class="muted small">Sprint, duel and build streaks.</p></button><div class="eyebrow" style="margin-top:24px">SKILL TREE</div><div style="margin-top:8px">'+L.map((l,i)=>{let open=i<=S.completed.length,done=S.completed.includes(i);return '<button type="button" class="lesson" data-act="lesson" data-i="'+i+'" '+(!open?'disabled':'')+'><span class="node">'+(done?'✓':l[1])+'</span><span><span class="eyebrow">'+l[2]+'</span><br><b>'+l[0]+'</b><br><small class="muted">'+(done?'MASTERED · +20 XP':open?'READY · PLAY':'LOCKED')+'</small></span></button>'}).join('')+'</div></div>')}
function lesson(){let l=L[S.lesson],answered=S.answer!==null;return shell(top()+'<button type="button" class="btn ghost" data-act="train">← Skill tree</button><div style="margin-top:22px"><div class="eyebrow">CHALLENGE '+(S.lesson+1)+' / '+L.length+' · '+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="panel"><p class="muted">'+l[2]+' skill. Apply it, don't memorise it.</p><h2>'+l[3]+'</h2></div>'+l[4].map((o,i)=>'<button type="button" class="choice '+(answered?(i===l[5]?'correct':i===S.answer?'wrong':''):'')+'" data-act="answer" data-i="'+i+'" '+(answered?'disabled':'')+'><b>'+(i+1)+'.</b> '+o+'</button>').join('')+(answered?'<div class="panel pop" style="margin-top:14px"><b>'+(S.answer===l[5]?'🔥 Nailed it.':'Not quite.')+'</b><p class="muted">'+(S.answer===l[5]?'You have the concept. Now take it into the real world.':'Correct move: '+l[4][l[5]]+'.')+'</p></div><button type="button" class="btn" data-act="nextLesson">'+(S.lesson<L.length-1?'Next challenge →':'Finish run →')+'</button>':'')+'</div>',false)}
function dojo(){let p=Math.min(100,S.xp/next()*100);return shell(top()+'<div style="margin-top:23px"><div class="eyebrow">YOUR PROFILE</div><h1>Build the <span class="orange">legend.</span></h1><div class="panel hero"><div class="eyebrow">CURRENT RANK</div><div class="big orange">'+belt()+'</div><p class="muted">'+S.xp+' XP · '+Math.max(0,next()-S.xp)+' to next belt</p><div class="progress"><i style="width:'+p+'%"></i></div></div><div class="grid2" style="margin-top:12px"><div class="stat"><b>🔥 '+S.streak+'</b><br><small class="muted">streak</small></div><div class="stat"><b>'+S.completed.length+'</b><br><small class="muted">skills</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">real decisions</small></div><div class="stat"><b>£'+Number(S.saved||0).toFixed(0)+'</b><br><small class="muted">avoided spend</small></div></div><div class="mission" style="margin-top:13px"><div class="eyebrow">WEEKLY QUEST</div><h2>'+Math.min(5,S.weekQuests)+'/5 training sessions</h2><p class="muted small">Consistency is a financial skill.</p><div class="progress"><i style="width:'+Math.min(100,S.weekQuests/5*100)+'%"></i></div></div><button type="button" class="btn ghost" data-act="reset">Reset dojo</button></div>')}
function render(){let a=$('#app');if(!a)return;try{a.innerHTML=!S.profile?welcome():S.tab==='today'?today():S.tab==='train'?train():dojo()}catch(e){console.error(e);a.innerHTML='<div class="app"><h1>Dojo error.</h1><p class="muted">Refresh and try again.</p><button type="button" class="btn" data-act="hardreload">Refresh</button></div>'}}function renderLesson(){let a=$('#app');if(a)a.innerHTML=lesson()}function renderGame(){let a=$('#app');if(a)a.innerHTML=S.gameDone?gameResult():game()}
function act(a,e){try{
if(a==='setup'||a==='setup1'){$('#app').innerHTML=setup(1);return}if(a==='setup2'){let b=+$('#balance').value,p=$('#payday').value;if(!Number.isFinite(b)||b<0||!p){toast('Add balance + payday');return}S.profile={...(S.profile||{}),balance:b,payday:p};save();$('#app').innerHTML=setup(2);return}if(a==='finishSetup'){S.profile={...(S.profile||{}),bills:+$('#bills').value||0,buffer:+$('#buffer').value||0};S.tab='today';save();render();toast('Dojo unlocked ⚡');return}
if(a==='today'){S.tab='today';S.answer=null;render();return}if(a==='train'){S.tab='train';S.answer=null;render();return}if(a==='dojo'){S.tab='dojo';render();return}if(a==='gameMenu'){$('#app').innerHTML=gameMenu();return}
if(a==='decide'){$('#app').innerHTML=decide();return}if(a==='analyse'){let v=+$('#purchase').value;if(!Number.isFinite(v)||v<0){toast('Enter a valid amount');return}S.purchase=v;$('#app').innerHTML=result();return}if(a==='bought'||a==='skipped'){let v=S.purchase||0;S.decisions.push({date:day(),amount:v,outcome:a});if(a==='bought')S.spent+=v;else{S.skips=(S.skips||0)+1;S.saved=(S.saved||0)+v}if(S.missionDay!==day()){S.missionDay=day();S.missionDone=true;S.xp+=25}save();S.tab='today';render();toast(a==='skipped'?'Logged · +25 XP':'Logged');return}
if(a==='lesson'){S.lesson=Number(e.dataset.i)||0;S.answer=null;renderLesson();return}if(a==='answer'){if(S.answer!==null)return;S.answer=Number(e.dataset.i);if(S.answer!==L[S.lesson][5])S.hearts=Math.max(0,S.hearts-1);save();renderLesson();return}if(a==='nextLesson'){if(S.answer!==L[S.lesson][5]){S.answer=null;renderLesson();toast('Try again');return}if(!S.completed.includes(S.lesson)){S.completed.push(S.lesson);S.xp+=20;S.weekQuests=(S.weekQuests||0)+1;save()}if(S.lesson<L.length-1){S.lesson++;S.answer=null;renderLesson();toast('Next challenge ⚡')}else{S.answer=null;S.tab='train';render();toast('Skill tree mastered 🥋')}return}
if(a==='startGame'){S.game=e.dataset.game;S.gameIndex=0;S.gameScore=0;S.combo=0;S.gameDone=false;save();renderGame();if(S.game==='sprint')startTimer();return}if(a==='gameAnswer'){let q=L[S.gameIndex%L.length],ok=Number(e.dataset.i)===q[5];if(ok){S.combo++;S.gameScore+=10+(S.combo-1)*3}else{S.combo=0;S.hearts=Math.max(0,S.hearts-1)}S.gameIndex++;if(S.gameIndex>=5){S.xp+=S.gameScore;S.gameDone=true;save();renderGame()}else{save();renderGame();startTimer()}return}if(a==='duelAnswer'){let i=S.gameIndex%3,ok=Number(e.dataset.i)===0;S.combo=ok?S.combo+1:0;S.gameScore+=ok?15:0;S.gameIndex++;if(S.gameIndex>=3){S.xp+=S.gameScore;S.gameDone=true;save();renderGame()}else{save();renderGame()}return}if(a==='streakAnswer'){let ok=Number(e.dataset.i)===0;S.combo=ok?S.combo+1:0;S.gameScore+=ok?12:0;S.gameIndex++;if(S.gameIndex>=3){S.xp+=S.gameScore;S.gameDone=true;save();renderGame()}else{save();renderGame()}return}
if(a==='reset'){if(confirm('Reset all Unidojo data?')){localStorage.removeItem(KEY);location.reload()}return}if(a==='hardreload'){location.reload();return}
}catch(err){console.error(err);toast('Something went wrong')}}
function startTimer(){if(S.game!=='sprint'||S.gameDone)return;let b=$('#timerbar');if(!b)return;b.style.transition='none';b.style.width='100%';requestAnimationFrame(()=>{b.style.transition='width 8s linear';b.style.width='0%'});clearTimeout(window._ut);window._ut=setTimeout(()=>{if(!S.gameDone&&S.game==='sprint'){S.combo=0;S.gameIndex++;if(S.gameIndex>=5){S.xp+=S.gameScore;S.gameDone=true;save();renderGame()}else{save();renderGame();startTimer()}}},8000)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-tab]');if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;S.answer=null;save();render();return}act(b.dataset.act,b)});window.addEventListener('error',e=>console.error('Unidojo:',e.error||e.message));if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();</script></body></html>
