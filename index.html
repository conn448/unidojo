<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Unidojo</title><link rel="manifest" href="manifest.json"><style>:root{--bg:#090909;--p:#151515;--line:#303030;--t:#fff;--m:#9ca3af;--g:#f5a623;--g2:#a96500;--ok:#35d399;--bad:#fb7185;--blue:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding:18px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950}.brand span,.gold{color:var(--g)}.muted{color:var(--m)}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:var(--g)}h1{font-size:32px;line-height:1.02;margin:8px 0}h2{margin:8px 0}.panel,.decision,.mission,.game{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:18px}.decision{border:2px solid var(--g);background:#1d1609}.mission{background:#171309;border-color:#594715}.game{background:linear-gradient(145deg,#17130b,#121212);border-color:#6b4916}.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;background:var(--g);color:#111;font:inherit;font-weight:950;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 var(--g2)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}.secondary{background:#292929;color:#fff;box-shadow:0 4px 0 #000}.ghost{background:transparent;color:var(--m);border:1px solid var(--line);box-shadow:none}.field{width:100%;margin-top:7px;padding:14px;border-radius:12px;border:1px solid #444;background:#0b0b0b;color:#fff;font:inherit}.field:focus{outline:2px solid var(--g)}label{display:block;margin-top:17px;font-size:13px;font-weight:850}.big{font-size:48px;font-weight:950}.pill,.tag{display:inline-block;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:950}.tag{border:1px solid #3b3b3b;color:#aaa}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--line);z-index:10}.bottom-in{max-width:500px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{border:0;background:transparent;color:#777;padding:11px 4px;font:inherit;font-size:10px;font-weight:850;cursor:pointer}.bottom button.active{color:var(--g)}.bottom b{display:block;font-size:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#111;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.choice{display:block;width:100%;margin-top:10px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--p);color:#fff;text-align:left;font:inherit;cursor:pointer}.choice.correct{border-color:var(--ok)}.choice.wrong{border-color:var(--bad)}.node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#282828;border:3px solid #3b3b3b;font-size:20px;flex:none}.lesson{display:flex;gap:13px;align-items:center;width:100%;padding:12px 3px;background:transparent;color:#fff;border:0;text-align:left;cursor:pointer}.lesson:disabled{opacity:.3}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--g);color:#111;padding:10px 15px;border-radius:99px;font-weight:950;z-index:99;display:none}.toast.show{display:block}.small{font-size:12px}.timer{font-size:42px;font-weight:950;text-align:center}.combo{font-size:13px;font-weight:950;color:var(--g);text-align:center;margin-top:5px}.rank{font-size:12px;color:#bbb}.spark{font-size:42px;text-align:center}</style></head><body><div id="toast" class="toast"></div><main id="app"></main><script>(()=>{'use strict';
const KEY='unidojo-duo-v6';const $=s=>document.querySelector(s);const day=()=>new Date().toISOString().slice(0,10);const money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2);const days=d=>Math.max(1,Math.ceil((new Date(d)-new Date(day()))/864e5));
const L=[
['Runway maths','🏃','FOUNDATION','Distinguish cash on hand from money genuinely available for flexible spending.','£420 cash, £300 rent due, £50 protected buffer, 7 days to payday. What is the flexible runway?',['£10/day','£17.14/day','£60/day','£70/day'],1],['Net income','🧾','INCOME','Gross income is not the same as spendable income. Use what actually reaches your account.','A graduate is offered £30,000 gross. Which figure belongs in the monthly spending plan?',['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],['Opportunity cost','⚔️','DECISIONS','A purchase uses scarce resources. Its cost includes the best alternative use you give up.','You have £90 flexible money. Spending £45 on a night out means the £45 cannot fund another goal this week. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],['Credit comparison','💳','CREDIT','Compare the total cost of borrowing rather than being distracted by a headline rate.','Two cards advertise 19%. A has no mandatory fee; B has a compulsory £60 annual fee. What should you compare?',['Only the headline rate','APR / total cost of borrowing','Minimum payment only','The lender brand'],1],['Real returns','📈','ECONOMICS','Nominal returns are not the same as changes in purchasing power.','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],['Compounding','🌱','INVESTING','Previous returns can themselves contribute to future returns, making time important.','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],['Buffer design','🧱','RESILIENCE','A buffer is a shock absorber that prevents surprises forcing expensive decisions.','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],['Behaviour design','🧠','BEHAVIOUR','A system abandoned in real life is worse than a simpler system repeatedly followed.','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + default cheap option','Stop tracking entirely','Set an impossible target'],1],['Concentration risk','🎯','INVESTING','Diversification can reduce concentration risk, though it cannot remove market risk.','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],['Debt vs investing','💰','CREDIT','Borrowing has a known cost while investment returns are uncertain.','You can clear a £600 high-APR card balance or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],['Weekly reset','🥋','MASTERY','Good systems learn from deviations. Find the largest controllable variance and change the behaviour.','Plan: £120 flexible spend. Actual: £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],['Rent reality','🏠','LIFE','Large fixed costs dominate student cash flow.','Option A costs £725/month. Option B costs £775/month but saves £35/month in transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],['Subscription trap','🔁','BEHAVIOUR','Recurring costs repeat without requiring a new decision.','You have six subscriptions costing £7, £6, £5, £5, £4 and £3 monthly. Cancelling the £6 and £5 subscriptions saves roughly…',['£11/year','£11/month','£66/month','£132/month'],1],['Liquidity first','🚨','RESILIENCE','Match the financial tool to the time horizon.','You need £800 for a guaranteed university cost in three months. Which is the strongest default principle?',['Take equity risk for higher upside','Keep the required money accessible and low-risk','Use a credit card and invest the £800','Ignore the date'],1]];
const MISS=[['REAL DECISION','Log one genuine purchase decision.',25],['RUNWAY CHECK','Check your daily room before your next non-essential purchase.',20],['NO-REGRET MOVE','Skip or downgrade one non-essential purchase and log it.',35],['SPEND AUDIT','Log today’s flexible spending.',20],['BEAT YOUR BASELINE','Finish today below your own recent average.',40]];
let S={profile:null,tab:'today',xp:0,streak:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,purchase:0,missionDay:null,missionDone:false,skips:0,saved:0,weekQuests:0,game:null};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function M(){let p=S.profile||{},d=days(p.payday),a=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0));return{d,a,daily:a/d}}function belt(){return S.xp>=600?'BLACK':S.xp>=350?'RED':S.xp>=180?'BLUE':S.xp>=70?'GREEN':'WHITE'}function next(){return S.xp<70?70:S.xp<180?180:S.xp<350?350:S.xp<600?600:1000}function toast(t){let x=$('#toast');if(!x)return;x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
function nav(){return '<nav class="bottom"><div class="bottom-in">'+[['today','🏠','Today'],['train','🥋','Train'],['dojo','🏆','Dojo']].map(x=>'<button type="button" data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>'}function shell(x,n=true){return '<div class="app">'+x+(n?nav():'')+'</div>'}function top(){return '<div class="top"><div class="brand">uni<span>dojo</span></div><div>🔥 '+S.streak+' &nbsp; ♥ '+S.hearts+'</div></div>'}
function welcome(){return shell(top()+'<div style="padding-top:55px"><div class="spark">🥋</div><div class="eyebrow" style="margin-top:20px">Money training for students</div><h1 style="font-size:45px">Get good with<br><span class="gold">your money.</span></h1><p class="muted" style="font-size:18px;line-height:1.5">Real money decisions. Serious financial skills. A game that gets harder as you get better.</p><div class="game"><b>⚡ MONEY SPRINT</b><p class="muted">Race through 5 finance challenges. Build a combo. Earn bonus XP.</p><span class="tag">5 rounds</span> <span class="tag">combo XP</span> <span class="tag">speed run</span></div><button type="button" class="btn" data-act="setup">Start training</button><p class="muted small" style="text-align:center">Private on this device · No bank link</p></div>',false)}
function setup(s){let p=S.profile||{};if(s===1)return shell(top()+'<div style="margin-top:35px"><div class="eyebrow">Training setup · 1/2</div><h1>Know your starting point.</h1><p class="muted">We turn your real numbers into a personal runway.</p><label>Current balance<input id="balance" class="field" type="number" min="0" step=".01" value="'+(p.balance??'')+'" placeholder="180"></label><label>Next payday / income<input id="payday" class="field" type="date" min="'+day()+'" value="'+(p.payday||'')+'"></label><button type="button" class="btn" data-act="setup2">Continue</button></div>',false);return shell(top()+'<button type="button" class="btn ghost" data-act="setup1">← Back</button><div style="margin-top:28px"><div class="eyebrow">Training setup · 2/2</div><h1>Protect the essentials.</h1><p class="muted">Only include money you should not casually spend before payday.</p><label>Essentials due<input id="bills" class="field" type="number" min="0" step=".01" value="'+(p.bills??'')+'" placeholder="40"></label><label>Protected buffer<input id="buffer" class="field" type="number" min="0" step=".01" value="'+(p.buffer??'')+'" placeholder="20"></label><button type="button" class="btn" data-act="setupfinish">Enter the dojo</button></div>',false)}
function missionCard(){let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length],done=S.missionDay===day()&&S.missionDone;return '<div class="mission"><div class="eyebrow">🎯 TODAY’S MISSION · +'+q[2]+' XP</div><h2>'+q[0]+'</h2><p class="muted">'+q[1]+'</p><span class="pill '+(done?'good':'warn')+'">'+(done?'COMPLETED':'IN PROGRESS')+'</span><button type="button" class="btn '+(done?'secondary':'')+'" data-act="mission">'+(done?'Review mission':'Start mission')+'</button></div>'}
function today(){let m=M(),left=Math.max(0,m.daily-S.spent);return shell(top()+'<div class="eyebrow" style="margin-top:27px">Your money game</div><h1>Beat your own baseline.</h1><p class="muted">'+m.d+' days until payday · '+belt()+' belt</p><div class="panel"><span class="pill '+(m.daily>=15?'good':m.daily>=7?'warn':'bad')+'">'+(m.daily>=15?'ROOM TO BREATHE':m.daily>=7?'STAY SHARP':'PROTECT RUNWAY')+'</span><div class="big gold">'+money(m.daily)+'</div><div class="muted">flexible room / day</div><div class="progress" style="margin-top:17px"><i style="width:'+Math.min(100,S.spent/(m.daily||1)*100)+'%"></i></div><p class="small muted">'+money(S.spent)+' logged today · '+money(left)+' room remaining</p></div><div style="margin-top:14px">'+missionCard()+'</div><div class="game" style="margin-top:14px"><div class="eyebrow">⚡ ARCADE</div><h2>Money Sprint</h2><p class="muted">Five proper finance questions. Build a combo for bonus XP. No boring quiz energy.</p><button type="button" class="btn" data-act="startgame">Play 5-round sprint</button></div><div class="decision" style="margin-top:14px"><div class="eyebrow">⚔️ REAL-WORLD PLAY</div><h2>Can I afford something?</h2><p class="muted">See the consequence before you decide. Then log what actually happened.</p><button type="button" class="btn" data-act="decide">Make a decision</button></div><div class="grid2" style="margin-top:10px"><div class="stat"><b class="gold">'+S.xp+'</b><br><small class="muted">XP</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">decisions</small></div></div><div class="panel" style="margin-top:10px"><b>Daily check-in</b><p class="muted small">Keep your streak alive and teach Unidojo what your real week looks like.</p><button type="button" class="btn secondary" data-act="checkin">'+(S.lastCheck===day()?'Update today':'Complete check-in')+'</button></div>')}
function decide(){return shell(top()+'<button type="button" class="btn ghost" data-act="today">← Back</button><div style="margin-top:28px"><div class="eyebrow">Decision dojo</div><h1>Can I afford it?</h1><p class="muted">No judgement. Just see the trade-off.</p><label>What are you thinking of spending?<input id="purchase" class="field" type="number" min="0" step=".01" inputmode="decimal" placeholder="18" style="font-size:25px;font-weight:900"></label><button type="button" class="btn" data-act="analyse">Show me the trade-off</button></div>',false)}
function result(){let m=M(),v=+S.purchase||0,after=Math.max(0,m.a-v),ad=after/m.d,ratio=m.daily?v/m.daily:99;return shell(top()+'<button type="button" class="btn ghost" data-act="decide">← New decision</button><div style="margin-top:28px"><div class="eyebrow">Your trade-off</div><div class="panel" style="margin-top:12px;text-align:center"><span class="pill '+(ratio>2?'bad':ratio>1?'warn':'good')+'">'+(ratio>2?'BIG MOVE. PAUSE FIRST.':ratio>1?'WORTH CHECKING.':'FITS THE PLAN.')+'</span><div class="big gold">'+money(v)+'</div><div class="muted">purchase</div><div class="grid2" style="margin-top:20px"><div class="stat"><small class="muted">Before</small><br><b>'+money(m.daily)+'</b>/day</div><div class="stat"><small class="muted">After</small><br><b>'+money(ad)+'</b>/day</div></div></div><div class="decision" style="margin-top:16px"><b>'+(ratio>2?'Pause first.':ratio>1?'Check the trade-off.':'You know the cost.')+'</b><p class="muted">This purchase changes your daily room by <b>'+money(Math.max(0,m.daily-ad))+'</b>.</p></div><div class="grid2"><button type="button" class="btn" data-act="bought">I bought it</button><button type="button" class="btn secondary" data-act="skipped">I skipped it</button></div></div>',false)}
function checkin(){let m=M();return shell(top()+'<button type="button" class="btn ghost" data-act="today">← Back</button><div style="margin-top:28px"><div class="eyebrow">Daily quest · +10 XP</div><h1>How much did you spend today?</h1><p class="muted">Flexible spending only.</p><label>Today’s flexible spending<input id="spent" class="field" type="number" min="0" step=".01" inputmode="decimal" value="'+S.spent+'"></label><div class="panel" style="margin-top:16px"><span class="muted">Your guide</span><b style="float:right">'+money(m.daily)+'</b></div><button type="button" class="btn" data-act="savecheck">Complete quest</button></div>',false)}
function train(){return shell(top()+'<div class="eyebrow" style="margin-top:28px">Skill tree</div><h1>Train your money brain.</h1><p class="muted">University-level scenarios. One short challenge at a time.</p><div class="game"><div class="eyebrow">⚡ ARCADE</div><h2>Money Sprint</h2><p class="muted">5 rounds · combo multiplier · bonus XP</p><button type="button" class="btn" data-act="startgame">Enter the arena</button></div><div class="panel" style="margin-top:15px"><b>'+S.xp+' XP</b><span class="gold" style="float:right">'+belt()+' BELT</span><div class="progress" style="margin-top:12px"><i style="width:'+Math.min(100,S.xp/next()*100)+'%"></i></div></div><div style="margin-top:15px">'+L.map((l,i)=>{let open=i<=S.completed.length,done=S.completed.includes(i);return '<button type="button" class="lesson" data-act="lesson" data-i="'+i+'" '+(!open?'disabled':'')+'><span class="node">'+(done?'✓':l[1])+'</span><span><span class="eyebrow">'+l[2]+'</span><br><b>'+l[0]+'</b><br><small class="muted">'+(done?'Mastered · +20 XP':open?'Ready to train':'Locked')+'</small></span></button>'}).join('')+'</div>')}
function lesson(){let l=L[S.lesson],answered=S.answer!==null;return shell(top()+'<button type="button" class="btn ghost" data-act="train">← Skill tree</button><div style="margin-top:28px"><div class="eyebrow">Challenge '+(S.lesson+1)+' of '+L.length+' · '+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="panel"><p class="muted">'+l[3]+'</p></div><h2 style="margin-top:25px">'+l[4]+'</h2>'+l[5].map((o,i)=>'<button type="button" class="choice '+(answered?(i===l[6]?'correct':i===S.answer?'wrong':''):'')+'" data-act="answer" data-i="'+i+'" '+(answered?'disabled':'')+'><b>'+(i+1)+'.</b> '+o+'</button>').join('')+(answered?'<div class="panel" style="margin-top:15px"><b>'+(S.answer===l[6]?'🔥 Nailed it.':'Not quite.')+'</b><p class="muted">'+(S.answer===l[6]?'Good. Now apply it to a real decision.':'Correct answer: '+l[5][l[6]]+'.')+'</p></div><button type="button" class="btn" data-act="nextlesson">'+(S.answer===l[6]?(S.lesson<L.length-1?'Next challenge →':'Back to skill tree'):'Try again')+'</button>':'')+'</div>',false)}
function gameView(){let g=S.game;if(!g)return train();let q=L[g.order[g.index]],answered=g.answer!==null;return shell(top()+'<div style="margin-top:22px"><div class="eyebrow">⚡ MONEY SPRINT · ROUND '+(g.index+1)+'/5</div><div class="timer">'+g.time+'s</div><div class="combo">'+(g.combo>1?'🔥 '+g.combo+'× COMBO · ':'')+g.score+' XP</div><div class="progress" style="margin-top:10px"><i style="width:'+((g.index)/5*100)+'%"></i></div><h1 style="margin-top:22px">'+q[1]+' '+q[0]+'</h1><div class="panel"><p class="muted">'+q[3]+'</p></div><h2 style="margin-top:20px">'+q[4]+'</h2>'+q[5].map((o,i)=>'<button type="button" class="choice '+(answered?(i===q[6]?'correct':i===g.answer?'wrong':''):'')+'" data-act="gameanswer" data-i="'+i+'" '+(answered?'disabled':'')+'><b>'+(i+1)+'.</b> '+o+'</button>').join('')+(answered?'<div class="panel" style="margin-top:14px"><b>'+(g.answer===q[6]?'🔥 Combo alive.':'💥 Combo broken.')+'</b><p class="muted">'+(g.answer===q[6]?'Correct. Keep the run going.':'Correct answer: '+q[5][q[6]]+'.')+'</p></div><button type="button" class="btn" data-act="gamenext">'+(g.index<4?'Next round →':'Finish sprint')+'</button>':'')+'</div>',false)}
function gameFinish(){let g=S.game;return shell(top()+'<div style="padding-top:35px;text-align:center"><div class="spark">🏆</div><div class="eyebrow">SPRINT COMPLETE</div><h1>'+g.score+' XP</h1><p class="muted">'+g.correct+'/5 correct · best combo '+g.bestCombo+'×</p><div class="game"><h2>'+(['Keep training.','Good run.','Strong run.','Excellent run.','Finance machine.'][Math.min(4,g.correct)])+'</h2><p class="muted">'+(g.correct===5?'Perfect run. You earned the full confidence bonus.':'The goal is improvement, not perfection. Run it again and beat your score.')+'</p></div><button type="button" class="btn" data-act="startgame">Run it again</button><button type="button" class="btn secondary" data-act="today">Back to Today</button></div>',false)}
function dojo(){let prog=Math.min(100,S.xp/next()*100),week=Math.min(100,(S.weekQuests/5)*100);return shell(top()+'<div class="eyebrow" style="margin-top:28px">Your dojo</div><h1>Build the streak.</h1><div class="panel"><b>'+belt()+' BELT</b><div class="big gold">'+S.xp+'</div><p class="muted">'+Math.max(0,next()-S.xp)+' XP to next level</p><div class="progress"><i style="width:'+prog+'%"></i></div></div><div class="grid2" style="margin-top:12px"><div class="stat"><b>🔥 '+S.streak+'</b><small class="muted">streak</small></div><div class="stat"><b>'+S.completed.length+'/'+L.length+'</b><small class="muted">skills</small></div><div class="stat"><b>'+S.decisions.length+'</b><small class="muted">decisions</small></div><div class="stat"><b>£'+Number(S.saved||0).toFixed(0)+'</b><small class="muted">avoided spend</small></div></div><div class="mission" style="margin-top:12px"><div class="eyebrow">WEEKLY QUEST</div><h2>Train 5 times this week</h2><p class="muted">Consistency beats one perfect budgeting session.</p><div class="progress"><i style="width:'+week+'%"></i></div><p class="small muted">'+Math.min(5,S.weekQuests)+'/5 quests</p></div><button type="button" class="btn ghost" data-act="reset">Reset my dojo</button>')}
function render(){let app=$('#app');if(!app)return;try{if(!S.profile)app.innerHTML=welcome();else if(S.game&&S.game.finished)app.innerHTML=gameFinish();else if(S.game)app.innerHTML=gameView();else if(S.tab==='today')app.innerHTML=today();else if(S.tab==='train')app.innerHTML=train();else app.innerHTML=dojo()}catch(e){console.error(e);app.innerHTML='<div class="app"><h1>Unidojo hit an error.</h1><p class="muted">Refresh once and try again.</p><button type="button" class="btn" data-act="hardreload">Refresh</button></div>'}}
function renderLesson(){let app=$('#app');if(app)app.innerHTML=lesson()}
function startGame(){let order=[...Array(L.length).keys()].sort(()=>Math.random()-.5).slice(0,5);S.game={order,index:0,answer:null,time:12,score:0,correct:0,combo:0,bestCombo:0,finished:false};S.tab='train';save();render();clearInterval(window.gameTimer);window.gameTimer=setInterval(()=>{if(!S.game||S.game.finished||S.game.answer!==null)return;S.game.time--;if(S.game.time<=0){S.game.answer=-1;S.game.combo=0;save();render()}},1000)}
function act(a,e){if(!a)return;try{
if(a==='setup'||a==='setup1'){ $('#app').innerHTML=setup(1);return }
if(a==='setup2'){let b=+$('#balance').value,p=$('#payday').value;if(!Number.isFinite(b)||b<0||!p){toast('Add your balance and payday');return}S.profile={...(S.profile||{}),balance:b,payday:p};save();$('#app').innerHTML=setup(2);return}
if(a==='setupfinish'){S.profile={...(S.profile||{}),bills:+$('#bills').value||0,buffer:+$('#buffer').value||0};S.tab='today';save();render();toast('Dojo unlocked');return}
if(a==='today'){S.game=null;S.tab='today';S.answer=null;render();return}if(a==='train'){S.game=null;S.tab='train';S.answer=null;render();return}if(a==='dojo'){S.game=null;S.tab='dojo';render();return}
if(a==='checkin'){$('#app').innerHTML=checkin();return}
if(a==='savecheck'){let v=+$('#spent').value;if(!Number.isFinite(v)||v<0){toast('Enter a valid amount');return}if(S.lastCheck!==day()){S.xp+=10;let y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastCheck===y?S.streak+1:1;S.weekQuests=(S.weekQuests||0)+1;S.lastCheck=day()}S.spent=v;save();S.tab='today';render();toast('Quest complete · +10 XP');return}
if(a==='decide'){$('#app').innerHTML=decide();return}if(a==='analyse'){let v=+$('#purchase').value;if(!Number.isFinite(v)||v<0){toast('Enter a purchase amount');return}S.purchase=v;$('#app').innerHTML=result();return}
if(a==='bought'||a==='skipped'){let v=S.purchase||0;S.decisions.push({date:day(),amount:v,outcome:a});if(a==='bought')S.spent+=v;else{S.skips=(S.skips||0)+1;S.saved=(S.saved||0)+v}if(S.missionDay!==day()){S.missionDay=day();S.missionDone=true;S.xp+=25}save();S.tab='today';render();toast(a==='skipped'?'Decision logged · +25 XP':'Decision logged');return}
if(a==='mission'){if(S.missionDay===day()&&S.missionDone){toast('Mission already complete');return}S.missionDay=day();S.missionDone=true;S.xp+=20;S.weekQuests=(S.weekQuests||0)+1;save();render();toast('Mission complete · +20 XP');return}
if(a==='lesson'){S.game=null;S.lesson=Number(e.dataset.i)||0;S.answer=null;renderLesson();return}
if(a==='answer'){if(S.answer!==null)return;S.answer=Number(e.dataset.i);if(S.answer!==L[S.lesson][6])S.hearts=Math.max(0,S.hearts-1);save();renderLesson();return}
if(a==='nextlesson'){if(S.answer!==L[S.lesson][6]){S.answer=null;renderLesson();toast('Try again');return}if(!S.completed.includes(S.lesson)){S.completed.push(S.lesson);S.xp+=20;S.weekQuests=(S.weekQuests||0)+1;save()}if(S.lesson<L.length-1){S.lesson++;S.answer=null;renderLesson();toast('Next challenge · +20 XP')}else{S.answer=null;S.tab='train';render();toast('Skill tree complete · +20 XP')}return}
if(a==='startgame'){startGame();return}
if(a==='gameanswer'){let g=S.game;if(!g||g.answer!==null)return;let q=L[g.order[g.index]],v=Number(e.dataset.i);g.answer=v;if(v===q[6]){g.correct++;g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);g.score+=20+(g.combo>1?g.combo*5:0)}else g.combo=0;save();render();return}
if(a==='gamenext'){let g=S.game;if(!g)return;if(g.index<4){g.index++;g.answer=null;g.time=12;save();render()}else{g.finished=true;S.xp+=g.score;S.weekQuests=(S.weekQuests||0)+1;save();clearInterval(window.gameTimer);render();toast('Sprint complete · +'+g.score+' XP')}return}
if(a==='reset'){if(confirm('Reset all Unidojo data?')){localStorage.removeItem(KEY);location.reload()}return}if(a==='hardreload'){location.reload();return}
}catch(err){console.error(err);toast('Something went wrong')}}
document.addEventListener('click',function(e){let b=e.target.closest('[data-act],[data-tab]');if(!b)return;if(b.dataset.tab){S.tab=b.dataset.tab;S.answer=null;S.game=null;save();render();return}act(b.dataset.act,b)});window.addEventListener('error',e=>console.error('Unidojo error:',e.error||e.message));if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
})();</script></body></html>
