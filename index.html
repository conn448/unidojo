<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Unidojo</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#090909;--panel:#151515;--line:#303030;--text:#fff;--muted:#9ca3af;--gold:#f5b51b;--gold2:#c98a00;--green:#36d399;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950}.brand span,.gold{color:var(--gold)}.muted{color:var(--muted)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.panel,.decision{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.decision{border:2px solid var(--gold);background:#1e180a}.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;background:var(--gold);color:#111;font:inherit;font-weight:900;cursor:pointer;margin-top:16px;box-shadow:0 4px 0 var(--gold2)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}.secondary{background:#292929;color:#fff;box-shadow:0 4px 0 #000}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}.field{width:100%;margin-top:7px;padding:14px;border-radius:12px;border:1px solid #444;background:#0b0b0b;color:#fff;font:inherit}label{display:block;margin-top:18px;font-size:13px;font-weight:800}.big{font-size:48px;font-weight:950}.pill{display:inline-block;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:900}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--line);z-index:10}.bottom-in{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{border:0;background:transparent;color:#777;padding:12px 4px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.bottom button.active{color:var(--gold)}.bottom b{display:block;font-size:20px}.choice{display:flex;width:100%;gap:12px;text-align:left;margin-top:10px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:#fff;font:inherit;cursor:pointer}.choice.correct{border-color:var(--green)}.choice.wrong{border-color:var(--red)}.node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#282828;border:3px solid #3b3b3b;font-size:20px;flex:none}.lesson{display:flex;gap:13px;align-items:center;width:100%;padding:12px 3px;background:transparent;color:#fff;border:0;text-align:left;cursor:pointer}.lesson:disabled{opacity:.35;cursor:not-allowed}.stat{background:#111;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 15px;border-radius:99px;font-weight:900;z-index:99;display:none}.toast.show{display:block}
</style></head><body><div id="toast" class="toast"></div><main id="app"></main><script>
(function(){'use strict';
const $=s=>document.querySelector(s), KEY='unidojo-duo-v3';
const today=()=>new Date().toISOString().slice(0,10), money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2), days=d=>{if(!d)return 1;return Math.max(1,Math.ceil((new Date(d)-new Date(today()))/86400000))};
const lessons=[['Meet your runway','🏃','FOUNDATION','Your balance is not the amount you can spend. Divide money left after commitments across the days to payday.','If you have £120 and 10 days to payday, your starting runway is…',['£12/day','£120/day','£1.20/day'],0],['Protect payday','🛡️','FOUNDATION','Money already promised to rent, bills or essential travel is not flexible spending. Protect it first.','What should you subtract before calculating flexible spending room?',['A bill due before payday','Your favourite song','An old receipt'],0],['Make the call','⚔️','DECISIONS','Good money habits are decisions, not restrictions. See the consequence before you choose.','You have £10/day left and want to spend £25. Best first move?',['Check the trade-off','Buy it without checking','Pretend it does not count'],0],['Spot the leak','💧','AWARENESS','Repeated small purchases can quietly become a big category. Make the pattern visible.','Which pattern is most useful to notice?',['£4 repeated every day','One random £1 spend','Your old statement colour'],0],['The 24-hour move','⏱️','DECISIONS','For non-essential purchases above your pause amount, delay the decision and reassess tomorrow.','The 24-hour rule is mainly for…',['Non-essential purchases','Every rent payment','Checking your balance'],0],['Build your buffer','🧱','RESILIENCE','A small buffer absorbs surprises and gives you options when plans change.','What is the first job of an emergency buffer?',['Absorb a small surprise','Make you rich quickly','Replace your income'],0],['Own your week','🥋','RESET','Review what happened, compare it with the plan and choose one behaviour to change.','What makes a weekly reset useful?',['Compare plan vs reality','Punish yourself for spending','Ignore the numbers'],0]];
let S={profile:null,tab:'today',xp:0,streak:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,purchase:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){} const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function model(){let p=S.profile||{},d=days(p.payday),available=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0));return{d,available,daily:available/d}}
function belt(){return S.xp>=280?'BLACK':S.xp>=160?'BLUE':S.xp>=80?'GREEN':S.xp>=30?'YELLOW':'WHITE'} function next(){return S.xp<30?30:S.xp<80?80:S.xp<160?160:S.xp<280?280:400}
function nav(){return '<nav class="bottom"><div class="bottom-in">'+[['today','🏠','Today'],['train','🥋','Train'],['dojo','🏆','Dojo']].map(x=>'<button data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>'}
function shell(x,n=true){return '<div class="app">'+x+(n?nav():'')+'</div>'} function top(){return '<div class="top"><div class="brand">uni<span>dojo</span></div><div>🔥 '+S.streak+' &nbsp; ♥ '+S.hearts+'</div></div>'}
function welcome(){return shell(top()+'<div style="padding-top:70px"><div style="font-size:72px">🥋</div><div class="eyebrow" style="margin-top:25px">Money training for students</div><h1 style="font-size:46px;line-height:.95;margin:8px 0">Get good with<br><span class="gold">your money.</span></h1><p class="muted" style="font-size:18px;line-height:1.5">Short daily training. Real money decisions. A streak that makes the habit stick.</p><div class="panel" style="margin-top:25px"><b>Today’s mission</b><span class="gold" style="float:right">+10 XP</span><p class="muted">Set your runway and complete your first lesson.</p></div><button class="btn" data-act="setup">Start training</button><p class="muted" style="text-align:center;font-size:12px">Private on this device · No bank link</p></div>',false)}
function setup(step){let p=S.profile||{};if(step===1)return shell(top()+'<div style="margin-top:35px"><div class="eyebrow">Training setup · 1/2</div><h1>Know your starting point.</h1><p class="muted">Two numbers. Then we turn them into a daily target.</p><label>Current balance<input id="balance" class="field" type="number" min="0" step=".01" value="'+(p.balance??'')+'" placeholder="180"></label><label>Next payday / income<input id="payday" class="field" type="date" min="'+today()+'" value="'+(p.payday||'')+'"></label><button class="btn" data-act="setup2">Continue</button></div>',false);return shell(top()+'<button class="btn ghost" data-act="setup">← Back</button><div style="margin-top:30px"><div class="eyebrow">Training setup · 2/2</div><h1>Protect the essentials.</h1><p class="muted">Only include things you must pay before payday.</p><label>Essentials due<input id="bills" class="field" type="number" min="0" step=".01" value="'+(p.bills??'')+'" placeholder="40"></label><label>Buffer to protect<input id="buffer" class="field" type="number" min="0" step=".01" value="'+(p.buffer??'')+'" placeholder="10"></label><button class="btn" data-act="finishsetup">Show my dojo</button></div>',false)}
function todayView(){let m=model(),left=Math.max(0,m.daily-S.spent);return shell(top()+'<div class="eyebrow" style="margin-top:30px">Daily training</div><h1>Your dojo is ready.</h1><p class="muted">'+m.d+' days until payday</p><div class="panel"><span class="pill '+(m.daily>=12?'good':m.daily>=5?'warn':'bad')+'">'+(m.daily>=12?'ROOM TO BREATHE':m.daily>=5?'STAY SHARP':'PROTECT RUNWAY')+'</span><div class="big gold" style="margin-top:12px">'+money(m.daily)+'</div><div class="muted">daily spending guide</div><div class="progress" style="margin-top:20px"><i style="width:'+Math.min(100,S.spent/(m.daily||1)*100)+'%"></i></div><p class="muted" style="font-size:12px">'+money(S.spent)+' spent today · '+money(left)+' room left</p><button class="btn ghost" data-act="edit">Edit numbers</button></div><div class="decision" style="margin-top:16px"><div class="eyebrow">🔥 Daily mission</div><h2>Can you afford something?</h2><p class="muted">See the trade-off before you decide.</p><button class="btn" data-act="decide">Check a purchase</button></div><div class="panel" style="margin-top:16px"><b>Daily check-in</b><p class="muted">Log flexible spending and keep your streak alive.</p><button class="btn secondary" data-act="checkin">'+(S.lastCheck===today()?'Update today':'Complete check-in')+'</button></div><div class="panel" style="margin-top:16px"><b>Next skill · +15 XP</b><p class="muted">'+lessons[Math.min(S.completed.length,6)][0]+'</p><button class="btn secondary" data-act="quick">Train for 2 minutes</button></div>')}
function decide(){return shell(top()+'<button class="btn ghost" data-act="today">← Back</button><div class="eyebrow" style="margin-top:28px">Decision dojo</div><h1>Can I afford it?</h1><p class="muted">No judgement. Just see the trade-off.</p><label>What are you thinking of spending?<input id="purchase" class="field" type="number" min="0" step=".01" placeholder="18" style="font-size:25px;font-weight:900"></label><button class="btn" data-act="analyse">Show me the trade-off</button></div>')}
function result(){let m=model(),v=+S.purchase||0,after=Math.max(0,m.available-v),ad=after/m.d,ratio=m.daily?v/m.daily:99,tag=ratio>2?'BIG MOVE. PAUSE FIRST.':ratio>1?'WORTH CHECKING.':'FITS THE PLAN.';return shell(top()+'<button class="btn ghost" data-act="decide">← New decision</button><div class="eyebrow" style="margin-top:28px">Your trade-off</div><div class="panel" style="margin-top:12px;text-align:center"><span class="pill '+(ratio>2?'bad':ratio>1?'warn':'good')+'">'+tag+'</span><div class="big gold">'+money(v)+'</div><div class="muted">purchase</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px"><div class="stat"><small class="muted">Before</small><br><b>'+money(m.daily)+'</b>/day</div><div class="stat"><small class="muted">After</small><br><b>'+money(ad)+'</b>/day</div></div></div><div class="decision" style="margin-top:16px"><b>'+ (ratio>2?'Pause first.':ratio>1?'Check the trade-off.':'You know the cost.')+'</b><p class="muted">This purchase changes your daily room by <b>'+money(Math.max(0,m.daily-ad))+'</b>.</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" data-act="bought">I bought it</button><button class="btn secondary" data-act="skipped">I skipped it</button></div>')}
function checkin(){let m=model();return shell(top()+'<button class="btn ghost" data-act="today">← Back</button><div class="eyebrow" style="margin-top:28px">Daily quest · +10 XP</div><h1>How much did you spend today?</h1><p class="muted">Flexible spending only.</p><label>Today’s flexible spending<input id="spent" class="field" type="number" min="0" step=".01" value="'+S.spent+'"></label><div class="panel" style="margin-top:16px"><span class="muted">Your guide</span><b style="float:right">'+money(m.daily)+'</b></div><button class="btn" data-act="savecheck">Complete quest</button>')}
function train(){return shell(top()+'<div class="eyebrow" style="margin-top:28px">Skill tree</div><h1>Train your money brain.</h1><p class="muted">One short lesson a day.</p><div class="panel"><b>'+S.xp+' XP</b><span class="gold" style="float:right">'+belt()+' BELT</span><div class="progress" style="margin-top:12px"><i style="width:'+Math.min(100,S.xp/next()*100)+'%"></i></div></div><div style="margin-top:15px">'+lessons.map((l,i)=>{let open=i<=S.completed.length,done=S.completed.includes(i);return '<button class="lesson" data-act="lesson" data-i="'+i+'" '+(!open?'disabled':'')+'><span class="node">'+(done?'✓':l[1])+'</span><span><span class="eyebrow" style="font-size:9px">'+l[2]+'</span><br><b>'+l[0]+'</b><br><small class="muted">'+(done?'Mastered · +15 XP':open?'Ready to train':'Locked')+'</small></span></button>'}).join('')+'</div>')}
function lesson(){let l=lessons[S.lesson],answered=S.answer!==null;return shell(top()+'<button class="btn ghost" data-act="train">← Skill tree</button><div class="eyebrow" style="margin-top:28px">Lesson '+(S.lesson+1)+' of 7 · '+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="panel"><p class="muted">'+l[3]+'</p></div><h2 style="margin-top:25px">'+l[4]+'</h2>'+l[5].map((o,i)=>'<button class="choice '+(answered?(i===l[6]?'correct':i===S.answer?'wrong':''):'')+'" data-act="answer" data-i="'+i+'" '+(answered?'disabled':'')+'><b>'+(i+1)+'.</b> '+o+'</button>').join('')+(answered?'<div class="panel" style="margin-top:15px"><b>'+(S.answer===l[6]?'🔥 Nailed it.':'Not quite.')+'</b><p class="muted">'+(S.answer===l[6]?'That is the move.':'The correct answer is '+l[5][l[6]]+'.')+'</p></div><button class="btn" data-act="finish">'+(S.completed.includes(S.lesson)?'Back to skill tree':'Claim +15 XP')+'</button>':'') )}
function dojo(){return shell(top()+'<div class="eyebrow" style="margin-top:28px">Your dojo</div><h1>Build the streak.</h1><div class="panel"><div class="big gold">'+S.xp+'</div><b>'+belt()+' belt</b><p class="muted">'+Math.max(0,next()-S.xp)+' XP to next level</p></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px"><div class="stat"><b>🔥 '+S.streak+'</b><small class="muted">streak</small></div><div class="stat"><b>'+S.completed.length+'/7</b><small class="muted">lessons</small></div><div class="stat"><b>'+S.decisions.length+'</b><small class="muted">decisions</small></div></div><button class="btn ghost" data-act="reset">Reset my dojo</button>')}
function render(){if(!S.profile){$('#app').innerHTML=welcome();return}$('#app').innerHTML=S.tab==='today'?todayView():S.tab==='train'?train():dojo()}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function act(a,e){try{if(a==='setup'){$('#app').innerHTML=setup(1);return}if(a==='setup2'){let b=+$('#balance').value,p=$('#payday').value;if(!Number.isFinite(b)||b<0||!p){toast('Add your balance and payday');return}S.profile={...(S.profile||{}),balance:b,payday:p};save();$('#app').innerHTML=setup(2);return}if(a==='finishsetup'){S.profile={...(S.profile||{}),bills:+$('#bills').value||0,buffer:+$('#buffer').value||0};S.tab='today';save();render();return}if(a==='edit'){S.tab='today';$('#app').innerHTML=setup(1);return}if(a==='today'){S.tab='today';render();return}if(a==='train'){S.tab='train';S.answer=null;render();return}if(a==='dojo'){S.tab='dojo';render();return}if(a==='checkin'){$('#app').innerHTML=checkin();return}if(a==='savecheck'){let v=+$('#spent').value;if(!Number.isFinite(v)||v<0){toast('Enter a valid amount');return}if(S.lastCheck!==today()){S.xp+=10;let y=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.lastCheck===y?S.streak+1:1;S.lastCheck=today()}S.spent=v;save();S.tab='today';render();toast('Quest complete · +10 XP');return}if(a==='decide'){S.purchase=0;$('#app').innerHTML=decide();return}if(a==='analyse'){let v=+$('#purchase').value;if(!Number.isFinite(v)||v<0){toast('Enter a purchase amount');return}S.purchase=v;$('#app').innerHTML=result();return}if(a==='bought'||a==='skipped'){S.decisions.push({date:today(),amount:S.purchase,outcome:a});if(a==='bought')S.spent+=S.purchase;save();S.tab='today';render();toast('Decision logged');return}if(a==='quick'){S.lesson=Math.min(S.completed.length,6);S.answer=null;$('#app').innerHTML=lesson();return}if(a==='lesson'){S.lesson=+e.dataset.i;S.answer=null;$('#app').innerHTML=lesson();return}if(a==='answer'){if(S.answer!==null)return;S.answer=+e.dataset.i;if(S.answer!==lessons[S.lesson][6])S.hearts=Math.max(0,S.hearts-1);save();$('#app').innerHTML=lesson();return}if(a==='finish'){if(!S.completed.includes(S.lesson)){if(S.answer!==lessons[S.lesson][6]){S.answer=null;$('#app').innerHTML=lesson();toast('Try again');return}S.completed.push(S.lesson);S.xp+=15;save()}S.answer=null;S.tab='train';render();return}if(a==='reset'){if(confirm('Reset all Unidojo data?')){localStorage.removeItem(KEY);location.reload()}return}if(e&&e.dataset.tab){S.tab=e.dataset.tab;save();render();return}}catch(err){console.error(err);toast('App error — refresh once')}}
document.addEventListener('click',function(e){let t=e.target.closest('[data-act],[data-tab]');if(t&&!t.disabled)act(t.dataset.act||'',t)});
window.addEventListener('error',function(e){console.error(e.error||e.message)});render();
})();</script></body></html>
