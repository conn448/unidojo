<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--card:#141414;--line:#292929;--text:#fff;--muted:#929292;--orange:#ff8a00;--gold:#ffb000;--green:#35d399;--red:#ff5d73}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:20px 17px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px}.logo i{color:var(--orange);font-style:normal}.chips{display:flex;gap:7px}.chip{background:#171717;border:1px solid #303030;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900}.eyebrow{color:var(--orange);font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.muted{color:var(--muted)}h1{font-size:42px;line-height:.96;letter-spacing:-2px;margin:8px 0 14px}h2{letter-spacing:-.7px}.orange{color:var(--orange)}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:14px}.hero{padding:24px}.big{font-size:54px;font-weight:950;letter-spacing:-3px}.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px 18px;margin-top:13px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#111;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #a95500}.btn:active{transform:translateY(3px);box-shadow:none}.ghost{background:#171717;color:#fff;border:1px solid #333;box-shadow:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:13px;text-align:center}.field{width:100%;padding:15px;margin-top:7px;background:#090909;border:1px solid #3b3b3b;border-radius:13px;color:#fff}.label{display:block;margin-top:16px;font-size:13px;font-weight:800}.choice{display:block;width:100%;text-align:left;background:#111;color:#fff;border:2px solid #2d2d2d;border-radius:15px;padding:15px;margin-top:10px;cursor:pointer}.choice:hover{border-color:#666}.choice.good{border-color:var(--green);background:#09271f}.choice.bad{border-color:var(--red);background:#2b1117}.game{display:block;width:100%;text-align:left;color:#fff;background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #303030;border-radius:20px;padding:18px;margin-top:11px;cursor:pointer}.game:hover{border-color:#666;transform:translateY(-1px)}.game b{font-size:30px;float:right}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}.nav{position:fixed;bottom:0;left:0;right:0;background:#090909f2;border-top:1px solid #252525;z-index:10}.navin{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#777;padding:10px;font-size:11px;font-weight:900;cursor:pointer}.nav button.active{color:var(--orange)}.nav strong{display:block;font-size:21px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 16px;border-radius:99px;font-weight:900;display:none;z-index:30}.toast.show{display:block}.center{text-align:center}.tag{display:inline-block;background:#241a0b;color:#ffc15c;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:900}
</style>
</head>
<body>
<div id="toast" class="toast"></div><main id="app"><div class="app"><div class="eyebrow">UNIDOJO</div><h1>Loading your<br><span class="orange">dojo…</span></h1></div></main>
<script>
(function(){
'use strict';
var key='unidojo-v8';
var state={screen:'home',xp:0,streak:0,decisions:0,saved:0,lesson:0,game:null,round:0,score:0};
try{var old=JSON.parse(localStorage.getItem(key));if(old){state=Object.assign(state,old);}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1400);}
function belt(){return state.xp>=800?'BLACK':state.xp>=450?'RED':state.xp>=220?'BLUE':state.xp>=80?'GREEN':'WHITE';}
function top(){return '<div class="top"><div class="logo">uni<i>dojo</i></div><div class="chips"><span class="chip">🔥 '+state.streak+'</span><span class="chip">⚡ '+state.xp+'</span></div></div>';}
function nav(){return '<div class="nav"><div class="navin"><button data-screen="home" class="'+(state.screen==='home'?'active':'')+'"><strong>⌂</strong>Today</button><button data-screen="train" class="'+(state.screen==='train'?'active':'')+'"><strong>◈</strong>Train</button><button data-screen="profile" class="'+(state.screen==='profile'?'active':'')+'"><strong>♛</strong>Dojo</button></div></div>';}
function shell(body){return '<div class="app">'+top()+body+'</div>'+nav();}
function home(){return shell('<div class="eyebrow">DAY 1 · '+belt()+' BELT</div><h1>Your money.<br><span class="orange">Your game.</span></h1><div class="card hero"><div class="eyebrow">TODAY\'S MISSION</div><h2>Make one better money decision.</h2><p class="muted">Train with a real purchase, then see exactly what it costs your future self.</p><button class="btn" data-action="decision">Start decision →</button></div><div class="eyebrow" style="margin-top:28px">ARCADE</div><button class="game" data-action="games"><b>⚡</b><div class="eyebrow">SPEED + ACCURACY</div><h2>Money Sprint</h2><p class="muted">Five finance decisions. Beat the clock. Build your combo.</p></button><button class="game" data-action="duel"><b>⚔️</b><div class="eyebrow">JUDGEMENT</div><h2>Decision Duel</h2><p class="muted">Real student situations. Choose the strongest move.</p></button><div class="grid" style="margin-top:12px"><div class="stat"><b class="orange">'+state.decisions+'</b><br><small class="muted">real decisions</small></div><div class="stat"><b>£'+state.saved+'</b><br><small class="muted">spend avoided</small></div></div>');}
function decision(){return shell('<button class="btn ghost" data-screen="home">← Back</button><div style="margin-top:25px"><div class="eyebrow">REAL-WORLD MODE</div><h1>Can I afford it?</h1><p class="muted">No judgement. Just the trade-off.</p><label class="label">Purchase amount<input id="amount" class="field" type="number" min="0" placeholder="18"></label><div class="card"><div class="eyebrow">EXAMPLE</div><p class="muted">A £30 purchase is not just £30. It is £30 less available for food, travel, savings or your next night out.</p></div><button class="btn" data-action="analyse">Show consequence →</button></div>');}
function consequence(){var v=Number(document.getElementById('amount').value)||0;state.pending=v;return shell('<button class="btn ghost" data-action="decision">← Change amount</button><div style="margin-top:25px"><div class="eyebrow">THE TRADE-OFF</div><h1>£'+v.toFixed(2)+' <span class="orange">gone.</span></h1><div class="card hero center"><div class="eyebrow">YOUR NEXT MOVE</div><h2>'+ (v>=50?'That is a meaningful decision.':'Small decisions still compound.') +'</h2><p class="muted">Would you still buy it knowing exactly what it costs your future options?</p></div><div class="grid"><button class="btn" data-action="bought">I bought it</button><button class="btn ghost" data-action="skipped">I skipped it</button></div></div>');}
var qs=[['A card costs 29.9% APR. You have spare cash.','Clear expensive debt first','Invest it regardless'],['You have £75 until Friday. A £35 night out is offered.','Skip or downgrade','Go and hope'],['Savings return 4%, inflation 3%. Approximate real gain?','1%','7%'],['Which has concentration risk?','100% in one company','Diversified global index'],['£725 rent vs £775 rent, but B saves £35 transport monthly.','B saves £600/year','A saves £600/year']];
function games(){state.game='sprint';state.round=0;state.score=0;return game();}
function duel(){state.game='duel';state.round=0;state.score=0;return game();}
function game(){var q=qs[state.round%qs.length];var correct=0;return shell('<div class="eyebrow">'+(state.game==='sprint'?'⚡ MONEY SPRINT':'⚔️ DECISION DUEL')+'</div><div class="top" style="margin:8px 0 20px"><b>ROUND '+(state.round+1)+' / '+(state.game==='sprint'?5:3)+'</b><span class="orange" style="font-size:25px;font-weight:950">'+state.score+' XP</span></div><div class="card hero"><span class="tag">'+(state.game==='sprint'?'FAST':'SMART')+'</span><h2>'+q[0]+'</h2></div><button class="choice" data-gameanswer="0">A · '+q[1]+'</button><button class="choice" data-gameanswer="1">B · '+q[2]+'</button><p class="muted" style="text-align:center;font-size:12px">'+(state.game==='sprint'?'Trust your instinct. Speed matters.':'Think about the consequence, not the headline.')+'</p>');}
function train(){var lessons=[['Runway maths','£420 cash, £300 rent due, £50 buffer, 7 days to payday. What is flexible per day?','£10','£17.14'],['Opportunity cost','You have £90 flexible money. Spending £45 means £45 cannot fund another goal. What concept?','Liquidity','Opportunity cost'],['Credit','Two cards advertise 19%. One has a £60 compulsory annual fee. What should you compare?','Headline rate','APR / total borrowing cost'],['Buffer design','You have £250 cash, irregular income and no emergency reserve. Strongest move?','Keep a protected reserve','Spend it because cash loses value']];var l=lessons[state.lesson%lessons.length];return shell('<div class="eyebrow">TRAIN · SKILL TREE</div><h1>Build your<br><span class="orange">money brain.</span></h1><div class="card"><b>'+belt()+' BELT</b><span class="orange" style="float:right">'+state.xp+' XP</span><div class="progress"><span style="width:'+Math.min(100,state.xp%100)+'%"></span></div></div><div class="eyebrow" style="margin-top:25px">CHALLENGE '+(state.lesson+1)+'</div><div class="card"><h2>'+l[0]+'</h2><p>'+l[1]+'</p><button class="choice" data-answer="0">'+l[2]+'</button><button class="choice" data-answer="1">'+l[3]+'</button></div>');}
function profile(){return shell('<div class="eyebrow">YOUR PROFILE</div><h1>The <span class="orange">legend.</span></h1><div class="card hero"><div class="eyebrow">CURRENT BELT</div><div class="big orange">'+belt()+'</div><p class="muted">'+state.xp+' XP</p></div><div class="grid"><div class="stat"><b>🔥 '+state.streak+'</b><br><small class="muted">streak</small></div><div class="stat"><b>'+state.decisions+'</b><br><small class="muted">decisions</small></div><div class="stat"><b>'+state.lesson+'</b><br><small class="muted">skills</small></div><div class="stat"><b>£'+state.saved+'</b><br><small class="muted">avoided</small></div></div><button class="btn ghost" data-action="reset">Reset dojo</button>');}
function render(){var a=document.getElementById('app');if(state.screen==='home')a.innerHTML=home();else if(state.screen==='train')a.innerHTML=train();else if(state.screen==='profile')a.innerHTML=profile();}
document.addEventListener('click',function(e){var b=e.target.closest('[data-screen],[data-action],[data-gameanswer],[data-answer]');if(!b)return;if(b.dataset.screen){state.screen=b.dataset.screen;save();render();return}if(b.dataset.action){var a=b.dataset.action;if(a==='decision'){state.screen='decision';document.getElementById('app').innerHTML=decision();return}if(a==='analyse'){document.getElementById('app').innerHTML=consequence();return}if(a==='bought'||a==='skipped'){state.decisions++;if(a==='skipped'){state.saved+=Math.round(state.pending||0)}state.xp+=25;save();state.screen='home';render();toast(a==='skipped'?'+25 XP · smart skip':'Logged · keep training');return}if(a==='games'){state.game='sprint';state.round=0;state.score=0;document.getElementById('app').innerHTML=game();return}if(a==='duel'){state.game='duel';state.round=0;state.score=0;document.getElementById('app').innerHTML=game();return}if(a==='reset'){localStorage.removeItem(key);location.reload();return}}if(b.dataset.gameanswer!==undefined){var q=qs[state.round%qs.length];var ok=Number(b.dataset.gameanswer)===0;if(ok){state.score+=state.game==='sprint'?10:15;toast('Correct · +XP')}else{toast('Not quite · next one')}state.round++;if(state.round>=(state.game==='sprint'?5:3)){state.xp+=state.score;save();state.screen='home';render();toast('Run complete · '+state.score+' XP');}else{document.getElementById('app').innerHTML=game();}return}if(b.dataset.answer!==undefined){var lesson=state.lesson%4;var good=Number(b.dataset.answer)===1; if(good){state.xp+=20;state.lesson++;save();toast('🔥 Skill unlocked · +20 XP');}else toast('Try the other move');return}});
try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}}catch(e){}
render();
})();
</script>
</body>
</html>
