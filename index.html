<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Unidojo</title>
<style>
:root{--bg:#080808;--panel:#131313;--panel2:#181818;--line:#292929;--text:#fff;--muted:#9a9a9a;--accent:#ff9800;--green:#35d399;--red:#ff5d73}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{min-height:48px;border:1px solid #333;border-radius:14px;padding:12px 16px;background:var(--panel2);color:#fff;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.99)}button.primary{background:var(--accent);border-color:var(--accent);color:#111;font-weight:900}.ghost{background:transparent}.danger{border-color:#5a2630;color:#ff9aaa}.muted{color:var(--muted)}main{width:100%;max-width:680px;margin:0 auto;padding:20px 16px calc(92px + env(safe-area-inset-bottom))}h1,h2,h3{line-height:1.15}h1{font-size:34px;margin:8px 0 20px}h2{font-size:25px;margin:4px 0 12px}.brand span{color:var(--accent)}.card,.stock{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;overflow:hidden}.card.tight{padding:14px}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.input,.qty{display:block;width:100%;min-height:50px;padding:13px 14px;border-radius:13px;border:1px solid #3a3a3a;background:#090909;color:#fff;outline:none}.input:focus,.qty:focus{border-color:var(--accent)}.actions{display:flex;gap:10px;margin-top:16px}.actions>*{flex:1}.progress{height:7px;background:#252525;border-radius:99px;overflow:hidden;margin:10px 0 22px}.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.selected{border-color:var(--accent);background:#241b10}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.price{font-size:24px;font-weight:900}.up{color:var(--green)}.down{color:var(--red)}.stock .actions{margin-top:10px}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(9,9,9,.96);backdrop-filter:blur(14px);border-top:1px solid #292929;display:flex;gap:6px}.nav button{flex:1;min-width:0;padding:10px 5px;min-height:46px;border:0;background:transparent;font-size:13px}.nav button.active{background:#1c1c1c;color:var(--accent)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#202020;color:#bbb;font-size:12px}.hero{padding-top:18px}.big{font-size:42px;font-weight:950;letter-spacing:-1px}.list{display:grid;gap:10px}.error{color:#ff9aaa;margin-top:8px;font-size:14px}.success{color:var(--green);margin-top:8px;font-size:14px}.hide{display:none!important}@media(max-width:480px){main{padding:14px 12px calc(88px + env(safe-area-inset-bottom))}.card,.stock{border-radius:17px;padding:15px}h1{font-size:30px}.big{font-size:36px}.actions{flex-direction:column}.actions>*{width:100%}.nav button{font-size:12px}.row.mobile-stack{align-items:flex-start;flex-direction:column}.stock .row{align-items:flex-start}.stock .price{font-size:21px}}
</style>
</head>
<body>
<main><div class="brand"><h1>uni<span>dojo</span></h1></div><div id="app"></div></main>
<nav class="nav" id="nav"><button id="nToday" onclick="home()">Today</button><button id="nMarkets" onclick="markets()">Markets</button><button id="nTrain" onclick="train()">Train</button><button id="nAccount" onclick="account()">Account</button></nav>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const app=document.getElementById('app');
const stocks=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','V','NFLX','JPM','KO','MCD'];
const names={AAPL:'Apple',MSFT:'Microsoft',NVDA:'NVIDIA',AMZN:'Amazon',GOOGL:'Alphabet',META:'Meta',TSLA:'Tesla',V:'Visa',NFLX:'Netflix',JPM:'JPMorgan',KO:'Coca-Cola',MCD:"McDonald's"};
const seed={AAPL:332.27,MSFT:510,NVDA:176,AMZN:232,GOOGL:246,META:748,TSLA:350,V:350,NFLX:1180,JPM:300,KO:70,MCD:310};
let live={},cash=10000,holdings={},profile={};
const KEY='unidojo-state-v3';
function loadLocal(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');profile=x.profile||{};cash=Number.isFinite(x.cash)?x.cash:10000;holdings=x.holdings||{}}catch(e){}}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify({profile,cash,holdings}))}
function onboardDone(){return !!profile.onboardingComplete}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setNav(active){['Today','Markets','Train','Account'].forEach(x=>document.getElementById('n'+x).classList.toggle('active',active===x))}
function onboarding(step=1){
 setNav('');let data=profile;let pct=Math.round((step/4)*100);
 let body='';
 if(step===1) body=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 1/4</span><h2>Let’s build your money profile.</h2><p class="muted">This takes about a minute. It makes the training and spending missions relevant to you.</p><div class="field"><label>Your first name</label><input class="input" id="obName" autocomplete="given-name" value="${esc(data.name||'')}" placeholder="e.g. Conn"></div><div class="field"><label>Your age</label><input class="input" id="obAge" type="number" inputmode="numeric" min="13" max="100" value="${esc(data.age||'')}" placeholder="e.g. 18"></div></div>`;
 if(step===2) body=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 2/4</span><h2>What does your monthly money look like?</h2><p class="muted">Rough numbers are completely fine. We use them to teach runway, trade-offs and affordability.</p><div class="field"><label>Monthly income / money available (£)</label><input class="input" id="obIncome" type="number" inputmode="decimal" min="0" value="${esc(data.income??'')}" placeholder="e.g. 850"></div><div class="field"><label>Monthly rent / housing (£)</label><input class="input" id="obRent" type="number" inputmode="decimal" min="0" value="${esc(data.rent??'')}" placeholder="e.g. 750"></div><div class="field"><label>Typical weekly flexible spending (£)</label><input class="input" id="obSpend" type="number" inputmode="decimal" min="0" value="${esc(data.weeklySpend??'')}" placeholder="e.g. 80"></div></div>`;
 if(step===3) body=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 3/4</span><h2>What are you trying to get better at?</h2><p class="muted">Pick the goal that matters most right now.</p>${['Stop wasting money','Build a safety buffer','Understand investing','Get better with credit & debt','All of the above'].map((x,i)=>`<button class="choice ${data.goal===x?'selected':''}" onclick="pickGoal(${i})">${x}</button>`).join('')}<input type="hidden" id="obGoal" value="${esc(data.goal||'')}"></div>`;
 if(step===4) body=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 4/4</span><h2>How confident are you with money?</h2><p class="muted">No judgement. This only sets your starting point.</p>${['I’m starting from scratch','I know the basics','I’m fairly confident','I want serious finance training'].map((x,i)=>`<button class="choice ${data.confidence===x?'selected':''}" onclick="pickConfidence(${i})">${x}</button>`).join('')}<input type="hidden" id="obConfidence" value="${esc(data.confidence||'')}"></div>`;
 app.innerHTML=`<div class="progress"><i style="width:${pct}%"></i></div>${body}<div class="actions">${step>1?'<button class="ghost" onclick="onboarding('+(step-1)+')">Back</button>':''}<button class="primary" onclick="saveOnboarding(${step})">${step===4?'Finish setup':'Continue'}</button></div>`;
}
function pickGoal(i){let a=['Stop wasting money','Build a safety buffer','Understand investing','Get better with credit & debt','All of the above'];profile.goal=a[i];onboarding(3)}
function pickConfidence(i){let a=['I’m starting from scratch','I know the basics','I’m fairly confident','I want serious finance training'];profile.confidence=a[i];onboarding(4)}
async function saveOnboarding(step){
 if(step===1){profile.name=document.getElementById('obName').value.trim();profile.age=+document.getElementById('obAge').value||'';if(!profile.name||!profile.age){alert('Add your name and age first.');return}onboarding(2);return}
 if(step===2){profile.income=+document.getElementById('obIncome').value||0;profile.rent=+document.getElementById('obRent').value||0;profile.weeklySpend=+document.getElementById('obSpend').value||0;onboarding(3);return}
 if(step===3){if(!profile.goal){alert('Pick a goal first.');return}onboarding(4);return}
 if(step===4){if(!profile.confidence){alert('Pick your confidence level first.');return}profile.onboardingComplete=true;saveLocal();home();setTimeout(accountPrompt,250);syncProfile();}
}
function accountPrompt(){if(localStorage.getItem('unidojo-account-prompted')==='1')return;localStorage.setItem('unidojo-account-prompted','1');account(true)}
async function syncProfile(){try{if(!window.supabase||!UNIDOJO_SUPABASE_URL)return;let s=window.supabase.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY);let {data:{user}}=await s.auth.getUser();if(!user)return;await s.from('profiles').upsert({id:user.id,name:profile.name,age:profile.age,income:profile.income,rent:profile.rent,weekly_spend:profile.weeklySpend,goal:profile.goal,confidence:profile.confidence,onboarding_complete:true},{onConflict:'id'})}catch(e){console.warn(e)}}
function home(){if(!onboardDone()){onboarding(1);return}setNav('Today');app.innerHTML=`<div class="card hero"><div class="row"><div><span class="pill">TODAY</span><h2>Train your money brain.</h2></div><div class="big">🔥 ${profile.streak||0}</div></div><p class="muted">Welcome back, ${esc(profile.name||'there')}. Make one good money decision today.</p><div class="actions"><button class="primary" onclick="markets()">Enter Markets →</button><button onclick="train()">Train +XP</button></div></div><div class="card"><h3>Can I afford it?</h3><p class="muted">Turn a real purchase into a decision, not a guess.</p><input id="amt" class="input" type="number" inputmode="decimal" min="0" placeholder="Purchase amount (£)"><button class="primary" style="width:100%;margin-top:10px" onclick="decision()">Check the trade-off</button></div><div class="card"><div class="row"><b>Your money profile</b><span class="pill">LEVEL 1</span></div><p class="muted">Goal: ${esc(profile.goal||'Choose a goal')}</p><p class="muted">Weekly flexible spend: £${Number(profile.weeklySpend||0).toFixed(0)}</p></div>`}
function decision(){let n=+document.getElementById('amt').value||0;let weekly=+profile.weeklySpend||0;let after=Math.max(0,weekly-n);app.innerHTML=`<button class="ghost" onclick="home()">← Today</button><div class="card hero"><span class="pill">MONEY DECISION</span><div class="big">£${n.toFixed(0)}</div><h2>What does this purchase trade away?</h2><p class="muted">If your usual weekly flexible spending is £${weekly.toFixed(0)}, this purchase is ${weekly?Math.round(n/weekly*100):0}% of that amount. The right answer depends on your priorities, not just whether you technically have the cash.</p><div class="actions"><button class="primary" onclick="recordDecision('bought',${n})">I bought it</button><button onclick="recordDecision('skipped',${n})">I skipped it</button></div></div>`}
function recordDecision(outcome,n){profile.decisions=(profile.decisions||0)+1;if(outcome==='skipped')profile.saved=(profile.saved||0)+n;saveLocal();syncDecision(n,outcome);home()}
async function syncDecision(amount,outcome){try{if(!window.supabase)return;let s=window.supabase.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY);let {data:{user}}=await s.auth.getUser();if(user)await s.from('decisions').insert({user_id:user.id,amount,outcome})}catch(e){console.warn(e)}}
function get(t){return live[t]||seed[t]}
async function refresh(){for(const t of stocks){try{let r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?range=1d&interval=5m');let j=await r.json();let p=j.chart?.result?.[0]?.meta?.regularMarketPrice;if(typeof p==='number')live[t]=p}catch(e){}}if(location.hash==='#markets')markets()}
function markets(){if(!onboardDone()){onboarding(1);return}setNav('Markets');app.innerHTML=`<div class="row"><div><span class="pill">MARKETS</span><h2>Paper trading</h2></div><div style="text-align:right"><b>£${cash.toFixed(2)}</b><br><span class="muted">virtual cash</span></div></div><div class="card tight"><p class="muted" style="margin:0">£10,000 starting cash · multiple-share orders · public price refresh with fallback prices.</p></div><div class="list">${stocks.map(t=>`<div class="stock"><div class="row"><div><b>${t}</b><br><span class="muted">${names[t]}</span></div><div style="text-align:right"><div class="price">$${get(t).toFixed(2)}</div><small class="${get(t)>=seed[t]?'up':'down'}">${((get(t)/seed[t]-1)*100).toFixed(2)}%</small></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="trade('${t}')">Open ${t} →</button></div>`).join('')}</div>`}
function trade(t){let p=get(t);setNav('Markets');app.innerHTML=`<button class="ghost" onclick="markets()">← Markets</button><div class="card hero"><span class="pill">${names[t]} · ${t}</span><div class="big">$${p.toFixed(2)}</div><p class="muted">Public market price where available. This is simulated trading, not real investing.</p><div class="field"><label>Quantity</label><input id="q" class="input" type="number" inputmode="numeric" min="1" step="1" value="1"></div><div class="actions"><button class="primary" onclick="buy('${t}')">Buy shares</button><button onclick="sell('${t}')">Sell shares</button></div></div><div class="card"><b>Unidojo Coach</b><p class="muted">Before you buy: why this company, why now, and what information would make you change your mind?</p></div><div class="card"><b>Your position</b><p class="muted">${holdings[t]||0} shares · ${holdings[t]?('$'+(holdings[t]*p).toFixed(2)+' at current price'):'No position yet'}</p></div>`}
function buy(t){let q=Math.max(1,Math.floor(+document.getElementById('q').value||1)),c=q*get(t);if(c>cash){alert('Not enough virtual cash');return}cash-=c;holdings[t]=(holdings[t]||0)+q;saveLocal();trade(t)}
function sell(t){let q=Math.max(1,Math.floor(+document.getElementById('q').value||1));if((holdings[t]||0)<q){alert('You do not own enough shares');return}cash+=q*get(t);holdings[t]-=q;saveLocal();trade(t)}
function train(){if(!onboardDone()){onboarding(1);return}setNav('Train');app.innerHTML=`<div class="card hero"><span class="pill">TRAIN · +10 XP</span><h2>Concentration risk</h2><p>If 40% of your portfolio sits in one company, one thesis controls a huge part of your outcome. Diversification reduces the damage one wrong call can do.</p><h3>Apply it</h3><p class="muted">If you had £10,000 and put £8,000 into one stock, what happens to your portfolio if that stock falls 20%?</p><button class="choice" onclick="alert('£8,000 × 20% = £1,600 lost. That is a 16% hit to the whole £10,000 portfolio.')">Show the maths</button><button class="primary" style="width:100%" onclick="markets()">Apply it in Markets →</button></div>`}
function account(prompt=false){setNav('Account');app.innerHTML=`<div class="card hero"><span class="pill">ACCOUNT</span><h2>${prompt?'Save your progress':'Save your dojo'}</h2><p class="muted">${prompt?'Your onboarding, decisions and future progress are currently stored on this device. Create a free account to keep your progress across devices.':'Guest mode works locally. Sign in to sync your Unidojo profile and decisions.'}</p><div class="field"><label>Email</label><input id="em" class="input" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="pw" class="input" type="password" autocomplete="new-password" placeholder="8+ characters"></div><div id="authMsg"></div><div class="actions"><button class="primary" onclick="signup()">Create account</button><button onclick="signin()">Sign in</button></div>${prompt?'<button class="ghost" style="width:100%;margin-top:8px" onclick="home()">Keep using Unidojo without an account</button>':''}</div>`}
function client(){return window.supabase?.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY)}
async function signup(){let s=client(),email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value;if(!s){showAuth('Account service is still loading. Try again in a second.',true);return}if(password.length<8){showAuth('Use a password of at least 8 characters.',true);return}let r=await s.auth.signUp({email,password,options:{data:{name:profile.name,age:profile.age}}});if(r.error){showAuth(r.error.message,true);return}if(r.data.session){showAuth('Account created. Your Unidojo profile is now connected.',false);await syncProfile()}else showAuth('Account created. Check your email to confirm it, then sign in.',false)}
async function signin(){let s=client(),email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value;if(!s){showAuth('Account service is still loading.',true);return}let r=await s.auth.signInWithPassword({email,password});if(r.error){showAuth(r.error.message,true);return}showAuth('Signed in. Your account is connected.',false);await syncProfile()}
function showAuth(t,bad){let x=document.getElementById('authMsg');if(x)x.className=bad?'error':'success',x.textContent=t}
async function boot(){loadLocal();try{if('serviceWorker' in navigator){let regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if(window.caches){let ks=await caches.keys();await Promise.all(ks.filter(k=>k.toLowerCase().includes('unidojo')).map(k=>caches.delete(k)))}}catch(e){}if(!onboardDone())onboarding(1);else home();refresh();setInterval(refresh,60000)}
boot();
</script>
</body></html>
