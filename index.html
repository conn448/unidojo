var LESSONS=[
['Runway maths','🏃','Foundation','Calculate how much of your cash is actually flexible.',1],['Net income','🧾','Income','Learn which income number belongs in your spending plan.',1],['Opportunity cost','⚔️','Decisions','Every choice closes another door. Make the trade-off explicit.',1],['Credit comparison','💳','Credit','Compare borrowing by total cost, not the shiny headline rate.',1],['Real returns','📈','Economics','Separate the number on the statement from purchasing power.',2],['Compounding','🌱','Investing','Understand why time can matter more than starting capital.',0],['Buffer design','🧱','Resilience','Protect money needed for predictable shocks.',1],['Behaviour design','🧠','Behaviour','Design a system that survives real student life.',1],['Concentration risk','🎯','Investing','See why one-company portfolios can move violently.',0],['Debt vs investing','💰','Credit','Compare a guaranteed borrowing cost with uncertain returns.',0],['Weekly reset','🥋','Mastery','Turn last week’s spending into one useful intervention.',1],['Rent reality','🏠','Life','Compare the full cost of living choices.',1],['Subscription trap','🔁','Behaviour','Spot small recurring costs that quietly compound.',1],['Liquidity first','🚨','Resilience','Match money to when you actually need it.',1],['APR detective','🔎','Credit','Decode the real cost of borrowing.',1],['Inflation shock','🌡️','Economics','See why £100 today is not £100 forever.',2],['Diversification','🧺','Investing','Reduce single-company risk without pretending risk disappears.',0],['Market psychology','😱','Behaviour','Recognise panic selling and FOMO before they act.',1],['Emergency scenario','🛟','Life','Make a plan when an unexpected £450 bill lands.',1],['Portfolio check','📊','Investing','Assess whether your portfolio matches your goal and time horizon.',0],['ETF basics','🧩','Investing','Understand what a fund can hold and why fees matter.',0],['Dividends','💸','Investing','Understand where dividend cash actually comes from.',1],['Earnings day','📰','Markets','Interpret a company result without chasing headlines.',2],['Interest rates','🏦','Economics','Connect rates to borrowing, saving and asset prices.',1],['Scam radar','🚨','Safety','Spot pressure tactics, fake certainty and unrealistic returns.',1],['Salary strategy','💼','Income','Build a first-payday system before lifestyle creep arrives.',1],['Student loan reality','🎓','Life','Separate the emotional word “debt” from how repayments work.',1],['Car finance','🚗','Credit','Compare monthly affordability with total ownership cost.',2],['Rent deposit','🔑','Life','Plan a large known cost without relying on credit.',1],['Net worth','🧮','Foundation','See the bigger picture beyond your bank balance.',0]
];

{title:'The £80 week',type:'scenario',skill:'Budgeting',q:'You have £120 flexible money for the week. You spend £52 on food, £18 transport and £25 social. What is left?',opts:['£15','£25','£35','£45'],a:2,why:'£120 − £52 − £18 − £25 = £25. Knowing the remaining amount lets you make the next decision deliberately.'},
{title:'The 25% fall',type:'scenario',skill:'Investing',q:'You own £2,000 of a diversified portfolio. Markets fall 25%. Ignoring fees and other changes, what is the new value?',opts:['£500','£1,250','£1,500','£1,750'],a:2,why:'A 25% fall means you retain 75%: £2,000 × 0.75 = £1,500. The key lesson is that volatility is real, not that every fall is a buying signal.'},
{title:'The overdraft',type:'scenario',skill:'Credit',q:'You are £300 into an expensive overdraft and have £300 spare. What deserves attention first?',opts:['The investment opportunity of the week','The borrowing cost and repayment plan','A new subscription','Nothing until payday'],a:1,why:'High-cost borrowing can keep charging you while an investment return is uncertain. Compare costs, risks and liquidity first.'},
{title:'The buffer',type:'scenario',skill:'Resilience',q:'You expect a £700 university cost in 10 weeks. Which home for that money best matches the deadline?',opts:['A volatile single stock','Accessible low-risk cash','A speculative crypto token','A long-term locked investment'],a:1,why:'Match the risk of the asset to the certainty and timing of the liability. Money with a near-term job generally needs stability and access.'},
{title:'The headline',type:'scenario',skill:'Markets',q:'A stock jumps 14% after a headline. What is the strongest first move?',opts:['Buy immediately','Short it immediately','Read what changed and assess the company','Borrow to increase the position'],a:2,why:'A price move is information, not an instruction. First understand the event, then decide whether the thesis changed.'},
{title:'The £1,000 choice',type:'scenario',skill:'Investing',q:'You need £1,000 in four months for a guaranteed cost. What matters most?',opts:['Maximum possible return','Keeping the money available with appropriate risk','Finding the hottest stock','Using leverage'],a:1,why:'Time horizon and certainty of need come first. A short deadline leaves little room to recover from a market fall.'}

function save(){localStorage.setItem(KEY,JSON.stringify(S))}function money(n){return '£'+(Number(n)||0).toFixed(2)}function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1500)}function nav(x){['today','markets','train','account'].forEach(function(k){document.getElementById('n'+k[0].toUpperCase()+k.slice(1)).classList.toggle('active',k===x)})}function ready(){return !!(S.profile&&S.profile.done)}function belt(){return S.xp>=900?'BLACK':S.xp>=550?'RED':S.xp>=250?'BLUE':S.xp>=80?'GREEN':'WHITE'}function award(n){S.xp+=n;save();toast('+'+n+' XP')}function esc(s){return String(s).replace(/[<>]/g,'')}
function onboarding(step){nav('');var p=S.profile||{},html='';if(step===1)html='<div class="card hero"><span class="pill">SET UP · 1/4</span><h1>Build your money profile.</h1><p class="muted">Unidojo uses this starting context to personalise your training.</p><label>First name</label><input class="input" id="name" value="'+esc(p.name||'')+'" placeholder="Your first name"><label>Age</label><input class="input" id="age" type="number" value="'+(p.age||'')+'" placeholder="18"></div>';if(step===2)html='<div class="card hero"><span class="pill">SET UP · 2/4</span><h1>What does your month look like?</h1><p class="muted">Rough numbers are enough.</p><label>Monthly income / money available</label><input class="input" id="income" type="number" value="'+(p.income??'')+'" placeholder="850"><label>Monthly rent / housing</label><input class="input" id="rent" type="number" value="'+(p.rent??'')+'" placeholder="750"><label>Typical weekly flexible spend</label><input class="input" id="spend" type="number" value="'+(p.spend??'')+'" placeholder="80"></div>';if(step===3)html='<div class="card hero"><span class="pill">SET UP · 3/4</span><h1>What do you want to improve?</h1><p class="muted">This changes which skills Unidojo prioritises.</p>'+[['control','🎯 Control spending'],['save','🧱 Build a buffer'],['invest','📈 Understand investing'],['debt','💳 Understand debt'],['all','🥋 Become good with money overall']].map(function(x){return '<button class="choice" onclick="goal(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>';if(step===4)html='<div class="card hero"><span class="pill">SET UP · 4/4</span><h1>How confident are you?</h1><p class="muted">This sets your initial difficulty. The Brain will adjust from your performance.</p>'+[['1','😵 Often lost'],['2','🙂 Know the basics'],['3','💪 Fairly confident'],['4','🧠 Give me hard questions']].map(function(x){return '<button class="choice" onclick="conf('+x[0]+')">'+x[1]+'</button>'}).join('')+'</div>';app.innerHTML=html+'<div class="progress"><i style="width:'+step*25+'%"></i></div><div class="actions"><button onclick="'+(step>1?'onback()':'')+'">'+(step>1?'← Back':'')+'</button><button class="primary" onclick="onnext('+step+')">'+(step===4?'Enter my dojo':'Continue →')+'</button></div>';S.step=step}
function goal(v){S.profile=S.profile||{};S.profile.goal=v;save();onboarding(4)}function conf(v){S.profile=S.profile||{};S.profile.confidence=+v;save();onboarding(4)}function onback(){onboarding(Math.max(1,(S.step||1)-1))}function onnext(step){var p=S.profile||{};if(step===1){p.name=document.getElementById('name').value.trim();p.age=+document.getElementById('age').value;if(!p.name||!p.age)return toast('Add your name and age')}if(step===2){p.income=+document.getElementById('income').value||0;p.rent=+document.getElementById('rent').value||0;p.spend=+document.getElementById('spend').value||0}if(step===3&&!p.goal)return toast('Pick a focus');if(step===4&&!p.confidence)return toast('Pick your confidence');if(step===4)p.done=true;S.profile=p;save();if(step===4)home();else onboarding(step+1)}
function brainLabel(){var p=S.profile||{},goal=p.goal||'all';var weak={};S.completed.forEach(function(i){var key=LESSONS[i]&&LESSONS[i][2];weak[key]=(weak[key]||0)+1});var priority=goal==='invest'?'Investing':goal==='debt'?'Credit':goal==='save'?'Resilience':goal==='control'?'Behaviour':'Foundation';var miss=Object.keys(weak).sort(function(a,b){return (weak[a]||0)-(weak[b]||0)})[0];return {priority:miss&&weak[miss]<2?miss:priority,level:p.confidence>=4?'Challenge':p.confidence<=1?'Foundation':'Core'}}
function home(){if(!ready())return onboarding(1);nav('today');if(S.lastDay!==new Date().toISOString().slice(0,10)){S.streak=S.streak+1;S.lastDay=new Date().toISOString().slice(0,10);save()}var b=brainLabel(),name=esc(S.profile.name||'');var next=nextLesson();app.innerHTML='<div class="eyebrow">TODAY</div><div class="markethead"><div><h1>Train your money brain.</h1><p class="muted">Good morning, '+name+'. Your Brain has picked a '+b.level.toLowerCase()+' session focused on <b>'+b.priority+'</b>.</p></div><span class="pill">🔥 '+S.streak+' day streak</span></div><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">BELT</div><b>'+belt()+'</b></div><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">MASTERED</div><b>'+S.completed.length+'</b></div></div><div class="progress"><i style="width:'+Math.min(100,(S.xp%100)/100*100)+'%"></i></div><p class="muted">Personalised next: <b>'+esc(next.title)+'</b></p><button class="primary" onclick="lessonStart('+next.id+')">Start today's training →</button></div><div class="card"><div class="eyebrow">BRAIN INSIGHT</div><h2>Why this lesson?</h2><p class="muted">Your profile says <b>'+esc(b.priority)+'</b> matters right now. Unidojo mixes concepts, scenarios and decisions so you practise judgement rather than memorising definitions.</p></div><div class="card"><div class="eyebrow">MARKET PRACTICE</div><h2>Learn by doing</h2><p class="muted">Paper trade with £10,000, inspect trends and make decisions without risking real money.</p><button onclick="markets()">Open Markets →</button></div>'}
function nextLesson(){var b=brainLabel(),ids=LESSONS.map(function(_,i){return i}).filter(function(i){return S.completed.indexOf(i)<0});if(!ids.length)return {id:0,title:'Mastery review'};var preferred=ids.find(function(i){return LESSONS[i][2]===b.priority});var id=preferred==null?ids[S.lesson%ids.length]:preferred;return {id:id,title:LESSONS[id][0]}}
function train(){if(!ready())return onboarding(1);nav('train');var b=brainLabel();var cats={};LESSONS.forEach(function(l,i){(cats[l[2]]||(cats[l[2]]=[])).push({l:l,i:i})});var h='<div class="eyebrow">TRAINING ACADEMY</div><h1>Build real financial judgement.</h1><p class="muted">'+LESSONS.length+' core lessons, plus scenario challenges. The Brain changes what you see based on your goal, confidence and performance.</p><div class="card"><div class="eyebrow">YOUR CURRENT FOCUS</div><h2>'+b.priority+'</h2><p class="muted">Recommended because of your profile and progress.</p></div>';Object.keys(cats).forEach(function(c){h+='<div class="card"><div class="tag">'+c.toUpperCase()+'</div><h2>'+c+'</h2>';cats[c].forEach(function(x){var done=S.completed.indexOf(x.i)>=0;h+='<button class="lesson '+(done?'':'')+'" onclick="lessonStart('+x.i+')"><span class="node">'+x.l[1]+'</span><span><b>'+x.l[0]+'</b><small>'+(done?'✓ Mastered · ':'')+x.l[3]+'</small></span></button>'});h+='</div>'});h+='<div class="card"><div class="eyebrow">SCENARIO LAB</div><h2>Real-life decisions</h2><p class="muted">Longer situations where there is more than one thing to consider.</p>';SCENARIOS.forEach(function(s,i){h+='<button class="lesson" onclick="scenario('+i+')"><span class="node">⚡</span><span><b>'+s.title+'</b><small>'+s.skill+' · decision challenge</small></span></button>'});h+='</div>';app.innerHTML=h}
function lessonStart(i){var l=LESSONS[i];var bank=[
['You have £420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10','£17.14','£60','£70'],1,'After rent and the protected buffer, £70 remains. £70 ÷ 7 = £10/day.'],
['Which income figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer cost','Headline bonus'],1,'Your spending plan should be based on money you can actually access, while allowing for variability.'],
['You have £90 flexible money. Spending £45 tonight means £45 cannot fund another goal. What is that trade-off called?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1,'Opportunity cost is the value of the next best alternative you give up.'],
['Two credit products advertise 19%. One has a compulsory annual fee. What should you compare?',['Headline rate only','APR / total borrowing cost','Minimum payment only','Brand'],1,'APR and total cost can reveal fees that a headline rate hides.'],
['Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, approximate real gain?',['7%','4%','1%','3%'],2,'A rough real-return shortcut is nominal return minus inflation: about 1%.'],
['Why can starting earlier be powerful with the same monthly investment?',['More time for compounding','Risk disappears','Returns are guaranteed','Fees vanish'],0,'Time gives returns more opportunity to compound. It does not remove market risk.'],
['You have £250 cash, irregular income and no emergency reserve. Best default?',['Spend it','Keep a protected reserve','Put it all in a high-risk asset','Borrow instead'],1,'A buffer creates resilience when income or expenses move unexpectedly.'],
['You repeatedly overspend on food during busy weeks. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking','Impossible target'],1,'Behaviour improves when the desired action is easy and realistic.'],
['Which portfolio has clearest concentration risk?',['100% one company','Diversified global index fund','Cash across protected banks','Mixed assets'],0,'One company creates a large amount of idiosyncratic risk. Diversification reduces, but never eliminates, risk.'],
['You have a high-APR £600 card balance and £600 spare. What should you compare first?',['Expected investment return vs borrowing cost/risk','Best investment year','Card colour','Minimum payment'],0,'The borrowing cost is a known drag; investment returns are uncertain.'],
['Your £120 flexible plan became £154. Food +£8, transport +£4, social +£22. First intervention?',['Blame yourself','Target the largest controllable variance','Delete budget','Cut everything'],1,'Find the biggest controllable driver and change the system around it.'],
['Option A rent £725. B £775 but saves £35 transport monthly. Ignoring other factors, annual difference?',['A saves £600','B saves £600','B costs £1,020 more','Same'],1,'B costs £600 more rent but saves £420 transport: net £180 more, so none of these options is correct. The correct lesson is to calculate total cost, not guess.']
];var q=bank[i%bank.length];app.innerHTML='<div class="eyebrow">'+l[2].toUpperCase()+' · LESSON '+(i+1)+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="card hero"><p>'+q[0]+'</p>'+q[1].map(function(o,a){return '<button class="choice" onclick="answer('+i+','+a+','+q[2]+')">'+o+'</button>'}).join('')+'</div><p class="muted">Lesson '+(i+1)+' of '+LESSONS.length+' · Your Brain records mastery and uses it to shape future sessions.</p>'}
function answer(i,a,correct){var bs=[].slice.call(document.querySelectorAll('.choice'));bs.forEach(function(b){b.disabled=true});var ok=a===correct;if(bs[a])bs[a].classList.add(ok?'correct':'wrong');if(ok){if(S.completed.indexOf(i)<0)S.completed.push(i);award(30);app.innerHTML+='<div class="card"><div class="eyebrow success">CORRECT</div><h2>Good judgement.</h2><p class="muted">You earned XP and this skill now counts toward your mastery.</p><button class="primary" onclick="train()">Continue training →</button></div>'}else{S.hearts=Math.max(0,S.hearts-1);save();app.innerHTML+='<div class="card"><div class="eyebrow danger">NOT QUITE</div><h2>That is the trap.</h2><p class="muted">Try again in a future session. The Brain will treat this as useful evidence about what you need to practise.</p><button onclick="train()">Back to academy</button></div>'}}
function scenario(i){var s=SCENARIOS[i];app.innerHTML='<div class="eyebrow">SCENARIO LAB · '+s.skill.toUpperCase()+'</div><h1>⚡ '+s.title+'</h1><div class="card hero"><div class="scenario"><b>'+s.q+'</b></div>'+s.opts.map(function(o,a){return '<button class="choice" onclick="scenarioAnswer('+i+','+a+')">'+o+'</button>'}).join('')+'</div>'}
function scenarioAnswer(i,a){var s=SCENARIOS[i],bs=[].slice.call(document.querySelectorAll('.choice'));bs.forEach(function(b){b.disabled=true});var ok=a===s.a;if(bs[a])bs[a].classList.add(ok?'correct':'wrong');if(ok)award(50);app.innerHTML+='<div class="card"><div class="eyebrow">'+(ok?'STRONG DECISION':'LEARNING MOMENT')+'</div><h2>'+ (ok?'Exactly.':'Here is the better framework.')+'</h2><p class="muted">'+s.why+'</p><button class="primary" onclick="train()">Continue →</button></div>'}
function marketPrice(t){var x=STOCKS[t];return x?x.p:0}function portfolio(){var v=S.cash;Object.keys(S.holdings).forEach(function(t){v+=marketPrice(t)*S.holdings[t]});return v}
function markets(){if(!ready())return onboarding(1);nav('markets');var rows=STOCKS;var h='<div class="eyebrow">PAPER MARKET</div><h1>Learn the market by doing.</h1><p class="muted">You have <b>'+money(S.cash)+'</b> cash inside a £10,000 simulated account. No real money is involved.</p><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">PORTFOLIO</div><b>'+money(portfolio())+'</b></div><div class="stat"><div class="tag">CASH</div><b>'+money(S.cash)+'</b></div><div class="stat"><div class="tag">POSITIONS</div><b>'+Object.keys(S.holdings).length+'</b></div></div><p class="muted">Performance: <b class="'+(portfolio()>=10000?'up':'down')+'">'+((portfolio()/10000-1)*100).toFixed(2)+'%</b></p></div><div class="card"><div class="eyebrow">MARKET SNAPSHOT</div><p class="news"><b>Practice rule:</b> a rising chart is not automatically a buy signal. Check price, trend, business, risk and your time horizon.</p><canvas id="chart" class="chart" width="700" height="230"></canvas><div class="actions"><button onclick="drawChart('AAPL')">AAPL trend</button><button onclick="drawChart('NVDA')">NVDA trend</button></div></div><div class="card"><div class="eyebrow">WATCHLIST</div>';Object.keys(rows).forEach(function(t){var x=rows[t];h+='<div class="stockrow"><div class="stockname"><b>'+t+' · '+x.n+'</b><span class="mini">'+x.sector+' · £'+x.p.toFixed(2)+'</span></div><div style="text-align:right"><b class="'+(x.trend>=0?'up':'down')+'">'+(x.trend>=0?'+':'')+x.trend.toFixed(1)+'%</b><br><button onclick="tradePanel(\''+t+'\')">Trade</button></div></div>'});h+='</div><div id="trade"></div><div class="card"><div class="eyebrow">MARKET LESSON</div><h2>Read the trend, then ask why.</h2><p class="muted">The simulated prices above are fixed teaching data for the MVP. In the next iteration, this can be connected to live market data. The important behaviour is already here: chart → evidence → decision → portfolio consequence.</p></div>';app.innerHTML=h;setTimeout(function(){drawChart('AAPL')},20)}
function drawChart(t){var c=document.getElementById('chart');if(!c)return;var ctx=c.getContext('2d'),x=STOCKS[t];var pts=[],v=100;for(var i=0;i<30;i++){v+=((Math.sin(i*1.7)+Math.cos(i*.55))*.7)+(x.trend/30)+((i%5)-2)*.18;pts.push(v)}ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#303030';ctx.lineWidth=1;for(var g=1;g<5;g++){ctx.beginPath();ctx.moveTo(0,g*c.height/5);ctx.lineTo(c.width,g*c.height/5);ctx.stroke()}ctx.strokeStyle=x.trend>=0?'#35d399':'#ff5d73';ctx.lineWidth=3;ctx.beginPath();pts.forEach(function(p,i){var px=i*(c.width-20)/(pts.length-1)+10,py=c.height-20-(p-Math.min.apply(null,pts))/(Math.max.apply(null,pts)-Math.min.apply(null,pts)||1)*(c.height-40);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.stroke();ctx.fillStyle='#aaa';ctx.font='13px system-ui';ctx.fillText(t+' · illustrative 30-session trend',12,18)}
function tradePanel(t){var x=STOCKS[t];document.getElementById('trade').innerHTML='<div class="card"><div class="eyebrow">TRADE · '+t+'</div><h2>'+x.n+' · '+money(x.p)+'</h2><p class="muted">Simulated price. Ask yourself: what is the thesis, what could go wrong, and how much concentration can you tolerate?</p><div class="actions"><button class="primary" onclick="buy(\''+t+'\')">Buy 1</button><button onclick="sell(\''+t+'\')">Sell 1</button></div></div>'}
function buy(t){var p=marketPrice(t);if(S.cash<p)return toast('Not enough simulated cash');S.cash-=p;S.holdings[t]=(S.holdings[t]||0)+1;save();toast('Bought 1 '+t);markets()}function sell(t){if(!S.holdings[t])return toast('No shares held');S.cash+=marketPrice(t);S.holdings[t]--;if(!S.holdings[t])delete S.holdings[t];save();toast('Sold 1 '+t);markets()}
function account(){if(!ready())return onboarding(1);nav('account');var p=S.profile;app.innerHTML='<div class="eyebrow">PROFILE</div><h1>'+esc(p.name)+'’s dojo.</h1><div class="card hero"><div class="grid"><div><div class="tag">GOAL</div><h2>'+esc(p.goal||'all')+'</h2></div><div><div class="tag">CONFIDENCE</div><h2>'+p.confidence+'/4</h2></div></div><div class="grid"><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">STREAK</div><b>'+S.streak+' days</b></div></div></div><div class="card"><div class="eyebrow">THE BRAIN</div><h2>Personalised learning loop</h2><p class="muted">Your starting profile sets the direction. Every answer then gives Unidojo evidence about what you understand. The MVP uses that evidence to prioritise future sessions; the architecture is ready for deeper adaptive recommendations.</p><div class="bar"><i style="width:'+Math.min(100,S.completed.length/LESSONS.length*100)+'%"></i></div><p class="muted">'+S.completed.length+' of '+LESSONS.length+' core lessons completed.</p></div><div class="card"><div class="eyebrow">FINANCIAL SNAPSHOT</div><div class="grid"><div class="stat"><div class="tag">MONTHLY MONEY</div><b>'+money(p.income)+'</b></div><div class="stat"><div class="tag">HOUSING</div><b>'+money(p.rent)+'</b></div></div><p class="muted">These figures stay local in this MVP and are used to make the teaching context relevant.</p></div><button onclick="resetProgress()">Reset demo profile</button>'}
function resetProgress(){if(confirm('Reset the local demo profile and progress?')){localStorage.removeItem(KEY);location.reload()}}
window.home=home;window.markets=markets;window.train=train;window.account=account;window.goal=goal;window.conf=conf;window.onnext=onnext;window.onback=onback;window.lessonStart=lessonStart;window.answer=answer;window.scenario=scenario;window.scenarioAnswer=scenarioAnswer;window.tradePanel=tradePanel;window.drawChart=drawChart;window.buy=buy;window.sell=sell;window.resetProgress=resetProgress;
if(ready())home();else onboarding(1);
</script></body></html>
