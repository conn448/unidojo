<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="A practical daily money coach for UK students.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥋%3C/text%3E%3C/svg%3E">
  <title>Unidojo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--bg:#0a0a0a;--card:#161616;--line:#2b2b2b;--muted:#a1a1aa;--amber:#f59e0b;--amber-dark:#b45309;--green:#34d399;--red:#fb7185;--blue:#60a5fa}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:460px;margin:auto;padding:28px 20px 110px;min-height:100vh}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.btn{width:100%;border:0;border-radius:15px;padding:15px 18px;background:var(--amber);color:#141414;font:inherit;font-weight:800;box-shadow:0 4px 0 var(--amber-dark);cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--amber-dark)}.btn.secondary{background:#262626;color:#fff;box-shadow:0 4px 0 #111}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.link{background:none;border:0;color:var(--muted);font:inherit;padding:0;cursor:pointer}.field{width:100%;background:#080808;border:1px solid #3f3f46;border-radius:12px;color:#fff;font:inherit;padding:13px;margin-top:7px}.field:focus{outline:2px solid var(--amber);border-color:var(--amber)}label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:16px}.muted{color:var(--muted)}.eyebrow{color:var(--amber);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.bar{height:9px;background:#292524;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--amber);border-radius:999px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);border-top:1px solid var(--line);display:flex;justify-content:center;backdrop-filter:blur(8px)}.nav-in{display:flex;width:min(460px,100%)}.nav button{flex:1;padding:15px 4px;border:0;background:none;color:#777;font:inherit;font-size:12px;cursor:pointer}.nav button.active{color:var(--amber)}.choice{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;color:#fff;font:inherit;cursor:pointer;margin-top:10px}.choice.selected{border-color:var(--amber);background:#241b0a}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.safe{background:#083324;color:#86efac}.tight{background:#3a2507;color:#fcd34d}.danger{background:#3c1018;color:#fda4af}.lesson-row{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.lesson-row:last-child{border-bottom:0}.circle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#282828;flex:none}.circle.done{background:var(--amber);color:#111}.action{border-left:4px solid var(--green)}.hide{display:none!important}
  </style>
</head>
<body><main id="app"></main>
<script>
(()=>{'use strict';
const KEY='unidojo-runway-v1', $=s=>document.querySelector(s), today=()=>new Date().toISOString().slice(0,10), money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessons=[
 {t:'Know your runway',k:'Your balance is not your budget.',b:'Runway is how many days your available money needs to last. It turns a vague worry into a number you can use today.',a:'Open Unidojo before your next purchase and check your safe daily amount.',q:'What does runway tell you?',o:['Your credit score','How long your money needs to last','Your total income'],x:1},
 {t:'Find your safe daily amount',k:'A tiny number can make choices easier.',b:'After taking out bills due before payday, divide what is left by the days remaining. This is a guide, not a punishment.',a:'Try to keep today’s flexible spending at or below your safe daily amount.',q:'Which cost should be removed before you divide?',o:['A bill due before payday','Your phone wallpaper','Last month’s rent'],x:0},
 {t:'Pause the leak',k:'The fastest win is usually a small repeat spend.',b:'Food on campus, ride shares and forgotten subscriptions often feel harmless because each purchase is small. Pick one category to notice this week.',a:'Before one purchase today, ask: “Is this worth my safe daily amount?”',q:'What makes a small spend worth checking?',o:['It can repeat unnoticed','It is always bad','It changes your bank'],x:0},
 {t:'Use the 24-hour rule',k:'Delay is a decision tool, not deprivation.',b:'For non-essential purchases over your chosen amount, wait one day. If you still want it and it fits your runway, buy it without guilt.',a:'Set your personal pause amount now: £20, £30 or £50.',q:'The 24-hour rule is best for…',o:['Every essential bill','Non-essential purchases','Checking your balance'],x:1},
 {t:'Build a £50 buffer',k:'A small cushion buys calm.',b:'Your first buffer is not an investment account. It is £50 that stops a surprise cost becoming an overdraft problem.',a:'Move £2–£5 aside this week, or name one spend you can skip to start it.',q:'The first purpose of a buffer is to…',o:['Handle a small surprise','Double your money','Avoid looking at money'],x:0},
 {t:'Make social spending intentional',k:'You do not have to opt out to stay in control.',b:'Choose a weekly social amount before plans happen. Suggest a lower-cost option early instead of saying no at the last minute.',a:'Send one message that suggests a budget-friendly plan this week.',q:'When is the best time to set a social budget?',o:['After money has gone','Before plans happen','Never'],x:1},
 {t:'Your weekly reset',k:'No judgement—just a new starting point.',b:'Once a week, update your balance, payday and upcoming costs. A five-minute reset prevents a small drift becoming a panic.',a:'Pick a regular reset day and add it to your calendar.',q:'A weekly reset should help you…',o:['See what changed and adjust','Feel guilty','Forget your plan'],x:0}
];
let S={view:'welcome',profile:null,tab:'home',spentToday:0,lastCheck:null,checkins:[],completed:[],xp:0,streak:0,lastAction:null,lesson:null,answer:null,notice:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function daysUntil(date){const a=new Date(today()+'T00:00:00'),b=new Date(date+'T00:00:00');return Math.max(1,Math.ceil((b-a)/86400000))}function model(){const p=S.profile||{},days=daysUntil(p.payday),available=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0)),safe=available/days,level=safe>=12?'safe':safe>=5?'tight':'danger';return{days,available,safe,level}}function belt(){return S.xp>=280?'Black belt':S.xp>=160?'Blue belt':S.xp>=80?'Green belt':S.xp>=30?'Yellow belt':'White belt'}function nav(){return '<nav class="nav"><div class="nav-in">'+[['home','⌂','Today'],['learn','🥋','Train'],['profile','◎','Dojo']].map(x=>'<button data-nav="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b><span class="block mt-1">'+x[2]+'</span></button>').join('')+'</div></nav>'}
function layout(x){return '<div class="page">'+x+'</div>'}
function welcome(){return layout('<div class="min-h-[78vh] flex flex-col justify-center"><div class="eyebrow">Money training for students</div><h1 class="text-5xl font-black leading-none mt-3">Know what you can spend.<br><span class="text-amber-400">Today.</span></h1><p class="muted text-lg leading-relaxed mt-6">Unidojo turns your balance and payday into one clear daily number—then gives you a practical next move.</p><div class="card mt-8"><div class="text-2xl">🥋</div><b class="block mt-2">No bank link. No judgement.</b><span class="muted text-sm block mt-1">Private, local and ready in under a minute.</span></div></div><button class="btn" data-a="setup">Find my safe daily amount</button><p class="text-center muted text-xs mt-5">For planning, not financial advice.</p>')}
function setup(){return layout('<button class="link" data-a="back">← Back</button><div class="eyebrow mt-8">Step 1 of 2</div><h1 class="text-3xl font-black mt-2">What are you working with?</h1><p class="muted mt-2">Use the money you can actually spend before your next payday.</p><label>Current balance<input id="balance" class="field" inputmode="decimal" type="number" min="0" placeholder="e.g. 184.50" value="'+esc(S.profile?.balance||'')+'"></label><label>Next income or payday<input id="payday" class="field" type="date" min="'+today()+'" value="'+esc(S.profile?.payday||'')+'"></label><button class="btn mt-8" data-a="nextsetup">Continue</button>')}
function costs(){return layout('<button class="link" data-a="setup">← Back</button><div class="eyebrow mt-8">Step 2 of 2</div><h1 class="text-3xl font-black mt-2">Protect what is already spoken for.</h1><p class="muted mt-2">Only include bills or essential costs due before payday.</p><label>Upcoming essentials<input id="bills" class="field" inputmode="decimal" type="number" min="0" placeholder="e.g. 45" value="'+esc(S.profile?.bills||'')+'"></label><label>Optional: keep aside as a buffer<input id="buffer" class="field" inputmode="decimal" type="number" min="0" placeholder="e.g. 10" value="'+esc(S.profile?.buffer||'')+'"></label><button class="btn mt-8" data-a="reveal">Show my plan</button><p class="muted text-xs text-center mt-4">You can update these anytime.</p>')}
function action(m){if(m.level==='danger')return ['Protect the next 24 hours','Pause non-essential spending today. Check whether one upcoming cost can be moved, split or reduced.'];if(m.level==='tight')return ['Make one planned choice','Before buying anything flexible today, compare it with your '+money(m.safe)+' guide. Choose one lower-cost alternative.'];return ['Give your money a job','Your runway is in a good place. Put aside a small amount, or plan one guilt-free spend within your guide.']}
function result(){const m=model(),a=action(m);return layout('<div class="eyebrow">Your starting point</div><h1 class="text-3xl font-black mt-2">Here is your money plan.</h1><div class="card mt-6 text-center"><span class="pill '+m.level+'">'+(m.level==='safe'?'Room to breathe':m.level==='tight'?'Keep it steady':'Protect your runway')+'</span><div class="text-6xl font-black text-amber-400 mt-5">'+money(m.safe)+'</div><b class="block mt-1">safe to spend per day</b><p class="muted text-sm mt-3">'+money(m.available)+' available across '+m.days+' day'+(m.days===1?'':'s')+' until payday.</p></div><div class="card action mt-5"><div class="eyebrow" style="color:#34d399">Your first move</div><b class="block mt-2">'+a[0]+'</b><p class="muted text-sm leading-relaxed mt-2">'+a[1]+'</p></div><button class="btn mt-7" data-a="startdojo">Start my first check-in</button>')}
function home(){const m=model(),a=action(m),done=S.lastCheck===today(),over=Math.max(0,S.spentToday-m.safe);return layout('<div class="flex justify-between items-center"><div><div class="eyebrow">Today’s dojo</div><h1 class="text-2xl font-black mt-1">'+(done?'You checked in. Nice work.':'Your money, one day at a time.')+'</h1></div><span class="text-2xl">🥋</span></div><div class="card mt-6"><div class="flex justify-between items-start"><div><span class="pill '+m.level+'">'+m.days+' days to payday</span><div class="text-4xl font-black text-amber-400 mt-4">'+money(m.safe)+'</div><span class="muted text-sm">your safe daily guide</span></div><button class="link text-sm" data-a="edit">Edit</button></div><div class="bar mt-5"><i style="width:'+Math.min(100,(S.spentToday/(m.safe||1))*100)+'%"></i></div><div class="flex justify-between muted text-xs mt-2"><span>Today: '+money(S.spentToday)+'</span><span>'+(over?money(over)+' over guide':'Within your guide')+'</span></div></div><div class="card action mt-4"><div class="eyebrow" style="color:#34d399">Today’s move</div><b class="block mt-2">'+a[0]+'</b><p class="muted text-sm mt-2">'+a[1]+'</p></div>'+(done?'<div class="card mt-4"><b>✓ Check-in complete</b><p class="muted text-sm mt-1">Come back tomorrow. Your streak is '+S.streak+' day'+(S.streak===1?'':'s')+'.</p></div>':'<button class="btn mt-5" data-a="checkin">Do my 30-second check-in</button>')+nav())}
function checkin(){const m=model();return layout('<button class="link" data-a="home">← Back</button><div class="eyebrow mt-8">Daily check-in</div><h1 class="text-3xl font-black mt-2">What have you spent today?</h1><p class="muted mt-2">Flexible spending only—food out, travel, shopping or social plans. No judgement.</p><label>Today’s flexible spending<input id="spent" class="field" inputmode="decimal" type="number" min="0" placeholder="0.00" value="'+esc(S.spentToday||'')+'"></label><div class="card mt-6"><b>Your guide today: '+money(m.safe)+'</b><p class="muted text-sm mt-1">You are building awareness, not trying to be perfect.</p></div><button class="btn mt-7" data-a="savecheck">Finish check-in (+10 XP)</button>')}
function learn(){const complete=S.completed.length;return layout('<div class="eyebrow">Seven-day runway training</div><h1 class="text-3xl font-black mt-2">Train the habit.</h1><p class="muted mt-2">Short lessons that make your next money choice easier.</p><div class="mt-5"><div class="flex justify-between text-sm mb-2"><span>'+complete+' of 7 complete</span><span class="text-amber-400 font-bold">'+S.xp+' XP</span></div><div class="bar"><i style="width:'+(complete/7*100)+'%"></i></div></div><div class="card mt-6">'+lessons.map((l,i)=>'<button class="lesson-row w-full text-left bg-transparent text-white border-0" data-a="lesson" data-i="'+i+'"><span class="circle '+(S.completed.includes(i)?'done':'')+'">'+(S.completed.includes(i)?'✓':i+1)+'</span><span class="flex-1"><b class="block">'+l.t+'</b><small class="muted">'+l.k+'</small></span><span class="muted">›</span></button>').join('')+'</div>'+nav())}
function lesson(){const l=lessons[S.lesson],answered=S.answer!==null&&S.answer!==undefined;return layout('<button class="link" data-a="learn">← Training</button><div class="eyebrow mt-8">Lesson '+(S.lesson+1)+' of 7</div><h1 class="text-3xl font-black mt-2">'+l.t+'</h1><div class="card mt-6"><b class="text-xl">'+l.k+'</b><p class="muted leading-relaxed mt-4">'+l.b+'</p></div><div class="card action mt-4"><div class="eyebrow" style="color:#34d399">Try this</div><p class="mt-2">'+l.a+'</p></div><h2 class="font-black mt-7">Quick check</h2><p class="muted text-sm mt-1">'+l.q+'</p>'+l.o.map((o,i)=>'<button class="choice '+(S.answer===i?'selected':'')+'" data-a="answer" data-i="'+i+'">'+(i+1)+'. '+o+(answered&&i===l.x?' <b class="ml-auto text-emerald-300">✓</b>':'')+'</button>').join('')+(answered?'<div class="card mt-4 '+(S.answer===l.x?'action':'')+'"><b>'+(S.answer===l.x?'Exactly.':'Not quite—have another look at the lesson.')+'</b><p class="muted text-sm mt-1">'+(S.answer===l.x?'Small, clear choices add up.':'The correct answer is highlighted above.')+'</p></div><button class="btn mt-5" data-a="finishlesson">'+(S.completed.includes(S.lesson)?'Back to training':'Complete lesson (+15 XP)')+'</button>':'') )}
function profile(){const m=model();return layout('<div class="eyebrow">Your dojo</div><h1 class="text-3xl font-black mt-2">Keep showing up.</h1><div class="card mt-6 text-center"><div class="text-5xl">🥋</div><b class="text-xl block mt-2">'+belt()+'</b><p class="text-amber-400 font-black text-2xl mt-2">'+S.xp+' XP</p><div class="grid grid-cols-3 gap-2 mt-5 text-sm"><div><b class="block text-lg">'+S.streak+'</b><span class="muted">day streak</span></div><div><b class="block text-lg">'+S.completed.length+'</b><span class="muted">lessons</span></div><div><b class="block text-lg">'+m.days+'</b><span class="muted">days left</span></div></div></div><button class="choice mt-5" data-a="edit"><span>✏️</span><span><b class="block">Update my plan</b><small class="muted">Balance, payday and essential costs</small></span><span class="ml-auto muted">›</span></button><button class="choice" data-a="reset"><span>↺</span><span><b class="block">Start over</b><small class="muted">Clears Unidojo from this browser</small></span></button>'+nav())}
function render(){let v=S.view;if(!S.profile)v='welcome';let html=v==='welcome'?welcome():v==='setup'?setup():v==='costs'?costs():v==='result'?result():v==='checkin'?checkin():v==='lesson'?lesson():S.tab==='learn'?learn():S.tab==='profile'?profile():home();$('#app').innerHTML=html}
function markAction(){if(S.lastAction!==today()){S.xp+=5;S.lastAction=today()}}function act(a,e){if(a==='setup'){S.view='setup'}else if(a==='back'){S.view='welcome'}else if(a==='nextsetup'){const balance=+$('#balance').value,payday=$('#payday').value;if(!(balance>=0)||!payday){alert('Add your current balance and next payday to continue.');return}S.profile={...(S.profile||{}),balance,payday};S.view='costs'}else if(a==='reveal'){S.profile={...(S.profile||{}),bills:+$('#bills').value||0,buffer:+$('#buffer').value||0};S.view='result'}else if(a==='startdojo'){S.view='home';S.tab='home'}else if(a==='home'){S.view='home';S.tab='home'}else if(a==='edit'){S.view='setup'}else if(a==='checkin'){S.view='checkin'}else if(a==='savecheck'){const spend=+$('#spent').value;if(spend<0){alert('Use a positive amount.');return}S.spentToday=spend;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.lastCheck===y?S.streak+1:1;S.lastCheck=today();S.checkins.push({date:today(),spend});S.xp+=10;markAction();S.view='home'}else if(a==='lesson'){S.lesson=+e.dataset.i;S.answer=null;S.view='lesson'}else if(a==='answer'){S.answer=+e.dataset.i}else if(a==='finishlesson'){if(!S.completed.includes(S.lesson)){S.completed.push(S.lesson);S.xp+=15;markAction()}S.tab='learn';S.view='home';S.answer=null}else if(a==='reset'){if(confirm('Clear your Unidojo plan and progress from this browser?')){localStorage.removeItem(KEY);location.reload()}return}else if(e.dataset.nav){S.tab=e.dataset.nav;S.view='home'}save();render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-nav]');if(t)act(t.dataset.a||'',t)});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
})();
</script></body></html>
