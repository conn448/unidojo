<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Short daily money lessons for UK university students.">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥋%3C/text%3E%3C/svg%3E">
<title>Unidojo</title><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0A0A0A;--card:#141414;--line:#1F1F1F;--muted:#9CA3AF;--dim:#555;--amber:#F59E0B;--shadow:#B45309;--green:#10B981;--red:#FF4B4B}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,system-ui,sans-serif;overflow-y:auto;-webkit-overflow-scrolling:touch}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}button{font:inherit;cursor:pointer;border:0;color:inherit}input{font:inherit}.btn{width:100%;padding:16px 24px;border-radius:16px;background:var(--amber);color:#0A0A0A;font-weight:700;box-shadow:0 4px 0 var(--shadow)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}.btn:disabled{opacity:.4;box-shadow:none}.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--amber);border-radius:99px;transition:width .4s}.node{width:76px;height:76px;border-radius:50%;font-size:27px;font-weight:900;background:var(--line);color:var(--dim);box-shadow:0 6px 0 #000;position:relative}.node.current,.node.done{background:var(--amber);color:#0A0A0A}.node:active{transform:translateY(4px);box-shadow:0 2px 0 #000}.ring{position:absolute;inset:-7px;border:3px solid #F59E0B66;border-radius:50%;animation:ring 2s infinite}.ring:after{content:'';position:absolute;inset:-10px;border:2px solid #F59E0B33;border-radius:50%}@keyframes ring{50%{opacity:.35}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes bounce{0%{transform:scale(0)}55%{transform:scale(1.15)}to{transform:scale(1)}}.up{animation:up .3s}.bounce{animation:bounce .5s}@keyframes conf{to{transform:translateY(110vh) rotate(720deg);opacity:0}}.conf{position:fixed;top:-20px;width:10px;height:10px;animation:conf 2.2s ease-in forwards;z-index:20}
</style></head><body><main id="app"></main>
<script>
(function(){'use strict';
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})},pad=function(n){return n<10?'0'+n:n},today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var KEY='';function initStorage(){var uid;try{uid=localStorage.getItem('ud_id');if(!uid){uid='d_'+Math.random().toString(36).slice(2);localStorage.setItem('ud_id',uid)}}catch(e){uid='memory'}KEY='ud_'+uid}
var BELTS=[['White','⚪',0],['Yellow','🟡',150],['Orange','🟠',400],['Green','🟢',800],['Blue','🔵',1400],['Purple','🟣',2200],['Black','⚫',3200],['Sensei','🥋',5000]];
var units=[['Know Your Number','What you actually have','🎯','#F59E0B'],['See Your Spending','Where it leaks','🔬','#3B82F6'],['Cap Your Leak','One rule that works','🛑','#EF4444'],['Build the Buffer','Your £50 shield','🛡️','#10B981'],['Daily Game','Habits that compound','⚡','#8B5CF6'],['Money & People','Flatmates, friends','👥','#EC4899']];
var topics=[['Balance vs runway','Your balance lies','Runway is…',['How much you have','How many days until £0','Your overdraft','Your income'],1],['Your daily burn','The number nobody calculates','Spend £450/month excluding rent.',['£4.50/day','£15/day','£45/day','£150/day'],1],['The £500 gap','The unexplained £500','Average transactions per month?',['Under 20','About 50','About 140','Over 300'],2],['Unit test','Three zones','Runway 45 days. Zone?',['Danger','Tight','Safe'],2]];
var drills=[['D1','Ask before you buy','Say “can I afford this?” out loud before any purchase today.'],['D2','The 24-hour rule','Want something over £30? Wait 24 hours.'],['D3','Receipt check','Look at one transaction from yesterday. Was it worth it?'],['D4','The £5 test','Spend nothing today. Just one day.'],['D5','Subscription purge','Cancel one subscription you forgot about.'],['D6','Sunday audit','Check your balance. No judgment.'],['D7','Goal check','Look at your goal. Ahead or behind? Write it down.']];
var DEMO={risk:62,resp:41,type:'FINANCIALLY CAPRICIOUS',leak:'Eating out & social. £187 last month.',fix:'Cap eating out at £40/month → Responsibility: 41 → 67',runway:31};
var S={screen:'hero',tab:'path',worries:[],dna:null,manual:false,lesson:null,stats:{c:0,t:0},q:1,checkin:{},modal:null,dojo:{xp:0,streak:0,lastLesson:null,lastCheckIn:null,completed:[],drilled:[],lastDrill:null},checkIns:[]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function load(){try{var x=localStorage.getItem(KEY);if(x)Object.assign(S,JSON.parse(x))}catch(e){}}
function belt(){var b=BELTS[0];BELTS.forEach(function(x){if(S.dojo.xp>=x[2])b=x});return b}function next(){var i=BELTS.indexOf(belt());return BELTS[i+1]||null}function bar(n){return'<div class="bar"><div class="fill" style="width:'+Math.max(0,Math.min(100,n))+'%"></div></div>'}function confetti(){for(var i=0;i<35;i++)setTimeout(function(){var x=document.createElement('i');x.className='conf';x.style.left=Math.random()*100+'%';x.style.background=['#F59E0B','#10B981','#3B82F6','#8B5CF6','#EC4899'][Math.random()*5|0];document.body.appendChild(x);setTimeout(function(){x.remove()},2300)},i*20)}
function shell(x){return'<div class="max-w-md mx-auto px-6 pt-10 pb-32">'+x+'</div>'}function title(label,h,p){return'<div class="text-xs uppercase tracking-widest font-bold text-[#555] mb-3">'+label+'</div><h1 class="text-3xl font-black mb-2">'+h+'</h1><p class="text-[#9CA3AF] mb-8 text-sm">'+p+'</p>'}
function hero(){return'<div class="max-w-md mx-auto px-6 pt-16 pb-16 min-h-screen flex flex-col"><div class="flex-1 flex flex-col justify-center"><b class="text-2xl mb-2">unidojo</b><p class="text-[#9CA3AF] text-sm mb-14">Train your money. Earn your belt.</p><h1 class="text-[40px] leading-tight font-black mb-4">Understand money.<br><span class="text-[#F59E0B]">Actually.</span></h1><p class="text-[#9CA3AF] leading-relaxed mb-10">Short daily lessons for UK uni students. Real scenarios. Real habits. Free.</p><div class="space-y-4 text-sm text-[#9CA3AF]"><div>⚡ &nbsp;2-minute lessons</div><div>🎯 &nbsp;Built on your real spending</div><div>🛡️ &nbsp;No bank login. Ever.</div></div></div><button data-a="start" class="btn">Get started</button><p class="text-center text-[#555] text-xs mt-4">No signup needed.</p></div>'}
function worries(){var a=[['💸','I never have money for fun'],['🍕','I spend too much on food'],['🕵️','I do not know where it goes'],['🏦','I cannot save anything'],['😰','Money stresses me out'],['🛍️','I impulse buy']];return shell(title('Step 1 of 3','What is bugging you?','Pick what is true. We tailor your path.')+'<div class="space-y-3">'+a.map(function(x,i){var on=S.worries.indexOf(i)>-1;return'<button data-a="worry" data-i="'+i+'" class="card w-full text-left flex items-center gap-4" style="border:2px solid '+(on?'#F59E0B':'#1F1F1F')+';background:'+(on?'#1F1608':'#141414')+'">'+x[0]+'<span class="flex-1 text-sm font-semibold">'+x[1]+'</span>'+(on?'✓':'')+'</button>'}).join('')+'</div><div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0A0A0A] to-transparent"><div class="max-w-md mx-auto"><button data-a="continue" class="btn" '+(!S.worries.length?'disabled':'')+'>Continue'+(S.worries.length?' ('+S.worries.length+')':'')+'</button></div></div>')}
function data(){if(S.manual)return manual();return shell(title('Step 2 of 3','Your money, fast','Three ways in. Pick what works.')+'<div class="space-y-3"><button data-a="manual" class="card w-full text-left flex items-center gap-4">✏️ <span class="flex-1"><b>Type it in</b><small class="block text-[#9CA3AF]">60 seconds</small></span>→</button><button data-a="demo" class="card w-full text-left flex items-center gap-4" style="border-color:#F59E0B">🎮 <span class="flex-1"><b>Try demo</b><small class="block text-[#9CA3AF]">Skip setup</small></span>→</button></div>')}
function manual(){var f=function(id,l,h){return'<label class="block text-xs font-bold text-[#9CA3AF]">'+l+'<input id="in-'+id+'" type="number" inputmode="decimal" placeholder="£" class="w-full mt-2 px-4 py-3 rounded-xl bg-black border border-[#262626] text-white">'+(h?'<small class="text-[#555]">'+h+'</small>':'')+'</label>'};return shell('<button data-a="back" class="text-[#9CA3AF] mb-6">← Back</button><h1 class="text-2xl font-black mb-6">Your money</h1><div class="space-y-4">'+f('income','Monthly income','Loan, job, parents')+f('rent','Monthly rent','Or your share')+'<div class="text-xs uppercase tracking-widest text-[#555] font-bold">Monthly spending</div>'+f('food','Food & groceries')+f('social','Eating out & social')+f('transport','Transport')+f('shopping','Shopping & impulse')+f('other','Other')+'</div><button data-a="reveal" class="btn mt-8">Reveal my DNA</button>')}
function dna(){var d=S.dna||DEMO;return shell(title('Your Financial DNA','', '')+'<div class="grid grid-cols-2 gap-4 mb-8"><div class="card"><strong class="text-5xl text-[#F59E0B]">'+d.risk+'</strong><small class="block text-[#9CA3AF]">RISK</small></div><div class="card"><strong class="text-5xl text-[#F59E0B]">'+d.resp+'</strong><small class="block text-[#9CA3AF]">RESPONSIBILITY</small></div></div><h2 class="text-3xl text-center font-black mb-2">'+esc(d.type)+'</h2><p class="text-center text-[#9CA3AF] mb-8">Your habits are visible. That means they can change.</p><div class="card mb-4"><small class="text-[#9CA3AF]">YOUR BIGGEST LEAK</small><div class="text-[#F59E0B] font-bold mt-2">'+esc(d.leak)+'</div></div><div class="card"><small class="text-[#9CA3AF]">THE FIX</small><div class="text-[#10B981] font-bold mt-2">'+esc(d.fix)+'</div></div><div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0A0A0A] to-transparent"><div class="max-w-md mx-auto"><button data-a="enter" class="btn">Start training →</button></div></div>')}
function path(){var b=belt(),n=next(),done=S.dojo.completed,total=24,prog=n?(S.dojo.xp-b[2])/(n[2]-b[2])*100:100,h='<div class="sticky top-0 z-10 bg-[#0A0A0A]/95 px-4 pt-4 pb-3"><div class="max-w-md mx-auto flex justify-between font-black">'+b[1]+' '+b[0]+'<span>'+S.dojo.xp+' XP　🔥 '+S.dojo.streak+'</span></div>'+bar(prog)+'<small class="text-[#9CA3AF]">'+(n?(n[2]-S.dojo.xp)+' XP to '+n[0]:'Max belt')+'</small></div><div class="max-w-md mx-auto px-4 pt-4 pb-32"><div class="card mb-5 border-l-4 border-l-[#F59E0B]"><small class="text-[#F59E0B] font-bold">🥋 SENSEI</small><p class="text-sm text-[#9CA3AF] mt-2">'+(done.length?'One lesson today. Momentum is real.':'Welcome. Complete your first lesson. That is it.')+'</p></div><small class="text-[#555] font-bold">'+done.length+' of '+total+' lessons complete</small>';units.forEach(function(u,ui){h+='<section class="mt-5"><div class="rounded-2xl p-4 flex gap-3" style="background:'+u[3]+'22;border:2px solid '+u[3]+'55"><span class="text-2xl">'+u[2]+'</span><div class="flex-1"><b>'+u[0]+'</b><small class="block" style="color:'+u[3]+'">'+u[1]+'</small></div><small>'+Math.min(4,done.filter(function(x){return x.indexOf('l'+(ui+1)+'.')===0}).length)+'/4</small></div><div class="py-5 space-y-6">';for(var j=0;j<4;j++){var id='l'+(ui+1)+'.'+(j+1),isDone=done.indexOf(id)>-1,open=!isDone&&(ui===0&&j===0||j>0&&done.indexOf('l'+(ui+1)+'.'+j)>-1||ui>0&&j===0&&done.indexOf('l'+ui+'.4')>-1);h+='<div class="flex justify-center"><button data-a="lesson" data-id="'+id+'" class="node '+(isDone?'done':open?'current':'')+'">'+(isDone?'★':open?'▶':'🔒')+(open?'<i class="ring"></i>':'')+'</button></div>'+(open?'<div class="text-center text-sm font-bold">Current<br><span class="text-[#9CA3AF]">'+topics[j][0]+'</span></div>':'')}h+='</div></section>'});return h+'</div>'+tabs()}
function tabs(){return'<nav class="fixed bottom-0 left-0 right-0 z-10 bg-[#0A0A0A]/95 border-t border-[#1F1F1F] flex max-w-md mx-auto"><button data-a="tab" data-tab="path" class="flex-1 py-4 text-amber-400">📍<small class="block">Path</small></button><button data-a="tab" data-tab="practice" class="flex-1 py-4 text-[#555]">⚔️<small class="block">Practice</small></button><button data-a="tab" data-tab="profile" class="flex-1 py-4 text-[#555]">🥋<small class="block">Dojo</small></button></nav>'}
function lesson(){var l=S.lesson,t=topics[l.i%4],answered=l.answered;return shell('<div class="flex gap-3 items-center mb-6"><button data-a="quit">✕</button><div class="flex-1">'+bar(l.ti/3*100)+'</div><small>'+(l.ti+1)+'/3</small></div><div class="text-xs uppercase text-[#F59E0B] font-bold mb-3">'+(l.ti===0?'Concept':'Quiz')+'</div><div class="card mb-6"><h2 class="text-2xl font-black mb-4">'+(l.ti===0?t[1]:t[2])+'</h2><p class="text-[#9CA3AF]">'+(l.ti===0?'Small actions make the number visible. Start with one honest look.':'Choose the answer that protects your future self.')+'</p></div>'+(l.ti?'<div class="space-y-3">'+t[3].map(function(x,i){return'<button data-a="answer" data-i="'+i+'" class="card w-full text-left '+(l.sel===i?'border-[#F59E0B] bg-[#1F1608]':'')+'">'+(i+1)+'. '+x+(answered&&i===t[4]?' ✓':'')+'</button>'}).join('')+'</div>':'')+(answered?'<div class="card mt-5 border-l-4 border-l-[#10B981] text-[#9CA3AF]">Good choice. Small decisions compound.</div>':'')+'<div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0A0A0A] to-transparent"><div class="max-w-md mx-auto"><button data-a="'+(l.ti===0?'next':answered?'next':'check')+'" class="btn">'+(l.ti===0?'Got it':answered?'Continue':'Check')+'</button></div></div>')}
function practice(){var d=drills[new Date().getDate()%drills.length],done=S.dojo.lastDrill===today();return shell(title('','Practice','Real-world reps. Do them today.')+'<small class="text-[#555] font-bold">TODAY’S DRILL</small><div class="card my-3"><b>'+d[1]+'</b><p class="text-[#9CA3AF] text-sm">'+d[2]+'</p>'+(done?'✓ Done':'<button data-a="drill" class="btn">Mark complete (+20 XP)</button>')+'</div><small class="text-[#555] font-bold">WEEKLY CHECK-IN</small><button data-a="checkin" class="card w-full text-left mt-3">Weekly Check-In<small class="block text-[#9CA3AF]">3 questions. 30 seconds.</small></button>')+tabs()}
function profile(){var b=belt();return shell(title('','Your Dojo','')+'<div class="card text-center mb-5"><div class="text-6xl">'+b[1]+'</div><h2 class="text-xl font-black">'+b[0]+' Belt</h2><p class="text-[#9CA3AF]">'+S.dojo.xp+' XP</p><div class="grid grid-cols-3"><b>'+S.dojo.streak+'</b><b>'+S.dojo.completed.length+'</b><b>'+S.dojo.drilled.length+'</b></div></div><div class="card mb-5"><b>'+esc((S.dna||DEMO).type)+'</b><p class="text-[#F59E0B]">'+esc((S.dna||DEMO).leak)+'</p><p class="text-[#10B981]">'+esc((S.dna||DEMO).fix)+'</p></div><button data-a="share" class="card w-full text-left mb-5">Share my DNA</button><button data-a="reset" class="text-[#555] text-xs w-full">Reset</button>')+tabs()}
function render(){var x=S.screen==='hero'?hero():S.screen==='worries'?worries():S.screen==='data'?data():S.screen==='dna'?dna():S.screen==='path'?path():S.screen==='lesson'?lesson():S.screen==='practice'?practice():S.screen==='profile'?profile():hero();document.getElementById('app').innerHTML=x}
function calc(p){var income=Math.max(1,Number(p.income)||0),sp=p.spend,total=0;Object.keys(sp).forEach(function(k){total+=Number(sp[k])||0});var runway=Math.max(0,(income-(Number(p.rent)||0)-total)/(total/30||1)),social=Number(sp.social)||0,shopping=Number(sp.shopping)||0,resp=Math.max(0,Math.min(100,Math.round(100-(social+shopping)/income*150))),risk=Math.max(0,Math.min(100,Math.round(100-Math.min(runway,60)*1.5)));return{risk:risk,resp:resp,type:resp>50&&risk<50?'THE PLANNER':resp>50?'THE SURVIVOR':risk<50?'THE PASSENGER':'THE GAMBLER',leak:'Your biggest spending category needs a cap.',fix:'Choose one category and cap it this month.',runway:Math.round(runway)}}
function act(a,e){var before=S.screen;if(a==='start')S.screen='worries';else if(a==='worry'){var i=+e.dataset.i,p=S.worries.indexOf(i);p<0?S.worries.push(i):S.worries.splice(p,1)}else if(a==='continue')S.screen='data';else if(a==='manual')S.manual=true;else if(a==='back')S.manual=false;else if(a==='demo'){S.dna=DEMO;S.screen='dna'}else if(a==='reveal'){var g=function(id){return Number((document.getElementById('in-'+id)||{}).value)||0},p={income:g('income'),rent:g('rent'),spend:{food:g('food'),social:g('social'),transport:g('transport'),shopping:g('shopping'),other:g('other')}};if(p.income<=0||Object.keys(p.spend).every(function(k){return p.spend[k]<=0})){alert('Enter income and spending.');return}S.dna=calc(p);S.screen='dna'}else if(a==='enter'){S.screen='path';S.tab='path'}else if(a==='tab'){S.screen=e.dataset.tab;S.tab=e.dataset.tab}else if(a==='lesson'){S.lesson={id:e.dataset.id,i:+e.dataset.id.split('.')[1]-1,ti:0,sel:null,answered:false};S.stats={c:0,t:0};S.screen='lesson'}else if(a==='answer'&&!S.lesson.answered)S.lesson.sel=+e.dataset.i;else if(a==='check'){S.lesson.answered=true;S.stats.t++;if(S.lesson.sel===topics[S.lesson.i][4])S.stats.c++}else if(a==='next'){S.lesson.ti++;S.lesson.sel=null;S.lesson.answered=false;if(S.lesson.ti>=3){if(S.dojo.completed.indexOf(S.lesson.id)<0)S.dojo.completed.push(S.lesson.id);S.dojo.xp+=Math.max(10,S.stats.c*10);S.dojo.streak++;S.screen='path';confetti()} }else if(a==='quit'){S.screen='path'}else if(a==='practice'){S.screen='practice'}else if(a==='drill'){S.dojo.lastDrill=today();S.dojo.xp+=20;S.dojo.drilled.push('D'+(new Date().getDate()%7+1))}else if(a==='profile'){S.screen='profile'}else if(a==='share')alert('Your Financial DNA: '+(S.dna||DEMO).type);else if(a==='reset'&&confirm('Reset?')){try{localStorage.removeItem(KEY)}catch(x){}location.reload()}save();render();if(S.screen!==before)history.pushState({screen:S.screen},'',location.href)}
function boot(){initStorage();document.getElementById('app').addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t)});var fresh=new URLSearchParams(location.search).has('start');load();if(fresh){S.worries=[];S.dna=null;S.manual=false;S.screen='hero';history.replaceState({screen:S.screen},'',location.pathname)}else{S.screen='hero';S.manual=false;history.replaceState({screen:S.screen},'',location.href)}window.addEventListener('popstate',function(e){if(e.state&&e.state.screen){S.screen=e.state.screen;S.manual=false;save();render()}});render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script></body></html>
