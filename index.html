<style>
:root{--bg:#080808;--p:#141414;--p2:#1b1b1b;--line:#303030;--txt:#fff;--muted:#999;--a:#ff9800;--g:#35d399;--r:#ff5d73;--b:#6ea8fe}*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 50% -10%,#281705,#0b0b0b 38%,#080808 72%);color:var(--txt);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{min-height:48px;border:1px solid #393939;border-radius:14px;padding:12px 15px;background:var(--p2);color:#fff;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.99)}button.primary{background:linear-gradient(135deg,#ff9800,#ffb000);border-color:#ff9800;color:#111;font-weight:900}.muted{color:var(--muted)}main{max-width:700px;margin:auto;padding:14px 13px calc(94px + env(safe-area-inset-bottom))}.brand{font-weight:950;font-size:25px;letter-spacing:-1px;margin:3px 3px 17px}.brand span{color:var(--a)}h1{font-size:34px;line-height:1.04;letter-spacing:-1.3px;margin:7px 0 13px}h2{font-size:25px;line-height:1.1;margin:5px 0 12px}h3{margin:7px 0}.card,.mission,.game,.stock,.decision{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:21px;padding:17px;margin:12px 0;overflow:hidden}.hero{padding:21px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--a)}.pill,.tag{display:inline-flex;padding:5px 9px;border-radius:99px;background:#252525;color:#bbb;font-size:11px;font-weight:900}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.input{display:block;width:100%;min-height:51px;padding:13px 14px;border:1px solid #3d3d3d;border-radius:13px;background:#090909;color:#fff;outline:none}.input:focus{border-color:var(--a)}.actions{display:flex;gap:9px;margin-top:14px}.actions>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0c0c0c;border:1px solid #292929;border-radius:15px;padding:12px;text-align:center}.big{font-size:43px;font-weight:950;letter-spacing:-2px}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:10px 0 17px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff9800,#ffb000)}.choice{display:block;width:100%;text-align:left;margin:9px 0;min-height:54px}.choice.selected{border-color:var(--a);background:#2a1d0d}.choice.correct{border-color:var(--g);background:#09271f}.choice.wrong{border-color:var(--r);background:#2b1117}.choice:disabled{cursor:default}.lesson{display:flex;gap:13px;align-items:center;width:100%;padding:12px 2px;background:transparent;border:0;text-align:left}.lesson:disabled{opacity:.35}.node{width:51px;height:51px;flex:0 0 51px;display:grid;place-items:center;border-radius:17px;background:#202020;border:1px solid #3c3c3c;font-size:21px}.tree-line{border-left:2px solid #303030;margin-left:26px;padding-left:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.price{font-size:23px;font-weight:950}.up{color:var(--g)}.down{color:var(--r)}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(9,9,9,.97);backdrop-filter:blur(15px);border-top:1px solid #292929;display:flex;gap:6px}.nav button{flex:1;min-width:0;min-height:46px;padding:8px 3px;border:0;background:transparent;font-size:12px}.nav button.active{background:#1d1d1d;color:var(--a)}.toast{position:fixed;z-index:99;top:14px;left:50%;transform:translateX(-50%);background:var(--a);color:#111;padding:10px 15px;border-radius:99px;font-weight:900;display:none;box-shadow:0 8px 25px #000}.toast.show{display:block}.error{color:#ff9aaa;font-size:13px}.success{color:var(--g);font-size:13px}.hide{display:none!important}.game{cursor:pointer}.game-icon{float:right;font-size:34px}.score{font-size:40px;font-weight:950}.timer{height:7px;background:#292929;border-radius:99px;overflow:hidden}.timer i{display:block;height:100%;background:var(--a);width:100%}@media(max-width:480px){main{padding:12px 11px calc(91px + env(safe-area-inset-bottom))}.card,.mission,.game,.stock,.decision{border-radius:17px;padding:15px}h1{font-size:30px}.big{font-size:37px}.actions{flex-direction:column}.actions>*{width:100%}.grid2{gap:8px}.nav button{font-size:11px}.row.mobile{align-items:flex-start;flex-direction:column}.stock .row{align-items:flex-start}.stock .price{font-size:20px}}
</style></head>
<body><div id="toast" class="toast"></div><main><div class="brand">uni<span>dojo</span></div><div id="app"></div></main>
<nav class="nav"><button id="nToday" onclick="home()">⌂<br>Today</button><button id="nMarkets" onclick="markets()">◈<br>Markets</button><button id="nTrain" onclick="train()">◎<br>Train</button><button id="nAccount" onclick="account()">●<br>Account</button></nav>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const app=document.getElementById('app'),KEY='unidojo-core-v5',today=()=>new Date().toISOString().slice(0,10),money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const LESSONS=[
['Runway maths','🏃','FOUNDATION','£420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10/day','£17.14/day','£60/day','£70/day'],1],
['Net income','🧾','INCOME','A £30,000 gross salary is offered. Which figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],
['Opportunity cost','⚔️','DECISIONS','You have £90 flexible money. Spending £45 on a night out means that £45 cannot fund another goal. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],
['Credit comparison','💳','CREDIT','Two cards advertise 19%. Card A has no mandatory fee; Card B has a compulsory £60 annual fee. What should you compare?',['Only headline rate','APR / total borrowing cost','Minimum payment only','Lender reputation'],1],
['Real returns','📈','ECONOMICS','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],
['Compounding','🌱','INVESTING','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],
['Buffer design','🧱','RESILIENCE','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],
['Behaviour design','🧠','BEHAVIOUR','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking entirely','Set an impossible target'],1],
['Concentration risk','🎯','INVESTING','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],
['Debt vs investing','💰','CREDIT','You can clear a £600 high-APR card or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],
['Weekly reset','🥋','MASTERY','Plan £120 flexible spend; actual £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],
['Rent reality','🏠','LIFE','Option A costs £725/month. B costs £775/month but saves £35/month transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],
['Subscription trap','🔁','BEHAVIOUR','Subscriptions cost £7, £6, £5, £5, £4 and £3 monthly. Cancelling £6 and £5 saves…',['£11/year','£11/month','£66/month','£132/month'],1],
['Liquidity first','🚨','RESILIENCE','You need £800 for a guaranteed university cost in three months. Strongest default principle?',['Take equity risk for upside','Keep required money accessible and low-risk','Use credit and invest the £800','Ignore the date'],1]
];
const GAMES=[['sprint','⚡','Money Sprint','Five finance decisions against the clock.','Speed + accuracy'],['duel','⚔️','Decision Duel','Fast trade-offs. Pick the stronger financial move.','Judgement'],['streak','🔥','Streak Run','Three small scenarios. Protect the combo.','Consistency']];
const STOCKS=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','V','NFLX','JPM','KO','MCD'];const N={AAPL:'Apple',MSFT:'Microsoft',NVDA:'NVIDIA',AMZN:'Amazon',GOOGL:'Alphabet',META:'Meta',TSLA:'Tesla',V:'Visa',NFLX:'Netflix',JPM:'JPMorgan',KO:'Coca-Cola',MCD:"McDonald's"};const SEED={AAPL:332.27,MSFT:510,NVDA:176,AMZN:232,GOOGL:246,META:748,TSLA:350,V:350,NFLX:1180,JPM:300,KO:70,MCD:310};
let S={profile:null,xp:0,streak:0,lastDay:null,completed:[],lesson:0,hearts:5,decisions:[],saved:0,purchase:0,cash:10000,holdings:{},live:{},game:null,gamePos:0,gameScore:0,gameCombo:0,gameItems:[],gameStarted:false};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}if(typeof S.cash!=='number'||S.cash<0)S.cash=10000;if(!S.holdings)S.holdings={};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function setNav(a){['Today','Markets','Train','Account'].forEach(k=>document.getElementById('n'+k).classList.toggle('active',a===k.toLowerCase()))}function navReady(){return !!S.profile?.onboardingComplete}function belt(){return S.xp>=800?'BLACK':S.xp>=450?'RED':S.xp>=220?'BLUE':S.xp>=80?'GREEN':'WHITE'}function addXP(n){S.xp+=n;save();toast('+'+n+' XP')}function completedCount(){return S.completed.length}
function onboarding(step=1){S.onStep=step;setNav('');let p=S.profile||{},c='';if(step===1)c=`<div class="card hero"><span class="pill">SET UP · 1/4</span><h1>Build your money profile.</h1><p class="muted">A quick starting point so Unidojo can teach from your reality.</p><div class="field"><label>First name</label><input class="input" id="obName" autocomplete="given-name" value="${esc(p.name||'')}" placeholder="e.g. Conn"></div><div class="field"><label>Age</label><input class="input" id="obAge" type="number" inputmode="numeric" min="13" max="100" value="${esc(p.age||'')}" placeholder="18"></div></div>`;if(step===2)c=`<div class="card hero"><span class="pill">SET UP · 2/4</span><h1>Know your monthly reality.</h1><p class="muted">Rough numbers are fine. We use them for runway and affordability training.</p><div class="field"><label>Monthly income / money available (£)</label><input class="input" id="obIncome" type="number" inputmode="decimal" min="0" value="${esc(p.income??'')}" placeholder="850"></div><div class="field"><label>Monthly rent / housing (£)</label><input class="input" id="obRent" type="number" inputmode="decimal" min="0" value="${esc(p.rent??'')}" placeholder="750"></div><div class="field"><label>Typical weekly flexible spend (£)</label><input class="input" id="obSpend" type="number" inputmode="decimal" min="0" value="${esc(p.weeklySpend??'')}" placeholder="80"></div></div>`;if(step===3)c=`<div class="card hero"><span class="pill">SET UP · 3/4</span><h1>What do you want to get better at?</h1><button class="choice ${p.goal==='control'?'selected':''}" data-goal="control">🎯 Control my spending</button><button class="choice ${p.goal==='save'?'selected':''}" data-goal="save">🧱 Build a cash buffer</button><button class="choice ${p.goal==='invest'?'selected':''}" data-goal="invest">📈 Understand investing</button><button class="choice ${p.goal==='debt'?'selected':''}" data-goal="debt">💳 Understand debt</button><button class="choice ${p.goal==='all'?'selected':''}" data-goal="all">🥋 Become good with money overall</button></div>`;if(step===4)c=`<div class="card hero"><span class="pill">SET UP · 4/4</span><h1>How confident are you?</h1><p class="muted">No judgement. This tunes your starting difficulty.</p><button class="choice ${p.confidence===1?'selected':''}" data-conf="1">😵 I often feel lost</button><button class="choice ${p.confidence===2?'selected':''}" data-conf="2">🙂 I know the basics</button><button class="choice ${p.confidence===3?'selected':''}" data-conf="3">💪 I'm fairly confident</button><button class="choice ${p.confidence===4?'selected':''}" data-conf="4">🧠 I want harder questions</button></div>`;app.innerHTML=c+`<div class="progress"><i style="width:${step*25}%"></i></div><div class="actions"><button ${step===1?'class="ghost"':'onclick="onBack()"'}>${step===1?'':'← Back'}</button><button class="primary" onclick="onNext(${step})">${step===4?'Finish setup':'Continue →'}</button></div>`}
function onNext(step){let p=S.profile||{};if(step===1){p.name=document.getElementById('obName').value.trim();p.age=+document.getElementById('obAge').value;if(!p.name||!p.age)return toast('Add your name and age')}if(step===2){p.income=+document.getElementById('obIncome').value||0;p.rent=+document.getElementById('obRent').value||0;p.weeklySpend=+document.getElementById('obSpend').value||0}if(step===3&&!p.goal)return toast('Pick a goal');if(step===4&&!p.confidence)return toast('Pick your confidence level');if(step===4){p.onboardingComplete=true;S.profile=p;save();accountGate();return}S.profile=p;save();onboarding(step+1)}function onBack(){onboarding(Math.max(1,S.onStep-1))}
document.addEventListener('click',e=>{let g=e.target.closest('[data-goal]');if(g){S.profile=S.profile||{};S.profile.goal=g.dataset.goal;save();onboarding(3)}let f=e.target.closest('[data-conf]');if(f){S.profile=S.profile||{};S.profile.confidence=+f.dataset.conf;save();onboarding(4)}});
function accountGate(){setNav('');app.innerHTML=`<div class="card hero"><span class="pill">YOUR DOJO IS READY</span><h1>Save your progress?</h1><p class="muted">Create a free account to keep your learning, decisions and progress across devices. Or start immediately as a guest.</p><div class="actions"><button class="primary" onclick="account()">Create account</button><button onclick="home()">Continue as guest</button></div></div>`}
function home(){if(!navReady())return onboarding(1);setNav('today');let d=S.profile||{},daily=S.lastDay===today();if(!daily){S.streak=(S.lastDay&&new Date(today())-new Date(S.lastDay)===86400000)?S.streak+1:1;S.lastDay=today();S.lesson=(S.lesson+1)%LESSONS.length;save()}let idx=S.lesson%LESSONS.length,l=LESSONS[idx];let flexible=Math.max(0,(+d.income||0)-(+d.rent||0));app.innerHTML=`<div class="row"><div><div class="eyebrow">TODAY</div><h1>Train your money brain.</h1></div><span class="pill">🔥 ${S.streak} day${S.streak===1?'':'s'}</span></div><div class="card hero"><div class="row"><div><div class="muted">BELT</div><h2>${belt()}</h2></div><div style="text-align:right"><div class="muted">XP</div><b>${S.xp}</b></div></div><div class="progress"><i style="width:${Math.min(100,(S.xp%80)/80*100)}%"></i></div><p class="muted">${Math.max(0,(80-(S.xp%80)))} XP to your next milestone.</p></div><div class="mission"><span class="eyebrow">TODAY'S MISSION</span><h2>${l[1]} ${l[0]}</h2><p>${l[3]}</p><button class="primary" onclick="startLesson(${idx})">Start today's challenge →</button></div><div class="decision"><span class="eyebrow">REAL MONEY</span><h2>Can I afford it?</h2><p class="muted">Check a purchase before you make the decision.</p><input class="input" id="purchase" type="number" inputmode="decimal" placeholder="Purchase amount (£)"><button class="primary" onclick="afford()">Check the trade-off</button></div><div class="grid2"><div class="stat"><b>${money(S.saved)}</b><br><small class="muted">retained</small></div><div class="stat"><b>${S.decisions.length}</b><br><small class="muted">decisions</small></div></div><div class="game" onclick="games()"><span class="game-icon">🎮</span><div class="eyebrow">PLAY</div><h2>Today's mini-game</h2><p class="muted">A different challenge rotates through the dojo each visit.</p></div><div class="game" onclick="markets()"><span class="game-icon">📈</span><div class="eyebrow">FEATURE</div><h2>Markets</h2><p class="muted">Practise investing with your £10,000 virtual portfolio.</p></div>`}
function afford(){let n=+document.getElementById('purchase').value||0;if(n<=0)return toast('Enter a purchase amount');let weekly=+S.profile.weeklySpend||0;let daily=weekly/7;let after=daily-n/7;S.purchase=n;app.innerHTML=`<button onclick="home()">← Today</button><div class="card hero"><span class="eyebrow">TRADE-OFF</span><div class="big">${money(n)}</div><p>Your usual flexible spend is about <b>${money(daily)}</b> per day.</p><div class="grid2"><div class="stat"><b>${money(Math.max(0,daily-n/7))}</b><br><small class="muted">approx. daily room after</small></div><div class="stat"><b>${n>daily*7?'HIGH':'WITHIN PLAN'}</b><br><small class="muted">relative to weekly spend</small></div></div><p class="muted">Unidojo doesn't tell you what to buy. It makes the trade-off visible.</p><div class="actions"><button class="primary" onclick="logDecision('bought')">I bought it</button><button onclick="logDecision('skipped')">I skipped it</button></div></div>`}
function logDecision(outcome){let n=S.purchase||0;S.decisions.push({amount:n,outcome,date:today()});if(outcome==='skipped'){S.saved+=n;addXP(10)}else addXP(5);save();toast(outcome==='skipped'?'£'+n.toFixed(0)+' retained':'Decision logged');setTimeout(home,700)}
function train(){if(!navReady())return onboarding(1);setNav('train');let goal=S.profile.goal||'all';let sorted=[...LESSONS];if(goal==='invest')sorted.sort((a,b)=>(/INVESTING|ECONOMICS/.test(b[2])?1:0)-(/INVESTING|ECONOMICS/.test(a[2])?1:0));let html=`<div class="eyebrow">TRAIN</div><h1>Your money skill tree.</h1><p class="muted">Every visit gives you a different route: new format, new scenario, new decision. Master skills rather than repeat a page.</p><div class="card"><div class="row"><b>${completedCount()}/${LESSONS.length} skills cleared</b><span class="pill">${belt()} belt</span></div><div class="progress"><i style="width:${completedCount()/LESSONS.length*100}%"></i></div></div><div class="tree-line">`;sorted.forEach((l,i)=>{let real=LESSONS.indexOf(l),done=S.completed.includes(real),locked=i>0&&!S.completed.includes(sorted[i-1]&&LESSONS.indexOf(sorted[i-1]));html+=`<button class="lesson" ${locked?'disabled':''} onclick="startLesson(${real})"><span class="node">${done?'✓':l[1]}</span><span><b>${l[0]}</b><br><small class="muted">${l[2]} · ${done?'MASTERED':locked?'LOCKED':'READY'}</small></span></button>`});html+='</div><div class="card"><b>Not another textbook.</b><p class="muted">Lessons rotate between scenarios, rapid choices, calculations, true/false, ranking, and real-life decisions.</p></div>`;app.innerHTML=html}
function startLesson(idx){let l=LESSONS[idx];S.lesson=idx;S.answer=null;setNav('train');let format=(idx+S.xp)%5;let intro=['SCENARIO','RAPID FIRE','MONEY MATH','WHAT WOULD YOU DO?','SPOT THE TRAP'][format];let body=`<button onclick="train()">← Skill tree</button><div class="card hero"><span class="pill">${intro}</span><div class="eyebrow">${l[2]}</div><h1>${l[1]} ${l[0]}</h1><p class="sub">${l[3]}</p>`;if(format===4)body+=`<div class="card"><b>Trap detector</b><p class="muted">Read the choices carefully. One option is attractive because it ignores a hidden trade-off.</p></div>`;if(format===2)body+=`<div class="card"><div class="big">?</div><p class="muted">Do the calculation before looking at the choices.</p></div>`;body+=`<div id="lessonChoices">${l[4].map((x,i)=>`<button class="choice" onclick="answerLesson(${idx},${i})">${String.fromCharCode(65+i)} · ${x}</button>`).join('')}</div></div>`;app.innerHTML=body}
function answerLesson(idx,ans){let l=LESSONS[idx],buttons=[...document.querySelectorAll('#lessonChoices .choice')];buttons.forEach(b=>b.disabled=true);buttons[ans].classList.add(ans===l[5]?'correct':'wrong');if(ans===l[5]){if(!S.completed.includes(idx))S.completed.push(idx);addXP(25);toast('Correct · +25 XP')}else{S.hearts=Math.max(0,(S.hearts||5)-1);toast('Not quite · learn why');buttons[l[5]].classList.add('correct')}save();setTimeout(()=>{let why=['Because the correct answer protects the key trade-off.','Look at what the number actually means, not the headline.','The strongest financial move is the one that survives the real-world constraint.'][idx%3];app.innerHTML=`<div class="card hero"><span class="eyebrow">COACH</span><h1>${ans===l[5]?'You nailed it.':'Good miss. That is exactly what practice is for.'}</h1><p>${why}</p><p class="muted">${l[4][l[5]]}</p><div class="actions"><button class="primary" onclick="nextLesson()">Next challenge →</button><button onclick="train()">Skill tree</button></div></div>`},600)}
function nextLesson(){let pool=LESSONS.map((_,i)=>i).filter(i=>!S.completed.includes(i));let idx=pool.length?pool[Math.floor(Math.random()*pool.length)]:Math.floor(Math.random()*LESSONS.length);startLesson(idx)}
function games(){if(!navReady())return onboarding(1);setNav('today');let g=GAMES[Math.floor((S.xp+new Date().getDate())%GAMES.length)];app.innerHTML=`<button onclick="home()">← Today</button><div class="game hero"><span class="game-icon">${g[1]}</span><div class="eyebrow">PLAY · ROTATES DAILY</div><h1>${g[2]}</h1><p>${g[3]}</p><p class="muted">Focus: ${g[4]}</p><button class="primary" onclick="startGame('${g[0]}')">Play →</button></div>`}
function startGame(type){S.game=type;S.gamePos=0;S.gameScore=0;S.gameCombo=0;let pool=[...LESSONS].sort(()=>Math.random()-.5).slice(0, type==='sprint'?5:3);S.gameItems=pool.map(l=>LESSONS.indexOf(l));gameRound()}
function gameRound(){let idx=S.gameItems[S.gamePos],l=LESSONS[idx];app.innerHTML=`<button onclick="games()">← Games</button><div class="card"><div class="row"><span class="pill">${S.gamePos+1}/${S.gameItems.length}</span><b>${S.gameScore} XP</b></div><div class="progress"><i style="width:${S.gamePos/S.gameItems.length*100}%"></i></div><div class="eyebrow">${S.game==='sprint'?'⚡ QUICK DECISION':S.game==='duel'?'⚔️ TRADE-OFF':'🔥 KEEP THE COMBO'}</div><h2>${l[0]}</h2><p>${l[3]}</p>${l[4].map((x,i)=>`<button class="choice" onclick="gameAnswer(${i})">${x}</button>`).join('')}</div>`}
function gameAnswer(a){let idx=S.gameItems[S.gamePos],l=LESSONS[idx],ok=a===l[5];if(ok){S.gameCombo++;S.gameScore+=10+S.gameCombo*2;toast('Combo x'+S.gameCombo)}else{S.gameCombo=0;toast('Combo broken')}S.gamePos++;if(S.gamePos>=S.gameItems.length){addXP(S.gameScore);app.innerHTML=`<div class="card hero"><div class="eyebrow">RUN COMPLETE</div><div class="score">${S.gameScore}</div><p class="muted">XP earned · ${S.gameCombo} final combo</p><button class="primary" onclick="games()">Play another mode</button></div>`}else gameRound();save()}
async function refreshMarkets(){for(const t of STOCKS){try{let j=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?range=1d&interval=5m').then(r=>r.json());S.live[t]=j.chart.result[0].meta.regularMarketPrice}catch(e){}}save()}
function price(t){return Number(S.live[t]||SEED[t])}
function markets(){if(!navReady())return onboarding(1);setNav('markets');app.innerHTML=`<div class="row"><div><div class="eyebrow">FEATURE</div><h1>Markets</h1></div><span class="pill">£10,000 START</span></div><div class="card"><div class="row"><div><span class="muted">VIRTUAL CASH</span><div class="big">${money(S.cash)}</div></div><div style="text-align:right"><span class="muted">HOLDINGS</span><div><b>${Object.values(S.holdings).reduce((a,b)=>a+b,0)}</b> shares</div></div></div><p class="muted">Paper trading is one feature of Unidojo — practise what you learn without risking real money.</p></div>${STOCKS.map(t=>`<div class="stock"><div class="row"><div><b>${t}</b><br><span class="muted">${N[t]}</span></div><div style="text-align:right"><div class="price">$${price(t).toFixed(2)}</div><small class="muted">simulated</small></div></div><button class="primary" onclick="trade('${t}')">Open ${t} →</button></div>`).join('')}`;refreshMarkets().then(()=>{if(S.tab==='markets')markets()})}
function trade(t){let p=price(t);app.innerHTML=`<button onclick="markets()">← Markets</button><div class="card hero"><span class="eyebrow">${N[t]} · ${t}</span><h1>$${p.toFixed(2)}</h1><p class="muted">Market data refreshes where the public endpoint is available; the simulator always remains usable.</p><div class="field"><label>Quantity</label><input class="input" id="qty" type="number" inputmode="numeric" min="1" value="1"></div><div class="grid2"><div class="stat"><b>${money(S.cash)}</b><br><small class="muted">cash available</small></div><div class="stat"><b>${S.holdings[t]||0}</b><br><small class="muted">shares owned</small></div></div><div class="actions"><button class="primary" onclick="buy('${t}')">Buy shares</button><button onclick="sell('${t}')">Sell shares</button></div></div><div class="card"><b>Unidojo Coach</b><p class="muted">Before buying, answer: why this company, why now, what could prove your thesis wrong, and how large should the position be?</p></div>`}
function buy(t){let q=Math.max(1,Math.floor(+document.getElementById('qty').value||1)),cost=q*price(t);if(cost>S.cash)return toast('Not enough virtual cash');S.cash-=cost;S.holdings[t]=(S.holdings[t]||0)+q;save();addXP(2);trade(t)}function sell(t){let q=Math.max(1,Math.floor(+document.getElementById('qty').value||1));if((S.holdings[t]||0)<q)return toast('You do not own enough shares');S.holdings[t]-=q;S.cash+=q*price(t);save();trade(t)}
function account(){setNav('account');app.innerHTML=`<div class="eyebrow">ACCOUNT</div><h1>Save your dojo.</h1><div class="card"><p class="muted">Guest progress stays on this device. Create an account to sync your progress across devices.</p><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input class="input" id="pw" type="password" autocomplete="new-password" placeholder="8+ characters"></div><div class="actions"><button class="primary" onclick="signup()">Create account</button><button onclick="signin()">Sign in</button></div><div id="authMsg"></div></div><div class="card"><div class="grid2"><div class="stat"><b>${S.xp}</b><br><small class="muted">XP</small></div><div class="stat"><b>${belt()}</b><br><small class="muted">belt</small></div></div></div>`}
async function client(){if(!window.supabase||!window.UNIDOJO_SUPABASE_URL)return null;return supabase.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY)}async function signup(){let c=await client();if(!c)return toast('Account service loading');let r=await c.auth.signUp({email:document.getElementById('email').value,password:document.getElementById('pw').value});document.getElementById('authMsg').innerHTML=r.error?`<p class="error">${esc(r.error.message)}</p>`:`<p class="success">${r.data.session?'Account created.':'Check your email to confirm your account.'}</p>`}async function signin(){let c=await client();if(!c)return toast('Account service loading');let r=await c.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pw').value});document.getElementById('authMsg').innerHTML=r.error?`<p class="error">${esc(r.error.message)}</p>`:`<p class="success">Signed in.</p>`}
function boot(){if(!S.profile||!S.profile.onboardingComplete){onboarding(1);return}home()}boot();
</script></body></html>
