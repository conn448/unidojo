<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--card:#141414;--line:#292929;--text:#fff;--muted:#929292;--orange:#ff8a00;--gold:#ffb000;--green:#35d399;--red:#ff5d73;--blue:#62a8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}button,input{font:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding:20px 17px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px}.logo i{color:var(--orange);font-style:normal}.chips{display:flex;gap:7px}.chip{background:#171717;border:1px solid #303030;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900}.eyebrow{color:var(--orange);font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.muted{color:var(--muted)}h1{font-size:42px;line-height:.96;letter-spacing:-2px;margin:8px 0 14px}h2{letter-spacing:-.7px;margin:8px 0}.orange{color:var(--orange)}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:14px}.hero{padding:24px}.big{font-size:52px;font-weight:950;letter-spacing:-3px}.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px 18px;margin-top:13px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#111;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #a95500}.btn:active{transform:translateY(3px);box-shadow:none}.ghost{background:#171717;color:#fff;border:1px solid #333;box-shadow:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:13px;text-align:center}.field{width:100%;padding:15px;margin-top:7px;background:#090909;border:1px solid #3b3b3b;border-radius:13px;color:#fff;outline:none}.field:focus{border-color:var(--orange)}.label{display:block;margin-top:16px;font-size:13px;font-weight:800}.choice,.game{display:block;width:100%;text-align:left;background:#111;color:#fff;border:2px solid #2d2d2d;border-radius:15px;padding:15px;margin-top:10px;cursor:pointer}.choice:hover,.game:hover{border-color:#666}.game{background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #303030;border-radius:20px}.game b{font-size:30px;float:right}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}.nav{position:fixed;bottom:0;left:0;right:0;background:#090909f2;border-top:1px solid #252525;z-index:10}.navin{max-width:540px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#777;padding:9px 4px;font-size:10px;font-weight:900;cursor:pointer}.nav button.active{color:var(--orange)}.nav strong{display:block;font-size:20px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 16px;border-radius:99px;font-weight:900;display:none;z-index:100;white-space:nowrap}.toast.show{display:block}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modalbox{width:min(540px,100%);background:#111;border:1px solid #333;border-radius:26px 26px 0 0;padding:24px 18px 30px;max-height:92vh;overflow:auto}.close{float:right;background:#222;color:#fff;border:1px solid #333;border-radius:50%;width:34px;height:34px;cursor:pointer}.link{color:var(--orange);font-weight:900;cursor:pointer;border:0;background:none;padding:0}.accountbar{font-size:11px;color:#aaa;text-align:right;margin:-10px 0 18px}.notice{background:#19130a;border:1px solid #4c3515;color:#ffc96a;border-radius:14px;padding:12px;font-size:12px;margin-top:12px}.stock{background:#111;border:1px solid #292929;border-radius:17px;padding:14px;margin-top:9px}.stockrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.mini{font-size:12px}.onboard{min-height:100vh;display:flex;align-items:center}.dots{display:flex;gap:6px;margin:16px 0}.dot{width:28px;height:5px;background:#2c2c2c;border-radius:99px}.dot.on{background:var(--orange)}
</style>
</head>
<body>
<div id="toast" class="toast"></div><main id="root"></main>
<script src="supabase-config.js"></script>
<script>
(function(){'use strict';
/* Kill any older Unidojo service worker that may be serving a stale blank build. */
try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('unidojo')!==-1)caches.delete(k)})})}}catch(e){}
var root=document.getElementById('root'),KEY='unidojo-mvp-v1';
var stocks=[['AAPL','Apple',228],['MSFT','Microsoft',510],['NVDA','NVIDIA',176],['AMZN','Amazon',232],['GOOGL','Alphabet',246],['META','Meta',748],['TSLA','Tesla',350],['V','Visa',350]];
var lessons=[['Runway, not balance','Cash in your account is not the same as money you can freely spend. Ring-fence fixed costs and a buffer first.','£420 cash − £300 rent − £50 buffer = £70 flexible runway.'],['Opportunity cost','Every pound has a next-best use. A £45 night out is also £45 you cannot keep, invest, or use elsewhere.','Good decisions compare a purchase with what the same money could do instead.'],['APR beats the headline','Compare total borrowing cost and APR, not just a monthly payment or headline rate.','A smaller monthly payment can still mean a larger total cost.'],['Real returns','A 4% savings return with 3% inflation is roughly a 1% real gain before tax and fees.','Nominal growth is not the same as purchasing-power growth.'],['Concentration risk','A portfolio dominated by one company means one thesis controls most of your outcome.','A great company can still be too large a position.'],['Compounding','Returns can generate future returns. Time matters because each period builds on the previous one.','The earlier money compounds and stays invested, the more powerful the snowball.'],['Liquidity first','Money needed soon should generally be accessible and lower-risk. Long-term money can tolerate more volatility.','Match investment risk to when you need the money.'],['Behaviour is a variable','A perfect plan fails if you repeatedly break it. Good systems reduce friction around good decisions.','Automation and spending pauses can beat relying on willpower.']];
var state={screen:'home',step:0,needsOnboarding:true,name:'',income:0,rent:0,weekly:0,goal:'',confidence:3,xp:0,streak:0,decisions:0,saved:0,lesson:0,gameRound:0,gameScore:0,cash:10000,holdings:{},guest:true};
try{var old=JSON.parse(localStorage.getItem(KEY));if(old)state=Object.assign(state,old)}catch(e){}
var sb=null,authUser=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1600)}
function belt(){return state.xp>=800?'BLACK':state.xp>=450?'RED':state.xp>=220?'BLUE':state.xp>=80?'GREEN':'WHITE'}
function top(){return '<div class="top"><div class="logo">uni<i>dojo</i></div><div class="chips"><span class="chip">🔥 '+state.streak+'</span><span class="chip">⚡ '+state.xp+'</span></div></div>'}
function nav(){return '<div class="nav"><div class="navin"><button data-screen="home" class="'+(state.screen==='home'?'active':'')+'"><strong>⌂</strong>Today</button><button data-screen="train" class="'+(state.screen==='train'?'active':'')+'"><strong>◈</strong>Train</button><button data-screen="markets" class="'+(state.screen==='markets'?'active':'')+'"><strong>↗</strong>Markets</button><button data-screen="profile" class="'+(state.screen==='profile'?'active':'')+'"><strong>♛</strong>Dojo</button></div></div>'}
function shell(body){return '<div class="app">'+top()+'<div class="accountbar">'+(authUser?'Saved to account · <button class="link" data-action="signout">Sign out</button>':'Guest mode · <button class="link" data-action="account">Create account</button>')+'</div>'+body+'</div>'+nav()}
function onboarding(){var titles=['What should we call you?','What is your money situation?','What matters most right now?','How confident are you with money?'];var body='<div class="app onboard"><div class="card hero" style="width:100%"><div class="eyebrow">WELCOME TO UNIDOJO</div><div class="dots">'+[0,1,2,3].map(function(i){return '<span class="dot '+(i<=state.step?'on':'')+'"></span>'}).join('')+'</div><h1>'+titles[state.step]+'</h1><p class="muted">'+(state.step===0?'Build a money dojo that actually fits your life.':state.step===1?'Rough numbers are enough. You can change them later.':state.step===2?'Pick the outcome you care about most.':'This changes where your training starts.')+'</p>';
if(state.step===0)body+='<input id="on-name" class="field" value="'+esc(state.name)+'" placeholder="First name">';
if(state.step===1)body+='<label class="label">Monthly money coming in<input id="on-income" class="field" type="number" value="'+(state.income||'')+'" placeholder="850"></label><label class="label">Monthly rent<input id="on-rent" class="field" type="number" value="'+(state.rent||'')+'" placeholder="750"></label><label class="label">Typical weekly spending<input id="on-weekly" class="field" type="number" value="'+(state.weekly||'')+'" placeholder="100"></label>';
if(state.step===2)body+='<button class="choice" data-goal="Build a buffer">Build a buffer</button><button class="choice" data-goal="Stop wasting money">Stop wasting money</button><button class="choice" data-goal="Understand investing">Understand investing</button><button class="choice" data-goal="Get confident with money">Get confident with money</button>';
if(state.step===3)body+='<button class="choice" data-confidence="1">😬 I mostly guess</button><button class="choice" data-confidence="2">I know the basics</button><button class="choice" data-confidence="3">I\'m reasonably confident</button><button class="choice" data-confidence="4">I\'m already pretty good</button><button class="choice" data-confidence="5">I want the hard stuff</button>';
if(state.step<2)body+='<button class="btn" data-action="onnext">Continue →</button>';body+='</div></div>';return body}
function home(){return shell('<div class="eyebrow">'+belt()+' BELT · DAY '+Math.max(1,state.streak||1)+'</div><h1>Hey '+esc(state.name||'there')+'.<br><span class="orange">Let\'s play.</span></h1><div class="card hero"><div class="eyebrow">TODAY\'S MISSION</div><h2>Make one better money decision.</h2><p class="muted">Use a real purchase, see the trade-off, then earn XP.</p><button class="btn" data-action="decision">Can I afford it? →</button></div><div class="eyebrow" style="margin-top:28px">PLAY</div><button class="game" data-action="snake"><b>🐍</b><div class="eyebrow">ARCADE</div><h2>Money Snake</h2><p class="muted">Five fast financial decisions. Build your score.</p></button><div class="eyebrow" style="margin-top:25px">TRAIN</div><div class="card"><div class="eyebrow">NEXT SKILL</div><h2>'+esc(lessons[state.lesson%lessons.length][0])+'</h2><p class="muted">'+esc(lessons[state.lesson%lessons.length][1])+'</p><button class="btn ghost" data-screen="train">Train →</button></div><div class="grid" style="margin-top:12px"><div class="stat"><b class="orange">'+state.decisions+'</b><br><small class="muted">real decisions</small></div><div class="stat"><b>£'+Number(state.saved).toFixed(0)+'</b><br><small class="muted">spend avoided</small></div></div>')}
function decision(){return shell('<button class="btn ghost" data-screen="home">← Back</button><div style="margin-top:25px"><div class="eyebrow">REAL-WORLD MODE</div><h1>Can I afford it?</h1><p class="muted">No judgement. Just the trade-off.</p><label class="label">Purchase amount<input id="amount" class="field" type="number" min="0" placeholder="18"></label><div class="card"><div class="eyebrow">YOUR NUMBERS</div><p>Weekly flexible spend: <b>£'+Number(state.weekly||0).toFixed(0)+'</b></p><p>Monthly rent: <b>£'+Number(state.rent||0).toFixed(0)+'</b></p><p class="muted">Your answer matters more than a magic yes/no.</p></div><button class="btn" data-action="buy">I bought it</button><button class="btn ghost" data-action="skip">I skipped it</button></div>')}
function result(){var a=Number(state._amount||0),pct=state.weekly?Math.round(a/state.weekly*100):0;return shell('<div class="eyebrow">DECISION COMPLETE</div><h1>'+(!state._bought?'Good skip.':'Here\'s the reality.')+'</h1><div class="card hero"><div class="big">£'+a.toFixed(0)+'</div><p class="muted">About '+pct+'% of your typical weekly flexible spend.</p><div class="progress"><span style="width:'+Math.min(100,pct)+'%"></span></div><p>'+(!state._bought?'You kept £'+a.toFixed(0)+' available for another priority.':'That purchase is now part of your spending trade-off.')+'</p></div><button class="btn" data-action="finishdecision">Continue →</button>')}
function train(){var l=lessons[state.lesson%lessons.length];return shell('<div class="eyebrow">TRAIN · SKILL '+(state.lesson+1)+'</div><h1>'+esc(l[0])+'</h1><div class="card hero"><p>'+esc(l[1])+'</p><div class="notice">'+esc(l[2])+'</div></div><div class="card"><div class="eyebrow">CHALLENGE</div><h2>Which principle is strongest here?</h2><button class="choice" data-answer="0">Compare the decision with its opportunity cost.</button><button class="choice" data-answer="1">Ignore future trade-offs because the amount is small.</button><button class="choice" data-answer="2">Only look at today’s account balance.</button></div>')}
function markets(){var h=Object.keys(state.holdings).reduce(function(a,k){return a+Number(state.holdings[k])*Number(stocks.find(function(s){return s[0]===k})[2])},0);return shell('<div class="eyebrow">MARKETS · PAPER TRADING</div><h1>Learn by doing.</h1><div class="grid"><div class="stat"><b>£'+Number(state.cash).toFixed(0)+'</b><br><small class="muted">cash</small></div><div class="stat"><b>£'+h.toFixed(0)+'</b><br><small class="muted">positions</small></div></div><div class="notice">£10,000 virtual cash. Simulation only.</div><div class="card"><div class="eyebrow">COACH</div><h2>'+ (h>0?'Watch concentration.':'Build a thesis before you buy.')+'</h2><p class="muted">The coach will react to your portfolio behaviour as the market grows.</p></div>'+stocks.map(function(s){var owned=state.holdings[s[0]]||0;return '<div class="stock"><div class="stockrow"><div><b>'+s[0]+'</b><div class="mini muted">'+s[1]+'</div></div><div class="stockrow"><b>£'+s[2]+'</b><button class="btn" style="margin:0;padding:9px 12px" data-buy-stock="'+s[0]+'">Buy</button></div></div>'+(owned?'<div class="mini muted" style="margin-top:8px">Owned: '+owned+'</div>':'')+'</div>'}).join('')+'<button class="btn ghost" data-action="markets-reset">Reset virtual portfolio</button>')}
function profile(){return shell('<div class="eyebrow">YOUR DOJO</div><h1>'+esc(state.name||'Your profile')+'</h1><div class="card hero"><div class="big">'+state.xp+' XP</div><p><span class="chip">'+belt()+' BELT</span> <span class="chip">🔥 '+state.streak+' streak</span></p><div class="progress"><span style="width:'+Math.min(100,(state.xp%80)/80*100)+'%"></span></div></div><div class="grid"><div class="stat"><b>'+state.decisions+'</b><br><small class="muted">decisions</small></div><div class="stat"><b>£'+Number(state.saved).toFixed(0)+'</b><br><small class="muted">kept</small></div></div><div class="card"><h2>Money profile</h2><p class="muted">Goal: <b style="color:#fff">'+esc(state.goal||'Not set')+'</b></p><p class="muted">Confidence: <b style="color:#fff">'+state.confidence+'/5</b></p><p class="muted">Weekly spend: <b style="color:#fff">£'+Number(state.weekly||0).toFixed(0)+'</b></p></div><button class="btn ghost" data-action="account">Account & sync →</button>')}
function snake(){var qs=[['You have £300 rent due and £70 flexible money. Safer move?',['Spend £70 because the balance is positive.','Protect rent first and treat £70 as your flexible ceiling.','Borrow £100 to create more room.'],1],['A £45 purchase uses half of a £90 flexible budget. Key concept?',['Opportunity cost.','Gross income.','Inflation only.'],0],['Savings earn 4% while inflation is 3%. Approximate real return?',['About 1%.','About 7%.','About -1%.'],0],['One stock is 80% of your portfolio. Main issue?',['Concentration risk.','Liquidity surplus.','Compound interest.'],0],['You sell after a 10% fall without new information. What should you question?',['Whether emotion is driving the decision.','Whether prices ever move.','Whether diversification is impossible.'],0]];var q=qs[state.gameRound%qs.length];return shell('<div class="eyebrow">MONEY SNAKE · ROUND '+(state.gameRound+1)+'/5</div><h1>Make the <span class="orange">move.</span></h1><div class="card hero"><div class="big">'+state.gameScore+'</div><p class="muted">run score</p><h2>'+esc(q[0])+'</h2>'+q[1].map(function(x,i){return '<button class="choice" data-snake-answer="'+i+'">'+esc(x)+'</button>'}).join('')+'</div>')}
function accountModal(){return '<div class="modal"><div class="modalbox"><button class="close" data-action="close">×</button><div class="eyebrow">SAVE YOUR DOJO</div><h1>'+ (authUser?'Account connected.':'Keep your progress.')+'</h1><p class="muted">'+(authUser?'Your account is connected to Supabase.':'Guest mode works on this browser. Create an account when you want cross-device persistence.')+'</p>'+(!authUser?'<button class="btn" data-action="signup">Create free account</button><button class="btn ghost" data-action="login">I already have an account</button>':'<button class="btn ghost" data-action="signout">Sign out</button>')+'<button class="btn ghost" data-action="close">Close</button></div></div>'}
function authModal(mode){return '<div class="modal"><div class="modalbox"><button class="close" data-action="close">×</button><div class="eyebrow">'+(mode==='signup'?'CREATE ACCOUNT':'SIGN IN')+'</div><h1>'+ (mode==='signup'?'Save your dojo.':'Welcome back.')+'</h1>'+(mode==='signup'?'<label class="label">Name<input id="auth-name" class="field" value="'+esc(state.name)+'" placeholder="First name"></label>':'')+'<label class="label">Email<input id="auth-email" class="field" type="email" placeholder="you@example.com"></label><label class="label">Password<input id="auth-password" class="field" type="password" placeholder="At least 6 characters"></label><button class="btn" data-action="submit-'+mode+'">'+(mode==='signup'?'Create account':'Sign in')+' →</button><p id="auth-error" class="mini muted"></p></div></div>'}
function render(){if(state.needsOnboarding){root.innerHTML=onboarding();return}if(state.screen==='decision')root.innerHTML=decision();else if(state.screen==='result')root.innerHTML=result();else if(state.screen==='train')root.innerHTML=train();else if(state.screen==='markets')root.innerHTML=markets();else if(state.screen==='profile')root.innerHTML=profile();else if(state.screen==='snake')root.innerHTML=snake();else root.innerHTML=home()}
async function pullProfile(){if(!sb||!authUser)return;try{var r=await sb.from('profiles').select('*').eq('id',authUser.id).maybeSingle();if(r.data){var p=r.data;state.name=p.name||state.name;state.income=p.income||0;state.rent=p.rent||0;state.weekly=p.weekly_spend||0;state.goal=p.goal||'';state.confidence=p.confidence||3;state.xp=p.xp||0;state.streak=p.streak||0;state.decisions=p.decisions||0;state.saved=p.saved||0;state.lesson=p.lesson||0;state.needsOnboarding=!p.onboarding_complete;save()}}catch(e){}}
async function pushProfile(){if(!sb||!authUser)return;try{await sb.from('profiles').upsert({id:authUser.id,name:state.name,age:17,income:Number(state.income)||0,rent:Number(state.rent)||0,weekly_spend:Number(state.weekly)||0,goal:state.goal,confidence:Number(state.confidence)||3,xp:Number(state.xp)||0,streak:Number(state.streak)||0,decisions:Number(state.decisions)||0,saved:Number(state.saved)||0,lesson:Number(state.lesson)||0,onboarding_complete:true})}catch(e){}}
function bootSupabase(){try{if(!window.UNIDOJO_SUPABASE_URL||!window.UNIDOJO_SUPABASE_KEY)return;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=async function(){try{sb=window.supabase.createClient(window.UNIDOJO_SUPABASE_URL,window.UNIDOJO_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});var r=await sb.auth.getSession();authUser=r.data.session?r.data.session.user:null;if(authUser){state.guest=false;await pullProfile();render()}sb.auth.onAuthStateChange(function(ev,session){authUser=session?session.user:null;state.guest=!authUser;render()})}catch(e){}};document.head.appendChild(s)}catch(e){}}
root.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;var sc=b.getAttribute('data-screen');if(sc){state.screen=sc;save();render();return}var goal=b.getAttribute('data-goal');if(goal){state.goal=goal;state.step=3;save();render();return}var cf=b.getAttribute('data-confidence');if(cf){state.confidence=Number(cf);state.needsOnboarding=false;state.streak=1;state.xp=20;save();render();setTimeout(function(){root.insertAdjacentHTML('beforeend',accountModal())},200);return}var an=b.getAttribute('data-answer');if(an!==null){if(Number(an)===0){state.xp+=20;state.lesson++;toast('Correct · +20 XP')}else toast('Not quite — review the principle');save();setTimeout(render,450);return}var sa=b.getAttribute('data-snake-answer');if(sa!==null){var correct=[1,0,0,0,0][state.gameRound%5];if(Number(sa)===correct){state.gameScore+=20;toast('Correct · +20')}else toast('Think about the trade-off');state.gameRound++;if(state.gameRound>=5){state.xp+=state.gameScore;var final=state.gameScore;state.gameRound=0;state.gameScore=0;state.screen='home';save();render();toast('Run complete · +'+final+' XP')}else{save();setTimeout(render,350)}return}var act=b.getAttribute('data-action');if(!act)return;if(act==='onnext'){if(state.step===0){state.name=(document.getElementById('on-name').value||'').trim()||'Student';state.step=1}else if(state.step===1){state.income=Number(document.getElementById('on-income').value)||0;state.rent=Number(document.getElementById('on-rent').value)||0;state.weekly=Number(document.getElementById('on-weekly').value)||0;state.step=2}save();render();return}if(act==='decision'){state.screen='decision';render();return}if(act==='buy'||act==='skip'){var a=Number(document.getElementById('amount').value)||0;if(a<=0){toast('Enter an amount first');return}state._amount=a;state._bought=act==='buy';if(!state._bought)state.saved+=a;state.decisions++;state.xp+=10;if(sb&&authUser)await sb.from('decisions').insert({user_id:authUser.id,amount:a,outcome:state._bought?'bought':'skipped'});save();state.screen='result';render();return}if(act==='finishdecision'){state.screen='home';state.lesson++;save();await pushProfile();render();return}if(act==='snake'){state.screen='snake';state.gameRound=0;state.gameScore=0;render();return}if(act==='account'){root.insertAdjacentHTML('beforeend',accountModal());return}if(act==='close'){document.querySelectorAll('.modal').forEach(function(x){x.remove()});return}if(act==='signup'||act==='login'){document.querySelectorAll('.modal').forEach(function(x){x.remove()});root.insertAdjacentHTML('beforeend',authModal(act));return}if(act==='submit-signup'||act==='submit-login'){var email=(document.getElementById('auth-email').value||'').trim(),pass=document.getElementById('auth-password').value||'',err=document.getElementById('auth-error');if(!sb){err.textContent='Account service is unavailable. Guest mode still works.';return}var r=act==='submit-signup'?await sb.auth.signUp({email:email,password:pass,options:{data:{name:document.getElementById('auth-name')?document.getElementById('auth-name').value:state.name}}}):await sb.auth.signInWithPassword({email:email,password:pass});if(r.error){err.textContent=r.error.message;return}if(act==='submit-signup'&&r.data.user&&!r.data.session){err.textContent='Account created. Check your email to confirm it, then sign in.';return}authUser=r.data.user;state.guest=false;state.needsOnboarding=false;await pushProfile();document.querySelectorAll('.modal').forEach(function(x){x.remove()});render();toast('Account connected');return}if(act==='signout'){if(sb)await sb.auth.signOut();authUser=null;state.guest=true;document.querySelectorAll('.modal').forEach(function(x){x.remove()});render();return}if(act==='markets-reset'){state.cash=10000;state.holdings={};save();render();toast('Portfolio reset');return}});
root.addEventListener('click',function(e){var b=e.target.closest('[data-buy-stock]');if(!b)return;var ticker=b.getAttribute('data-buy-stock'),s=stocks.find(function(x){return x[0]===ticker});if(!s)return;if(state.cash<s[2]){toast('Not enough virtual cash');return}state.cash-=s[2];state.holdings[ticker]=(state.holdings[ticker]||0)+1;state.xp+=5;save();render();toast('Bought 1 '+ticker+' · +5 XP')});
render();bootSupabase();
})();
</script>
