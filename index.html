<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="description" content="Unidojo — daily money training for students.">
<link rel="manifest" href="manifest.json"><title>Unidojo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#1d1d1d;--line:#303030;--text:#fff;--muted:#9ca3af;--gold:#f5b51b;--gold2:#c98a00;--green:#36d399;--red:#fb7185;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;padding:18px 18px 105px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;letter-spacing:-.04em;font-size:24px}.brand span{color:var(--gold)}.muted{color:var(--muted)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.btn{width:100%;border:0;border-radius:15px;padding:15px 18px;background:var(--gold);color:#151515;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--gold2);transition:.12s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}.btn.secondary{background:#292929;color:#fff;box-shadow:0 4px 0 #111}.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line)}.field{width:100%;background:#0b0b0b;color:#fff;border:1px solid #414141;border-radius:13px;padding:14px;font:inherit;margin-top:7px}.field:focus{outline:2px solid var(--gold);border-color:var(--gold)}label{display:block;color:#b6b6b6;font-size:13px;font-weight:800;margin-top:17px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.progress{height:10px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:.25s}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(9,9,9,.97);border-top:1px solid var(--line);z-index:20}.bottom-in{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{border:0;background:transparent;color:#777;padding:13px 5px 12px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}.bottom button.active{color:var(--gold)}.bottom b{display:block;font-size:20px;line-height:20px}.path{position:relative;margin-top:18px;padding-bottom:4px}.lesson{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:11px 4px;cursor:pointer}.lesson .node{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#282828;border:4px solid #3b3b3b;font-size:21px;font-weight:950;flex:none;box-shadow:0 4px 0 #111}.lesson.done .node{background:var(--gold);border-color:var(--gold);color:#151515}.lesson.current .node{background:#151515;border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 5px rgba(245,181,27,.12),0 4px 0 #111}.lesson.locked{opacity:.42;cursor:not-allowed}.lesson .copy{flex:1}.xp{color:var(--gold);font-weight:950}.choice{width:100%;display:flex;align-items:center;gap:12px;background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:15px;padding:14px;text-align:left;font:inherit;cursor:pointer;margin-top:10px}.choice.selected{border-color:var(--gold);background:#2b210d}.choice.correct{border-color:var(--green);background:#0a3024}.choice.wrong{border-color:var(--red);background:#36131b}.choice .num{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:#292929;font-weight:950;flex:none}.heart{color:#fb7185}.stat{background:#111;border:1px solid var(--line);border-radius:15px;padding:12px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:50;background:#f5b51b;color:#111;padding:10px 15px;border-radius:999px;font-weight:900;box-shadow:0 8px 30px #000;display:none}.toast.show{display:block}.hide{display:none!important}.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--pct),#292929 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:var(--panel);border-radius:50%}.ring span{position:relative;z-index:1;font-weight:950}.decision{border:2px solid var(--gold);background:#1e180a;border-radius:20px;padding:18px}.mini{font-size:12px}.tap{cursor:pointer}
</style>
</head>
<body><div id="toast" class="toast"></div><main id="app"></main>
<script>
(()=>{'use strict';
const KEY='unidojo-duo-v2';
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysUntil=d=>{if(!d)return 1;const a=new Date(today()+'T00:00:00'),b=new Date(d+'T00:00:00');return Math.max(1,Math.ceil((b-a)/86400000))};
const lessons=[
 {title:'Meet your runway',icon:'🏃',tag:'FOUNDATION',text:'Your balance is not the amount you can spend. Your runway is the money left after commitments, divided across the days until your next income.',q:'If you have £120 and 10 days to payday, before other costs, your runway starts at…',opts:['£12/day','£120/day','£1.20/day'],ans:0,tip:'Runway turns “am I broke?” into a number you can act on.'},
 {title:'Protect payday',icon:'🛡️',tag:'FOUNDATION',text:'Money already promised to rent, bills or essential travel is not flexible spending. Protect it first.',q:'What should you subtract before calculating flexible spending room?',opts:['A bill due before payday','Your favourite song','Last month’s old receipt'],ans:0,tip:'Protect commitments first. Then decide what the remaining money can do.'},
 {title:'Make the call',icon:'⚔️',tag:'DECISIONS',text:'Good money habits are decisions, not restrictions. Compare a purchase with what it does to the rest of your runway.',q:'You have £10/day left. A £25 non-essential purchase would reduce your remaining room. What is the best first move?',opts:['Check the trade-off before buying','Buy it without checking','Pretend it does not count'],ans:0,tip:'You can still buy things. The skill is knowing the consequence first.'},
 {title:'Spot the leak',icon:'💧',tag:'AWARENESS',text:'Small repeat purchases can quietly become your biggest category. The goal is not to eliminate them—just make them visible.',q:'Which pattern is most useful to notice?',opts:['A £4 spend repeated every day','One random £1 spend once','Your old bank statement colour'],ans:0,tip:'Repeated small spends deserve attention because they compound.'},
 {title:'The 24-hour move',icon:'⏱️',tag:'DECISIONS',text:'For non-essential purchases above your personal pause amount, delay the decision. Wanting something tomorrow is different from wanting it for ten minutes.',q:'The 24-hour rule is mainly for…',opts:['Non-essential purchases','Every rent payment','Checking your balance'],ans:0,tip:'Delay creates space for a deliberate choice without banning the purchase.'},
 {title:'Build your buffer',icon:'🧱',tag:'RESILIENCE',text:'A small cash buffer protects you from turning a surprise expense into a crisis. Start tiny and make it automatic when you can.',q:'What is the first job of an emergency buffer?',opts:['Absorb a small surprise','Make you rich quickly','Replace your income'],ans:0,tip:'A buffer buys options when something unexpected happens.'},
 {title:'Own your week',icon:'🥋',tag:'RESET',text:'Once a week, update the numbers, review what actually happened and choose one behaviour to change. No guilt. Just feedback.',q:'What makes a weekly reset useful?',opts:['Compare plan vs reality and adjust','Punish yourself for spending','Ignore the numbers'],ans:0,tip:'The best system is one that learns from your real behaviour.'}
];
let S={profile:null,tab:'today',xp:0,streak:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,booted:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const model=()=>{const p=S.profile||{},d=daysUntil(p.payday),available=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0)),daily=available/d;return{days:d,available,daily,level:daily>=12?'good':daily>=5?'warn':'bad'}};
const belt=()=>S.xp>=280?'BLACK':S.xp>=160?'BLUE':S.xp>=80?'GREEN':S.xp>=30?'YELLOW':'WHITE';
const nextXP=()=>S.xp<30?30:S.xp<80?80:S.xp<160?160:S.xp<280?280:400;
function bottom(){return '<nav class="bottom"><div class="bottom-in">'+[['today','🏠','Today'],['train','🥋','Train'],['dojo','🏆','Dojo']].map(x=>'<button data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>'}
function shell(content,nav=true){return '<div class="app">'+content+(nav?bottom():'')+'</div>'}
function top(){return '<div class="top"><div class="brand">uni<span>dojo</span></div><div class="flex items-center gap-4"><span class="font-black">🔥 '+S.streak+'</span><span class="heart">♥ '+S.hearts+'</span></div></div>'}
function welcome(){return shell('<div class="min-h-[82vh] flex flex-col justify-center">'+top()+'<div class="mt-14"><div class="text-7xl">🥋</div><div class="eyebrow mt-7">Money training for students</div><h1 class="text-5xl font-black leading-[.95] mt-3">Get good with<br><span class="text-amber-400">your money.</span></h1><p class="muted text-lg leading-relaxed mt-6">Short daily training. Real money decisions. A streak that makes the habit stick.</p><div class="panel mt-7"><div class="flex justify-between"><b>Today’s mission</b><span class="xp">+10 XP</span></div><p class="muted text-sm mt-2">Set your runway and complete your first 30-second lesson.</p></div></div><button class="btn mt-8" data-act="setup">Start training</button><p class="text-center muted text-xs mt-4">Private on this device · No bank link</p></div>',false)}
function setup(step=1){if(step===1)return shell(top()+'<div class="mt-9"><div class="eyebrow">Training setup · 1/2</div><h1 class="text-3xl font-black mt-2">Know your starting point.</h1><p class="muted mt-2">Two numbers. Then we turn them into a daily target.</p><label>Current balance<input id="balance" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 180" value="'+esc(S.profile?.balance??'')+'"></label><label>Next payday / income<input id="payday" class="field" type="date" min="'+today()+'" value="'+esc(S.profile?.payday??'')+'"></label><button class="btn mt-8" data-act="setup2">Continue</button></div>',false);return shell(top()+'<button class="btn ghost mt-7" data-act="setup1">← Back</button><div class="mt-8"><div class="eyebrow">Training setup · 2/2</div><h1 class="text-3xl font-black mt-2">Protect the essentials.</h1><p class="muted mt-2">Only include things you must pay before payday.</p><label>Essentials due before payday<input id="bills" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 40" value="'+esc(S.profile?.bills??'')+'"></label><label>Buffer to protect (optional)<input id="buffer" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 10" value="'+esc(S.profile?.buffer??'')+'"></label><button class="btn mt-8" data-act="finishsetup">Show my dojo</button></div>',false)}
function todayView(){const m=model(), pct=Math.min(100,(S.spent/(m.daily||1))*100), checked=S.lastCheck===today(), over=S.spent>m.daily, xpPct=Math.min(100,(S.xp/nextXP())*100);return shell(top()+'<div class="eyebrow mt-8">Daily training</div><div class="flex justify-between items-end"><div><h1 class="text-3xl font-black mt-1">Your dojo is ready.</h1><p class="muted mt-1">'+m.days+' days until payday</p></div><div class="text-right"><div class="xp">'+S.xp+' XP</div><div class="mini muted">'+belt()+' belt</div></div></div><div class="panel mt-6"><div class="flex justify-between items-start"><div><span class="pill '+m.level+'">'+(m.level==='good'?'ROOM TO BREATHE':m.level==='warn'?'STAY SHARP':'PROTECT RUNWAY')+'</span><div class="text-5xl font-black text-amber-400 mt-4">'+money(m.daily)+'</div><div class="muted text-sm">daily spending guide</div></div><button class="btn ghost !w-auto !py-2 !px-3" data-act="edit">Edit</button></div><div class="progress mt-6"><i style="width:'+pct+'%"></i></div><div class="flex justify-between text-xs muted mt-2"><span>'+money(S.spent)+' spent today</span><span>'+money(Math.max(0,m.daily-S.spent))+' room left</span></div></div><div class="decision mt-5"><div class="eyebrow">🔥 Your daily mission</div><h2 class="text-xl font-black mt-2">Can you afford something?</h2><p class="muted text-sm mt-1">Run a purchase through the dojo before you decide.</p><button class="btn mt-4" data-act="decide">Check a purchase</button></div><div class="panel mt-4"><div class="flex justify-between"><b>Daily check-in</b><span>'+(checked?'✓ Done':'10 XP')+'</span></div><p class="muted text-sm mt-1">Log your flexible spending and keep the streak alive.</p><button class="btn secondary mt-4" data-act="checkin">'+(checked?'Update today':'Complete check-in')+'</button></div><div class="panel mt-4"><div class="flex justify-between"><b>Next skill</b><span class="xp">+15 XP</span></div><p class="muted text-sm mt-1">'+lessons[Math.min(S.completed.length,lessons.length-1)].title+'</p><button class="btn secondary mt-4" data-act="quicklesson">Train for 2 minutes</button></div>')}
function decide(){const m=model();return shell(top()+'<button class="btn ghost mt-7" data-act="today">← Back</button><div class="eyebrow mt-8">Decision dojo</div><h1 class="text-3xl font-black mt-2">Can I afford it?</h1><p class="muted mt-2">No judgement. Just see the trade-off before you choose.</p><label>What are you thinking of spending?<div class="relative"><span class="absolute left-4 top-3.5 text-lg">£</span><input id="purchase" class="field !pl-9 !text-2xl !font-black" type="number" min="0" step="0.01" inputmode="decimal" placeholder="18"></div></label><button class="btn mt-7" data-act="analyse">Show me the trade-off</button><div class="panel mt-5"><b>Current guide: '+money(m.daily)+'/day</b><p class="muted text-sm mt-1">The goal is not “never spend”. It is “know what the spend changes”.</p></div>')}
function decisionResult(){const m=model(),v=Math.max(0,+S.purchase||0),after=Math.max(0,m.available-v),afterDaily=after/m.days,diff=Math.max(0,m.daily-afterDaily),ratio=m.daily? v/m.daily:99;let title='Fits the plan.',body='This purchase does not automatically mean you should buy it. You now know its trade-off.',cls='good';if(ratio>2){title='Big move. Pause first.';body='This purchase is more than two days of your current guide. Give yourself a pause before deciding.';cls='bad'}else if(ratio>1){title='Worth checking.';body='This purchase is more than one day of your current guide. Compare the after-number with the rest of your week.';cls='warn'}return shell(top()+'<button class="btn ghost mt-7" data-act="decide">← New decision</button><div class="eyebrow mt-8">Your trade-off</div><div class="panel mt-4 text-center"><span class="pill '+cls+'">'+title.toUpperCase()+'</span><div class="text-5xl font-black text-amber-400 mt-5">'+money(v)+'</div><p class="muted text-sm">purchase</p><div class="grid grid-cols-2 gap-3 mt-6"><div class="stat"><div class="muted text-xs">Before</div><b class="text-xl">'+money(m.daily)+'</b><div class="muted text-xs">/ day</div></div><div class="stat"><div class="muted text-xs">After</div><b class="text-xl">'+money(afterDaily)+'</b><div class="muted text-xs">/ day</div></div></div></div><div class="decision mt-5"><b class="text-xl">'+title+'</b><p class="muted leading-relaxed mt-2">'+body+'</p><p class="text-sm mt-3">That purchase changes your daily room by <b>'+money(diff)+'</b>.</p></div><div class="grid grid-cols-2 gap-3 mt-5"><button class="btn" data-act="bought">I bought it</button><button class="btn secondary" data-act="skipped">I skipped it</button></div><p class="muted text-xs text-center mt-4">Logging the outcome helps Unidojo learn your behaviour.</p>')}
function checkin(){const m=model();return shell(top()+'<button class="btn ghost mt-7" data-act="today">← Back</button><div class="eyebrow mt-8">Daily quest · +10 XP</div><h1 class="text-3xl font-black mt-2">How much did you spend today?</h1><p class="muted mt-2">Flexible spending only. Essentials are already protected in your plan.</p><label>Today’s flexible spending<input id="spent" class="field !text-2xl !font-black" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(S.spent||'')+'"></label><div class="panel mt-5"><div class="flex justify-between"><span class="muted">Your guide</span><b>'+money(m.daily)+'</b></div><div class="progress mt-3"><i style="width:'+Math.min(100,((S.spent||0)/(m.daily||1))*100)+'%"></i></div></div><button class="btn mt-7" data-act="savecheck">Complete quest</button>')}
function train(){const done=S.completed.length;return shell(top()+'<div class="eyebrow mt-8">Skill tree</div><div class="flex justify-between items-end"><div><h1 class="text-3xl font-black mt-1">Train your money brain.</h1><p class="muted mt-1">One short lesson a day beats one giant lecture.</p></div><span class="xp">'+done+'/7</span></div><div class="panel mt-5"><div class="flex justify-between text-sm"><span>XP to next belt</span><b class="xp">'+S.xp+'/'+nextXP()+'</b></div><div class="progress mt-2"><i style="width:'+Math.min(100,S.xp/nextXP()*100)+'%"></i></div></div><div class="path">'+lessons.map((l,i)=>{const unlocked=i<=done,completed=S.completed.includes(i),current=i===done;return '<button class="lesson '+(completed?'done ':'')+(current?'current ':'')+(!unlocked?'locked':'')+'" data-act="lesson" data-i="'+i+'" '+(!unlocked?'disabled':'')+'><span class="node">'+(completed?'✓':l.icon)+'</span><span class="copy"><span class="eyebrow" style="font-size:9px">'+l.tag+'</span><b class="block text-lg">'+l.title+'</b><span class="muted text-xs">'+(completed?'Mastered · +15 XP':current?'Ready to train':'Locked')+'</span></span><span class="muted">›</span></button>'}).join('')+'</div>')}
function lesson(){const l=lessons[S.lesson],answered=S.answer!==null,correct=answered&&S.answer===l.ans;return shell(top()+'<button class="btn ghost mt-7" data-act="train">← Skill tree</button><div class="eyebrow mt-8">Lesson '+(S.lesson+1)+' of 7 · '+l.tag+'</div><div class="flex items-center gap-3 mt-3"><div class="text-5xl">'+l.icon+'</div><h1 class="text-3xl font-black">'+l.title+'</h1></div><div class="panel mt-6"><b class="text-xl">'+l.title+'</b><p class="muted leading-relaxed mt-3">'+l.text+'</p></div><div class="mt-7"><div class="eyebrow">Quick challenge</div><h2 class="text-xl font-black mt-2">'+l.q+'</h2>'+l.opts.map((o,i)=>'<button class="choice '+(answered?(i===l.ans?'correct ':i===S.answer?'wrong ':''):'')+(S.answer===i?' selected':'')+'" data-act="answer" data-i="'+i+'" '+(answered?'disabled':'')+'><span class="num">'+(i+1)+'</span><span class="flex-1">'+o+'</span>'+(answered&&i===l.ans?'<b class="text-emerald-300">✓</b>':'')+'</button>').join('')+'</div>'+(answered?'<div class="panel mt-5"><b>'+ (correct?'🔥 Nailed it.':'Not quite. Learn the move.')+'</b><p class="muted text-sm mt-2">'+l.tip+'</p></div><button class="btn mt-5" data-act="finishlesson">'+(S.completed.includes(S.lesson)?'Back to skill tree':'Claim +15 XP')+'</button>':'')+'</div>')}
function dojo(){const xpPct=Math.min(100,S.xp/nextXP()*100),next=lessons[Math.min(S.completed.length,lessons.length-1)];return shell(top()+'<div class="eyebrow mt-8">Your dojo</div><h1 class="text-3xl font-black mt-1">Build the streak.</h1><div class="panel mt-6 flex items-center gap-5"><div class="ring" style="--pct:'+xpPct+'%"><span>'+S.xp+'</span></div><div><div class="eyebrow">Current rank</div><b class="text-2xl">'+belt()+' belt</b><p class="muted text-sm mt-1">'+Math.max(0,nextXP()-S.xp)+' XP to next level</p></div></div><div class="grid grid-cols-3 gap-2 mt-4"><div class="stat text-center"><b class="text-xl">🔥 '+S.streak+'</b><div class="muted text-xs">streak</div></div><div class="stat text-center"><b class="text-xl">'+S.completed.length+'/7</b><div class="muted text-xs">lessons</div></div><div class="stat text-center"><b class="text-xl">'+S.decisions.length+'</b><div class="muted text-xs">decisions</div></div></div><div class="panel mt-4"><div class="eyebrow">Next up</div><b class="block text-xl mt-1">'+next.title+'</b><p class="muted text-sm mt-1">'+next.text.slice(0,90)+'…</p><button class="btn mt-4" data-act="quicklesson">Continue training</button></div><button class="btn ghost mt-4" data-act="reset">Reset my dojo</button>')}
function render(){if(!S.profile)return S.booted?$('#app').innerHTML=setup(1):$('#app').innerHTML=welcome();let v=S.tab==='today'?todayView():S.tab==='train'?train():dojo();$('#app').innerHTML=v}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function act(a,e){try{
 if(a==='setup'){S.booted=true;render();return}
 if(a==='setup1'){render();return}
 if(a==='setup2'){const b=+document.getElementById('balance').value,p=document.getElementById('payday').value;if(!Number.isFinite(b)||b<0||!p){toast('Add your balance and payday');return}if(p<today()){toast('Choose a future payday');return}S.profile={...(S.profile||{}),balance:b,payday:p};save();$('#app').innerHTML=setup(2);return}
 if(a==='finishsetup'){S.profile={...(S.profile||{}),bills:+document.getElementById('bills').value||0,buffer:+document.getElementById('buffer').value||0};S.booted=true;S.tab='today';save();render();return}
 if(a==='edit'){S.booted=true;$('#app').innerHTML=setup(1);return}
 if(a==='today'){S.tab='today';S.answer=null;render();return}
 if(a==='train'){S.tab='train';S.answer=null;render();return}
 if(a==='dojo'){S.tab='dojo';render();return}
 if(a==='checkin'){renderCheckin();return}
 if(a==='savecheck'){const v=+document.getElementById('spent').value;if(!Number.isFinite(v)||v<0){toast('Enter a valid amount');return}const was=S.lastCheck===today();S.spent=v;if(!was){S.xp+=10;const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.lastCheck===yesterday?S.streak+1:1;S.lastCheck=today();toast('Quest complete · +10 XP')}else toast('Check-in updated');save();S.tab='today';render();return}
 if(a==='decide'){S.purchase=null;$('#app').innerHTML=decide();return}
 if(a==='analyse'){const v=+document.getElementById('purchase').value;if(!Number.isFinite(v)||v<0){toast('Enter a purchase amount');return}S.purchase=v;save();$('#app').innerHTML=decisionResult();return}
 if(a==='bought'||a==='skipped'){S.decisions.push({date:today(),amount:+S.purchase||0,outcome:a});if(a==='bought'){S.spent+=+S.purchase||0;toast('Logged · reality beats guessing')}else toast('Good call · decision logged');save();S.tab='today';render();return}
