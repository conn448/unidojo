<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Unidojo</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#080808;--p:#151515;--p2:#1d1d1d;--line:#303030;--t:#fff;--m:#9ca3af;--g:#f5b51b;--g2:#b87900;--ok:#35d399;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:500px;margin:auto;min-height:100vh;padding:18px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:950}.brand span,.gold{color:var(--g)}.muted{color:var(--m)}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:var(--g)}h1{font-size:32px;line-height:1.02;margin:8px 0}h2{margin:8px 0}.panel,.decision,.mission{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:18px}.decision{border:2px solid var(--g);background:#1d1708}.mission{background:#171309;border-color:#594715}.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;background:var(--g);color:#111;font:inherit;font-weight:950;cursor:pointer;margin-top:14px;box-shadow:0 4px 0 var(--g2)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}.secondary{background:#292929;color:#fff;box-shadow:0 4px 0 #000}.ghost{background:transparent;color:var(--m);border:1px solid var(--line);box-shadow:none}.field{width:100%;margin-top:7px;padding:14px;border-radius:12px;border:1px solid #444;background:#0b0b0b;color:#fff;font:inherit}.field:focus{outline:2px solid var(--g)}label{display:block;margin-top:17px;font-size:13px;font-weight:850}.big{font-size:48px;font-weight:950}.pill,.tag{display:inline-block;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:950}.tag{border:1px solid #3b3b3b;color:#aaa}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.progress{height:9px;background:#292929;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b0b0b;border-top:1px solid var(--line);z-index:10}.bottom-in{max-width:500px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom button{border:0;background:transparent;color:#777;padding:11px 4px;font:inherit;font-size:10px;font-weight:850;cursor:pointer}.bottom button.active{color:var(--g)}.bottom b{display:block;font-size:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#111;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.choice{display:block;width:100%;margin-top:10px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--p);color:#fff;text-align:left;font:inherit;cursor:pointer}.choice.correct{border-color:var(--ok)}.choice.wrong{border-color:var(--bad)}.node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#282828;border:3px solid #3b3b3b;font-size:20px;flex:none}.lesson{display:flex;gap:13px;align-items:center;width:100%;padding:12px 3px;background:transparent;color:#fff;border:0;text-align:left;cursor:pointer}.lesson:disabled{opacity:.3}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--g);color:#111;padding:10px 15px;border-radius:99px;font-weight:950;z-index:99;display:none}.toast.show{display:block}.small{font-size:12px}
</style></head><body><div id="toast" class="toast"></div><main id="app"></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),KEY='unidojo-duo-v5',day=()=>new Date().toISOString().slice(0,10),money=n=>'£'+Math.max(0,+n||0).toFixed(2),days=d=>Math.max(1,Math.ceil((new Date(d)-new Date(day()))/864e5));
const L=[
['Runway maths','🏃','FOUNDATION','You need to distinguish cash on hand from money genuinely available for flexible spending.',['£420 cash, £300 rent due, £50 protected buffer, 7 days to payday. What is flexible runway?'],['£10/day','£17.14/day','£60/day','£70/day'],1],
['Net income','🧾','INCOME','Gross income is not the same as spendable income. Your plan should be based on what actually reaches your account.',['A graduate is offered £30,000 gross. Which figure belongs in the monthly spending plan?'],['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],
['Opportunity cost','⚔️','DECISIONS','A purchase consumes scarce resources. The cost includes the best alternative use you give up.',['You have £90 flexible money. Spending £45 on a night out means the £45 cannot fund another goal this week. What concept is this?'],['Liquidity','Opportunity cost','Inflation','Compound interest'],1],
['Credit comparison','💳','CREDIT','Headline interest rates can hide compulsory charges. Compare the total borrowing cost, not just the attractive number.',['Two cards advertise 19%. A has no mandatory fee; B has a compulsory £60 annual fee. What should you compare?'],['Only the headline rate','APR / total cost of borrowing','Minimum payment only','The lender brand'],1],
['Real returns','📈','ECONOMICS','Nominal returns are not the same as changes in purchasing power. Inflation matters when judging what your money actually gains.',['Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…'],['7%','4%','1%','3%'],2],
['Compounding','🌱','INVESTING','Compounding lets previous returns contribute to future returns. Time can therefore be a major variable.',['Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?'],['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],
['Buffer design','🧱','RESILIENCE','A buffer is a shock absorber. Its value is avoiding expensive or forced decisions when something goes wrong.',['You have £250 cash, irregular income and rely on a laptop for university. Which use of the next £100 is most defensible with no emergency reserve?'],['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],
['Behaviour design','🧠','BEHAVIOUR','A system that is theoretically perfect but abandoned is worse than a simpler system you repeatedly follow.',['You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?'],['Make the spreadsheet longer','Create a realistic weekly rule + default cheap option','Stop tracking entirely','Set an impossible target'],1],
['Concentration risk','🎯','INVESTING','Diversification reduces concentration risk but cannot remove market risk.',['Which portfolio has the clearest concentration risk?'],['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],
['Debt vs investing','💰','CREDIT','Borrowing has a known cost while investment returns are uncertain. Compare guaranteed costs with risk-adjusted expected outcomes.',['You can clear a £600 high-APR card balance or invest the same £600. What should you compare first?'],['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],
['Weekly reset','🥋','MASTERY','Good financial systems learn from deviations. Identify the largest controllable variance, then change the behaviour rather than inventing a fantasy target.',['Plan: £120 flexible spend. Actual: £154. Food +£8, transport +£4, social +£22. Best first intervention?'],['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1]
];
const MISS=[['REAL DECISION','Log one genuine purchase decision.',25],['RUNWAY CHECK','Check your daily room before your next non-essential purchase.',20],['NO-REGRET MOVE','Skip or downgrade one non-essential purchase and log it.',35],['SPEND AUDIT','Log today’s flexible spending.',20],['BEAT YOUR BASELINE','Finish today below your own recent average.',40]];
const W=[['CONTROLLED WEEK',5,120],['DECISION MAKER',4,100],['NO-REGRET',3,110],['TRAINING WEEK',3,100]];
let S={profile:null,tab:'today',view:null,xp:0,streak:0,best:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,purchase:0,missionDay:null,missionDone:false,skips:0,saved:0,weekly:[0,0,0,0],lastVisit:null};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function M(){let p=S.profile||{},d=days(p.payday),a=Math.max(0,(+p.balance||0)-(+p.bills||0)-(+p.buffer||0));return{d,a,daily:a/d}}function belt(){return S.xp>=600?'BLACK':S.xp>=350?'RED':S.xp>=180?'BLUE':S.xp>=70?'GREEN':'WHITE'}function next(){return S.xp<70?70:S.xp<180?180:S.xp<350?350:S.xp<600?600:1000}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function nav(){return '<nav class="bottom"><div class="bottom-in">'+[['today','🏠','Today'],['train','🥋','Train'],['dojo','🏆','Dojo']].map(x=>'<button data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></nav>'}function shell(x,n=true){return '<div class="app">'+x+(n?nav():'')+'</div>'}function top(){return '<div class="top"><div class="brand">uni<span>dojo</span></div><div>🔥 '+S.streak+' &nbsp; ♥ '+S.hearts+'</div></div>'}
function welcome(){return shell(top()+'<div style="padding-top:55px"><div style="font-size:70px">🥋</div><div class="eyebrow" style="margin-top:20px">Money training for students</div><h1 style="font-size:45px">Get good with<br><span class="gold">your money.</span></h1><p class="muted" style="font-size:18px;line-height:1.5">Real money decisions. Serious financial skills. A game that gets harder as you get better.</p><div class="mission"><b>FIRST QUEST</b><p class="muted">Set your runway, beat a proper finance challenge and earn your first belt.</p><span class="tag">+25 XP</span> <span class="tag">🔥 streak</span> <span class="tag">🧠 harder questions</span></div><button class="btn" data-act="setup">Start training</button><p class="muted small" style="text-align:center">Private on this device · No bank link</p></div>',false)}
function setup(s){let p=S.profile||{};if(s===1)return shell(top()+'<div style="margin-top:35px"><div class="eyebrow">Training setup · 1/2</div><h1>Know your starting point.</h1><p class="muted">We turn your real numbers into a personal runway.</p><label>Current balance<input id="balance" class="field" type="number" min="0" step=".01" value="'+(p.balance??'')+'" placeholder="180"></label><label>Next payday / income<input id="payday" class="field" type="date" min="'+day()+'" value="'+(p.payday||'')+'"></label><button class="btn" data-act="setup2">Continue</button></div>',false);return shell(top()+'<button class="btn ghost" data-act="setup">← Back</button><div style="margin-top:28px"><div class="eyebrow">Training setup · 2/2</div><h1>Protect the essentials.</h1><p class="muted">Only include money you should not casually spend before payday.</p><label>Essentials due<input id="bills" class="field" type="number" min="0" step=".01" value="'+(p.bills??'')+'" placeholder="40"></label><label>Protected buffer<input id="buffer" class="field" type="number" min="0" step=".01" value="'+(p.buffer??'')+'" placeholder="20"></label><button class="btn" data-act="finish">Enter the dojo</button></div>',false)}
function missionCard(){let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length],done=S.missionDay===day()&&S.missionDone;return '<div class="mission"><div class="eyebrow">🎯 TODAY’S MISSION · +'+q[2]+' XP</div><h2>'+q[0]+'</h2><p class="muted">'+q[1]+'</p><span class="pill '+(done?'good':'warn')+'">'+(done?'COMPLETED':'IN PROGRESS')+'</span><button class="btn '+(done?'secondary':'')+'" data-act="mission">'+(done?'Review mission':'Start mission')+'</button></div>'}
function today(){let m=M(),left=Math.max(0,m.daily-S.spent);return shell(top()+'<div class="eyebrow" style="margin-top:27px">Your money game</div><h1>Beat your own baseline.</h1><p class="muted">'+m.d+' days until payday · '+belt()+' belt</p><div class="panel"><span class="pill '+(m.daily>=15?'good':m.daily>=7?'warn':'bad')+'">'+(m.daily>=15?'ROOM TO BREATHE':m.daily>=7?'STAY SHARP':'PROTECT RUNWAY')+'</span><div class="big gold">'+money(m.daily)+'</div><div class="muted">flexible room / day</div><div class="progress" style="margin-top:17px"><i style="width:'+Math.min(100,S.spent/(m.daily||1)*100)+'%"></i></div><p class="small muted">'+money(S.spent)+' logged today · '+money(left)+' room remaining</p></div><div style="margin-top:14px">'+missionCard()+'</div><div class="decision" style="margin-top:14px"><div class="eyebrow">⚔️ REAL-WORLD PLAY</div><h2>Can I afford something?</h2><p class="muted">See the consequence before you decide. Then log what actually happened.</p><button class="btn" data-act="decide">Make a decision</button></div><div class="grid2" style="margin-top:10px"><div class="stat"><b class="gold">'+S.xp+'</b><br><small class="muted">XP</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">decisions</small></div></div><div class="panel" style="margin-top:10px"><b>Daily check-in</b><p class="muted small">Keep your streak alive and teach Unidojo what your real week looks like.</p><button class="btn secondary" data-act="checkin">'+(S.lastCheck===day()?'Update today':'Complete check-in')+'</button></div>')}
function decide(){return shell(top()+'<button class="btn ghost" data-act="today">← Back</button><div class="eyebrow" style="margin-top:25px">Decision dojo</div><h1>Can I afford it?</h1><p class="muted">No judgement. We test the trade-off.</p><label>Purchase amount<input id="purchase" class="field" type="number" min="0" step=".01" placeholder="24.50" style="font-size:25px;font-weight:900"></label><button class="btn" data-act="analyse">Show the trade-off</button><div class="panel" style="margin-top:16px"><b>What you are training</b><p class="muted small">Not “spend as little as possible”. The skill is understanding what a purchase does to the rest of your week.</p></div>')}
function result(){let m=M(),v=S.purchase,a=Math.max(0,m.a-v),after=a/m.d,ratio=m.daily?v/m.daily:99;return shell(top()+'<button class="btn ghost" data-act="decide">← New decision</button><div class="eyebrow" style="margin-top:25px">Your trade-off</div><div class="panel" style="text-align:center"><span class="pill '+(ratio>2?'bad':ratio>1?'warn':'good')+'">'+(ratio>2?'BIG MOVE · PAUSE':ratio>1?'TRADE-OFF · CHECK':'FITS THE PLAN')+'</span><div class="big gold">'+money(v)+'</div><div class="muted">purchase</div><div class="grid2" style="margin-top:18px"><div class="stat"><small class="muted">Before</small><br><b>'+money(m.daily)+'</b>/day</div><div class="stat"><small class="muted">After</small><br><b>'+money(after)+'</b>/day</div></div></div><div class="decision" style="margin-top:14px"><b>'+ (ratio>2?'This is more than two days of current room.':ratio>1?'This costs more than one day of current room.':'This sits inside your current daily room.')+'</b><p class="muted small">Daily flexibility changes by <b>'+money(Math.max(0,m.daily-after))+'</b>.</p></div><div class="grid2"><button class="btn" data-act="bought">I bought it</button><button class="btn secondary" data-act="skipped">I skipped / downgraded</button></div>')}
function checkin(){let m=M();return shell(top()+'<button class="btn ghost" data-act="today">← Back</button><div class="eyebrow" style="margin-top:25px">Daily quest · +10 XP</div><h1>How much did you spend today?</h1><p class="muted">Flexible spending only. This is data, not a judgement.</p><label>Today’s flexible spending<input id="spent" class="field" type="number" min="0" step=".01" value="'+S.spent+'"></label><div class="panel" style="margin-top:14px"><span class="muted">Personal guide</span><b style="float:right">'+money(m.daily)+'</b></div><button class="btn" data-act="savecheck">Complete quest</button>')}
function train(){return shell(top()+'<div class="eyebrow" style="margin-top:25px">Skill tree · university mode</div><h1>Train your money brain.</h1><p class="muted">No primary-school arithmetic. These questions test judgement.</p><div class="panel"><b>'+S.xp+' XP</b><span class="gold" style="float:right">'+belt()+' BELT</span><div class="progress" style="margin-top:12px"><i style="width:'+Math.min(100,S.xp/next()*100)+'%"></i></div><p class="small muted">'+Math.max(0,next()-S.xp)+' XP to next belt</p></div><div style="margin-top:12px">'+L.map((l,i)=>{let open=i<=S.completed.length,done=S.completed.includes(i);return '<button class="lesson" data-act="lesson" data-i="'+i+'" '+(!open?'disabled':'')+'><span class="node">'+(done?'✓':l[1])+'</span><span><span class="eyebrow">'+l[2]+'</span><br><b>'+l[0]+'</b><br><small class="muted">'+(done?'Mastered':'+'+15+' XP · challenge')+'</small></span></button>'}).join('')+'</div>')}
function lesson(){let l=L[S.lesson],ans=S.answer!==null;return shell(top()+'<button class="btn ghost" data-act="train">← Skill tree</button><div class="eyebrow" style="margin-top:25px">Challenge '+(S.lesson+1)+' / '+L.length+' · '+l[2]+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="panel"><p class="muted">'+l[3]+'</p></div><h2 style="margin-top:22px">'+l[4][0]+'</h2>'+l[5].map((o,i)=>'<button class="choice '+(ans?(i===l[6]?'correct':i===S.answer?'wrong':''):'')+'" data-act="answer" data-i="'+i+'" '+(ans?'disabled':'')+'>'+(i+1)+'. &nbsp;'+o+'</button>').join('')+(ans?'<div class="panel" style="margin-top:14px"><b>'+(S.answer===l[6]?'🔥 Correct.':'Not quite.')+'</b><p class="muted small">Correct answer: '+l[5][l[6]]+'.</p></div><button class="btn" data-act="finish">'+(S.completed.includes(S.lesson)?'Back to tree':'Claim XP')+'</button>':'') )}
function mission(){let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length],m=M();return shell(top()+'<button class="btn ghost" data-act="today">← Back</button><div class="eyebrow" style="margin-top:25px">Daily mission · +'+q[2]+' XP</div><h1>'+q[0]+'</h1><div class="mission"><p class="muted">'+q[1]+'</p><button class="btn" data-act="missionAction">'+(S.missionDone?'Completed':'Do it now')+'</button></div><div class="panel" style="margin-top:14px"><b>Why this exists</b><p class="muted small">The app should change behaviour in real life. Your score comes from doing, not merely reading.</p></div>')}
function dojo(){let avg=S.decisions.length?S.decisions.reduce((a,x)=>a+x.amount,0)/S.decisions.length:0;return shell(top()+'<div class="eyebrow" style="margin-top:25px">Your dojo</div><h1>'+belt()+' belt</h1><div class="panel"><div class="big gold">'+S.xp+'</div><p class="muted">'+Math.max(0,next()-S.xp)+' XP to next belt</p></div><div class="grid2" style="margin-top:10px"><div class="stat"><b>🔥 '+S.best+'</b><br><small class="muted">best streak</small></div><div class="stat"><b>'+S.completed.length+'/'+L.length+'</b><br><small class="muted">skills</small></div><div class="stat"><b>'+S.decisions.length+'</b><br><small class="muted">decisions</small></div><div class="stat"><b>'+money(S.saved)+'</b><br><small class="muted">avoided spend</small></div></div><div class="panel" style="margin-top:12px"><b>🏫 HWU Money League</b><p class="muted small">Anonymous score rewards consistency, learning and deliberate decisions — not wealth.</p><div class="big">#'+Math.max(1,1000-Math.round(S.xp*.7+S.streak*12+S.decisions.length*9+S.skips*7))+'</div><small class="muted">provisional rank</small></div><div class="panel" style="margin-top:12px"><b>Weekly quests</b>'+W.map((w,i)=>'<div style="margin-top:13px"><b>'+w[0]+'</b><span class="gold" style="float:right">'+Math.min(w[1],S.weekly[i]||0)+'/'+w[1]+'</span><div class="progress" style="margin-top:6px"><i style="width:'+Math.min(100,(S.weekly[i]||0)/w[1]*100)+'%"></i></div><small class="muted">+'+w[2]+' XP</small></div>').join('')+'</div><button class="btn ghost" data-act="reset">Reset local data</button>')}
function render(){if(!S.profile){$('#app').innerHTML=welcome();return}let h=S.view==='setup1'?setup(1):S.view==='setup2'?setup(2):S.view==='decide'?decide():S.view==='result'?result():S.view==='checkin'?checkin():S.view==='lesson'?lesson():S.view==='mission'?mission():S.tab==='train'?train():S.tab==='dojo'?dojo():today();$('#app').innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.tab;S.view=null;save();render()});document.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>act(x.dataset.act,x))}
function act(a,e){if(a==='setup'){S.view='setup1';return render()}if(a==='setup2'){let b=+$('#balance').value,p=$('#payday').value;if(!p||b<0){toast('Enter balance and payday');return}S.profile={...(S.profile||{}),balance:b,payday:p};S.view='setup2';return render()}if(a==='finish'){S.profile={...S.profile,bills:+$('#bills').value||0,buffer:+$('#buffer').value||0};S.tab='today';save();toast('Dojo unlocked');return render()}if(a==='today'){S.view=null;S.tab='today';return render()}if(a==='train'){S.view=null;S.tab='train';return render()}if(a==='dojo'){S.view=null;S.tab='dojo';return render()}if(a==='decide'){S.view='decide';return render()}if(a==='analyse'){let v=+$('#purchase').value;if(!v||v<0)return toast('Enter a purchase amount');S.purchase=v;S.view='result';return render()}if(a==='bought'||a==='skipped'){S.decisions.push({date:day(),amount:S.purchase,outcome:a});if(a==='skipped'){S.skips++;S.saved+=S.purchase}S.weekly[1]=(S.weekly[1]||0)+1;S.xp+=10;let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length];if(!S.missionDone&&(q[0]==='REAL DECISION'||q[0]==='NO-REGRET MOVE')){S.missionDone=true;S.missionDay=day();S.xp+=q[2]}save();S.view=null;S.tab='today';render();return toast('Decision logged · XP earned')}if(a==='checkin'){S.view='checkin';return render()}if(a==='savecheck'){let v=+$('#spent').value;if(v<0||!Number.isFinite(v))return toast('Enter a valid amount');if(S.lastCheck!==day()){let prev=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastCheck===prev?S.streak+1:1;S.best=Math.max(S.best,S.streak);S.lastCheck=day();S.xp+=10;S.weekly[0]=(S.weekly[0]||0)+1}S.spent=v;let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length];if(!S.missionDone&&q[0]==='SPEND AUDIT'){S.missionDone=true;S.missionDay=day();S.xp+=q[2]}save();S.view=null;S.tab='today';render();return toast('🔥 '+S.streak+' day streak')}if(a==='lesson'){S.lesson=+e.dataset.i;S.answer=null;S.view='lesson';return render()}if(a==='answer'){if(S.answer!==null)return;S.answer=+e.dataset.i;if(S.answer!==L[S.lesson][6])S.hearts=Math.max(0,S.hearts-1);save();return render()}if(a==='finish'){if(S.answer!==L[S.lesson][6]){S.answer=null;return render()}if(!S.completed.includes(S.lesson)){S.completed.push(S.lesson);S.xp+=15;S.weekly[2]=(S.weekly[2]||0)+1}S.answer=null;S.view=null;S.tab='train';save();render();return toast('+15 XP · skill mastered')}if(a==='quick'){S.lesson=Math.min(S.completed.length,L.length-1);S.answer=null;S.view='lesson';return render()}if(a==='mission'){S.view='mission';return render()}if(a==='missionAction'){if(S.missionDone)return toast('Already complete');let q=MISS[Math.floor(new Date(day()).getTime()/864e5)%MISS.length];if(q[0]==='REAL DECISION'||q[0]==='NO-REGRET MOVE'){S.view='decide';return render()}if(q[0]==='SPEND AUDIT'){S.view='checkin';return render()}S.missionDone=true;S.missionDay=day();S.xp+=q[2];save();S.view=null;S.tab='today';render();return toast('Mission complete · +'+q[2]+' XP')}if(a==='reset'){if(confirm('Reset all local Unidojo data?')){localStorage.removeItem(KEY);location.reload()}}}
if(S.lastVisit!==day()){S.lastVisit=day();if(S.missionDay!==day())S.missionDone=false;save()}render();})();
</script></body></html>
