<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--card:#141414;--card2:#101010;--line:#292929;--text:#fff;--muted:#929292;--orange:#ff8a00;--gold:#ffb000;--green:#35d399;--red:#ff5d73;--blue:#62a8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding:20px 17px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px}.logo i{color:var(--orange);font-style:normal}.chips{display:flex;gap:7px}.chip{background:#171717;border:1px solid #303030;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:900}.eyebrow{color:var(--orange);font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.muted{color:var(--muted)}h1{font-size:42px;line-height:.96;letter-spacing:-2px;margin:8px 0 14px}h2{letter-spacing:-.7px}.orange{color:var(--orange)}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:22px;padding:19px;margin-top:14px}.hero{padding:24px}.big{font-size:54px;font-weight:950;letter-spacing:-3px}.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px 18px;margin-top:13px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#111;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #a95500}.btn:active{transform:translateY(3px);box-shadow:none}.ghost{background:#171717;color:#fff;border:1px solid #333;box-shadow:none}.danger{color:#ff8998;border-color:#51232c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d0d0d;border:1px solid #292929;border-radius:16px;padding:13px;text-align:center}.field{width:100%;padding:15px;margin-top:7px;background:#090909;border:1px solid #3b3b3b;border-radius:13px;color:#fff}.label{display:block;margin-top:16px;font-size:13px;font-weight:800}.choice{display:block;width:100%;text-align:left;background:#111;color:#fff;border:2px solid #2d2d2d;border-radius:15px;padding:15px;margin-top:10px;cursor:pointer}.choice:hover{border-color:#666}.game{display:block;width:100%;text-align:left;color:#fff;background:linear-gradient(145deg,#171717,#0e0e0e);border:1px solid #303030;border-radius:20px;padding:18px;margin-top:11px;cursor:pointer}.game:hover{border-color:#666;transform:translateY(-1px)}.game b{font-size:30px;float:right}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--gold))}.nav{position:fixed;bottom:0;left:0;right:0;background:#090909f2;border-top:1px solid #252525;z-index:10}.navin{max-width:540px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:#777;padding:9px 4px;font-size:10px;font-weight:900;cursor:pointer}.nav button.active{color:var(--orange)}.nav strong{display:block;font-size:20px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 16px;border-radius:99px;font-weight:900;display:none;z-index:30;white-space:nowrap}.toast.show{display:block}.center{text-align:center}.tag{display:inline-block;background:#241a0b;color:#ffc15c;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:900}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modalbox{width:min(540px,100%);background:#111;border:1px solid #333;border-radius:26px 26px 0 0;padding:24px 18px 30px;max-height:92vh;overflow:auto}.close{float:right;background:#222;color:#fff;border:1px solid #333;border-radius:50%;width:34px;height:34px;cursor:pointer}.pill{display:inline-block;border:1px solid #333;background:#171717;padding:7px 10px;border-radius:99px;font-size:11px;font-weight:900}.stock{background:#111;border:1px solid #292929;border-radius:17px;padding:14px;margin-top:9px}.stockrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.up{color:var(--green)}.down{color:var(--red)}.mini{font-size:12px}.notice{background:#19130a;border:1px solid #4c3515;color:#ffc96a;border-radius:14px;padding:12px;font-size:12px;margin-top:12px}.accountbar{font-size:11px;color:#aaa;text-align:right;margin:-18px 0 18px}.link{color:var(--orange);font-weight:900;cursor:pointer;border:0;background:none;padding:0}.onboard{min-height:100vh;display:flex;align-items:center}.onboard .card{width:100%}.dots{display:flex;gap:6px;margin:16px 0}.dot{width:28px;height:5px;background:#2c2c2c;border-radius:99px}.dot.on{background:var(--orange)}
</style>
</head>
<body>
<div id="toast" class="toast"></div><main id="app"><div class="app"><div class="eyebrow">UNIDOJO</div><h1>Loading your<br><span class="orange">dojo…</span></h1></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){'use strict';
var SB_URL=window.UNIDOJO_SUPABASE_URL||'';var SB_KEY=window.UNIDOJO_SUPABASE_KEY||'';var sb=null;var authUser=null;var configured=SB_URL.indexOf('YOUR_')!==0&&SB_KEY.indexOf('YOUR_')!==0;
if(configured&&window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
var key='unidojo-v9';
var state={screen:'home',step:0,onboarding:false,accountGate:false,guest:true,name:'',age:'',income:0,rent:0,weeklySpend:0,goal:'',confidence:3,xp:0,streak:0,decisions:0,saved:0,lesson:0,game:null,round:0,score:0,pending:0,cash:10000,holdings:{}};
try{var old=JSON.parse(localStorage.getItem(key));if(old)state=Object.assign(state,old)}catch(e){}
function saveLocal(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1600)}
function belt(){return state.xp>=800?'BLACK':state.xp>=450?'RED':state.xp>=220?'BLUE':state.xp>=80?'GREEN':'WHITE'}
function top(){return '<div class="top"><div class="logo">uni<i>dojo</i></div><div class="chips"><span class="chip">🔥 '+state.streak+'</span><span class="chip">⚡ '+state.xp+'</span></div></div>'}
function nav(){return '<div class="nav"><div class="navin"><button data-screen="home" class="'+(state.screen==='home'?'active':'')+'"><strong>⌂</strong>Today</button><button data-screen="train" class="'+(state.screen==='train'?'active':'')+'"><strong>◈</strong>Train</button><button data-screen="markets" class="'+(state.screen==='markets'?'active':'')+'"><strong>↗</strong>Markets</button><button data-screen="profile" class="'+(state.screen==='profile'?'active':'')+'"><strong>♛</strong>Dojo</button></div></div>'}
function shell(body){return '<div class="app">'+top()+'<div class="accountbar">'+(authUser?'Saved to account · <button class="link" data-action="signout">Sign out</button>':'Guest mode · <button class="link" data-action="account">Create account</button>')+'</div>'+body+'</div>'+nav()}
function onboarding(){var steps=[
['What should we call you?','A name helps your dojo feel like yours.','name','text','Your name'],
['What is your money situation?','Rough numbers are fine. This is about building your starting profile.','money','',''],
['What matters most right now?','Pick the thing you most want Unidojo to help with.','goal','',''],
['How confident are you with money?','No wrong answer. This changes where your training starts.','confidence','','']];var s=steps[state.step];var body='<div class="onboard"><div class="card hero"><div class="eyebrow">WELCOME TO UNIDOJO</div><div class="dots">'+[0,1,2,3].map(function(i){return '<span class="dot '+(i<=state.step?'on':'')+'"></span>'}).join('')+'</div><h1>'+s[0]+'</h1><p class="muted">'+s[1]+'</p>';
if(s[2]==='name')body+='<input id="on-name" class="field" value="'+esc(state.name)+'" placeholder="First name">';
if(s[2]==='money')body+='<label class="label">Monthly money coming in<input id="on-income" class="field" type="number" value="'+(state.income||'')+'" placeholder="850"></label><label class="label">Monthly rent<input id="on-rent" class="field" type="number" value="'+(state.rent||'')+'" placeholder="750"></label><label class="label">Typical weekly spending<input id="on-spend" class="field" type="number" value="'+(state.weeklySpend||'')+'" placeholder="100"></label>';
if(s[2]==='goal')body+='<button class="choice" data-goal="Build a buffer">Build a buffer</button><button class="choice" data-goal="Stop wasting money">Stop wasting money</button><button class="choice" data-goal="Understand investing">Understand investing</button><button class="choice" data-goal="Get confident with money">Get confident with money</button>';
if(s[2]==='confidence')body+='<button class="choice" data-confidence="1">😬 I mostly guess</button><button class="choice" data-confidence="2">I know the basics</button><button class="choice" data-confidence="3">I\'m reasonably confident</button><button class="choice" data-confidence="4">I\'m already pretty good</button><button class="choice" data-confidence="5">I want the hard stuff</button>';
if(s[2]==='money'||s[2]==='name')body+='<button class="btn" data-action="onnext">Continue →</button>';body+='</div></div>';return '<div class="app">'+body+'</div>'}
function accountGate(){return '<div class="modal"><div class="modalbox"><button class="close" data-action="closemodal">×</button><div class="eyebrow">YOUR PROGRESS</div><h1>Keep your<br><span class="orange">dojo.</span></h1><p class="muted">Your profile, XP, streak, decisions and paper portfolio can be saved across devices with a free account.</p><button class="btn" data-action="signup">Create free account</button><button class="btn ghost" data-action="login">I already have an account</button><button class="btn ghost" data-action="guest">Keep trying without an account</button><p class="muted mini">Guest mode works now, but your progress stays on this browser until you create an account.</p></div></div>'}
function authModal(mode){return '<div class="modal"><div class="modalbox"><button class="close" data-action="closemodal">×</button><div class="eyebrow">'+(mode==='signup'?'CREATE ACCOUNT':'WELCOME BACK')+'</div><h1>'+(mode==='signup'?'Save your dojo.':'Continue training.')+'</h1><label class="label">Email<input id="auth-email" class="field" type="email" autocomplete="email" placeholder="you@example.com"></label><label class="label">Password<input id="auth-password" class="field" type="password" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" placeholder="At least 6 characters"></label>'+(mode==='signup'?'<label class="label">Name<input id="auth-name" class="field" value="'+esc(state.name)+'" placeholder="First name"></label>':'')+'<button class="btn" data-action="submit-'+mode+'">'+(mode==='signup'?'Create account':'Sign in')+' →</button><p id="auth-error" class="muted mini"></p></div></div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function home(){var name=state.name?esc(state.name):'there';return shell('<div class="eyebrow">DAY '+Math.max(1,state.streak||1)+' · '+belt()+' BELT</div><h1>Hey '+name+'.<br><span class="orange">Let's play.</span></h1><div class="card hero"><div class="eyebrow">TODAY\'S MISSION</div><h2>Make one better money decision.</h2><p class="muted">Train with a real purchase, then see exactly what it costs your future self.</p><button class="btn" data-action="decision">Start decision →</button></div><div class="eyebrow" style="margin-top:28px">PLAY</div><button class="game" data-action="games"><b>🐍</b><div class="eyebrow">ARCADE</div><h2>Money Snake</h2><p class="muted">Five fast financial decisions. Beat your high score.</p></button><div class="eyebrow" style="margin-top:25px">TRAIN</div><div class="card"><h2>Next skill: '+(state.goal==='Understand investing'?'How stocks actually work':'Opportunity cost')+'</h2><p class="muted">A proper lesson, then a decision that tests it.</p><button class="btn ghost" data-screen="train">Train →</button></div><div class="grid" style="margin-top:12px"><div class="stat"><b class="orange">'+state.decisions+'</b><br><small class="muted">real decisions</small></div><div class="stat"><b>£'+Number(state.saved||0).toFixed(0)+'</b><br><small class="muted">spend avoided</small></div></div>');}
function decision(){return shell('<button class="btn ghost" data-screen="home">← Back</button><div style="margin-top:25px"><div class="eyebrow">REAL-WORLD MODE</div><h1>Can I afford it?</h1><p class="muted">No judgement. Just the trade-off.</p><label class="label">Purchase amount<input id="amount" class="field" type="number" min="0" placeholder="18"></label><div class="card"><div class="eyebrow">YOUR PROFILE</div><p><b>Weekly spending:</b> £'+Number(state.weeklySpend||0).toFixed(0)+'</p><p><b>Monthly rent:</b> £'+Number(state.rent||0).toFixed(0)+'</p><p class="muted">The point isn't to tell you what you can or can't buy. It's to make the trade-off visible.</p></div><button class="btn" data-action="analyse">Show consequence →</button></div>');}
function consequence(){var v=Number(document.getElementById('amount').value)||0;state.pending=v;var weekly=Number(state.weeklySpend||0);var days=weekly?Math.max(0,(weekly-v)/Math.max(1,weekly)*7):0;return shell('<button class="btn ghost" data-action="decision">← Change amount</button><div style="margin-top:25px"><div class="eyebrow">THE TRADE-OFF</div><h1>£'+v.toFixed(2)+' <span class="orange">spent.</span></h1><div class="card hero"><div class="eyebrow">IF YOU SPEND IT</div><h2>'+ (weekly?('That is '+(v/weekly*7).toFixed(1)+' days of your typical weekly spending.'): 'That is money that cannot fund something else.') +'</h2><p class="muted">Knowing the cost doesn't make the decision for you. It makes the decision deliberate.</p></div><div class="grid"><button class="btn" data-action="bought">I bought it</button><button class="btn ghost" data-action="skipped">I skipped it</button></div></div>');}
var qs=[['A card costs 29.9% APR. You have spare cash.','Clear expensive debt first','Invest it regardless'],['You have £75 until Friday. A £35 night out is offered.','Skip or downgrade','Go and hope'],['Savings return 4%, inflation 3%. Approximate real gain?','1%','7%'],['Which has concentration risk?','100% in one company','Diversified global index'],['£725 rent vs £775 rent, but B saves £35 transport monthly.','B saves £600/year','A saves £600/year']];
function games(){state.game='sprint';state.round=0;state.score=0;return game()}
function game(){var q=qs[state.round%qs.length];return shell('<div class="eyebrow">🐍 MONEY SNAKE</div><div class="top" style="margin:8px 0 20px"><b>ROUND '+(state.round+1)+' / 5</b><span class="orange" style="font-size:25px;font-weight:950">'+state.score+' XP</span></div><div class="card hero"><span class="tag">FAST DECISION</span><h2>'+q[0]+'</h2><p class="muted">Pick the stronger financial move.</p></div><button class="choice" data-gameanswer="0">A · '+q[1]+'</button><button class="choice" data-gameanswer="1">B · '+q[2]+'</button>');}
var lessons=[['Runway maths','£420 cash, £300 rent due, £50 buffer, 7 days to payday. What is genuinely flexible?','£10/day','£60/day'],['Opportunity cost','You have £90 flexible money. Spending £45 means £45 cannot fund another goal. What concept explains the trade-off?','Liquidity','Opportunity cost'],['Credit','Two cards advertise 19%. One has a compulsory £60 annual fee. What should you compare?','Headline rate','APR / total borrowing cost'],['Buffer design','You have irregular income and no emergency reserve. Strongest first move?','Keep a protected reserve','Spend the spare cash'],['Stocks','A great company can still be a poor investment. Why?','Because price matters','Because good companies never fall']];
function train(){var l=lessons[state.lesson%lessons.length];return shell('<div class="eyebrow">TRAIN · SKILL TREE</div><h1>Build your<br><span class="orange">money brain.</span></h1><div class="card"><b>'+belt()+' BELT</b><span class="orange" style="float:right">'+state.xp+' XP</span><div class="progress"><span style="width:'+Math.min(100,(state.xp%80)/80*100)+'%"></span></div></div><div class="eyebrow" style="margin-top:25px">LESSON '+(state.lesson+1)+'</div><div class="card"><h2>'+l[0]+'</h2><p>'+l[1]+'</p><p class="muted mini">Don't rush. The point is to understand the reasoning, not memorise the answer.</p><button class="choice" data-answer="0">'+l[2]+'</button><button class="choice" data-answer="1">'+l[3]+'</button></div>');}
var stocks=[['AAPL','Apple',190,0.8],['NVDA','NVIDIA',118,2.1],['MSFT','Microsoft',505,0.4],['AMZN','Amazon',231,-0.6],['GOOGL','Alphabet',244,1.1],['META','Meta',785,-1.2],['TSLA','Tesla',340,2.8],['RR.L','Rolls-Royce',12.4,1.7],['SHEL','Shell',29.1,-0.3],['ULVR.L','Unilever',47.6,0.2],['ASML','ASML',713,1.4],['TSM','TSMC',249,0.9]];
function markets(){var value=state.cash;Object.keys(state.holdings||{}).forEach(function(t){var s=stocks.find(function(x){return x[0]===t});if(s)value+=state.holdings[t]*s[2]});return shell('<div class="eyebrow">PAPER MARKET</div><h1>Learn to invest<br><span class="orange">without losing money.</span></h1><div class="card hero"><div class="eyebrow">PORTFOLIO VALUE</div><div class="big">£'+value.toFixed(0)+'</div><p class="muted">£10,000 virtual starting cash · educational simulation</p></div><div class="notice">This is practice money. The MVP uses a small curated set of real companies first; the larger market universe comes later.</div><div class="card"><div class="stockrow"><h2>Market</h2><span class="pill">12 stocks</span></div>'+stocks.map(function(s){var owned=state.holdings[s[0]]||0;return '<div class="stock"><div class="stockrow"><div><b>'+s[0]+'</b> <span class="muted mini">'+s[1]+'</span><br><span>£'+s[2].toFixed(2)+'</span> <span class="'+(s[3]>=0?'up':'down')+'">'+(s[3]>=0?'+':'')+s[3]+'%</span></div><div><button class="pill" data-buy="'+s[0]+'">Buy</button> '+(owned?'<button class="pill" data-sell="'+s[0]+'">Sell</button>':'')+'<br><small class="muted">Owned: '+owned+'</small></div></div></div>'}).join('')+'</div>');}
function profile(){return shell('<div class="eyebrow">YOUR PROFILE</div><h1>The <span class="orange">dojo.</span></h1><div class="card hero"><div class="eyebrow">CURRENT BELT</div><div class="big orange">'+belt()+'</div><p class="muted">'+state.xp+' XP · '+(authUser?'synced account':'guest progress')+'</p></div><div class="grid"><div class="stat"><b>🔥 '+state.streak+'</b><br><small class="muted">streak</small></div><div class="stat"><b>'+state.decisions+'</b><br><small class="muted">decisions</small></div><div class="stat"><b>'+state.lesson+'</b><br><small class="muted">skills</small></div><div class="stat"><b>£'+Number(state.saved||0).toFixed(0)+'</b><br><small class="muted">avoided</small></div></div>'+(authUser?'':'<div class="notice">Create an account to keep this progress on another device.</div><button class="btn" data-action="account">Save my progress →</button>')+'<button class="btn ghost danger" data-action="reset">Reset local dojo</button></div>')}
function render(){var a=document.getElementById('app');if(state.onboarding&&!state.accountGate){a.innerHTML=onboarding();return}if(state.screen==='home')a.innerHTML=home();else if(state.screen==='train')a.innerHTML=train();else if(state.screen==='markets')a.innerHTML=markets();else if(state.screen==='profile')a.innerHTML=profile();if(state.accountGate){a.insertAdjacentHTML('beforeend',accountGate())}}
async function syncProfile(){if(!sb||!authUser)return;var p={id:authUser.id,name:state.name,age:Number(state.age)||null,income:Number(state.income)||0,rent:Number(state.rent)||0,weekly_spend:Number(state.weeklySpend)||0,goal:state.goal||'',confidence:Number(state.confidence)||3,xp:state.xp,streak:state.streak,decisions:state.decisions,saved:state.saved,lesson:state.lesson,onboarding_complete:!state.onboarding,updated_at:new Date().toISOString()};var r=await sb.from('profiles').upsert(p);if(r.error)toast('Account connected, but profile save failed')}
async function saveDecision(amount,outcome){if(!sb||!authUser)return;await sb.from('decisions').insert({user_id:authUser.id,amount:amount,outcome:outcome});}
async function savePortfolio(){if(!sb||!authUser)return;await sb.from('paper_portfolios').upsert({user_id:authUser.id,cash:state.cash,holdings:state.holdings,updated_at:new Date().toISOString()})}
async function loadUser(){if(!sb)return;var u=await sb.auth.getUser();authUser=u.data.user||null;if(authUser){var r=await sb.from('profiles').select('*').eq('id',authUser.id).maybeSingle();if(r.data){state=Object.assign(state,{name:r.data.name||state.name,age:r.data.age||'',income:r.data.income||0,rent:r.data.rent||0,weeklySpend:r.data.weekly_spend||0,goal:r.data.goal||'',confidence:r.data.confidence||3,xp:r.data.xp||0,streak:r.data.streak||0,decisions:r.data.decisions||0,saved:r.data.saved||0,lesson:r.data.lesson||0,onboarding:!r.data.onboarding_complete})}var pf=await sb.from('paper_portfolios').select('*').eq('user_id',authUser.id).maybeSingle();if(pf.data){state.cash=Number(pf.data.cash)||10000;state.holdings=pf.data.holdings||{}}saveLocal();render()}}
async function signup(){if(!sb){toast('Add your Supabase keys first');return}var email=(document.getElementById('auth-email').value||'').trim();var pass=document.getElementById('auth-password').value||'';var name=(document.getElementById('auth-name').value||state.name||'').trim();if(!email||pass.length<6){document.getElementById('auth-error').textContent='Enter an email and a password of at least 6 characters.';return}var r=await sb.auth.signUp({email:email,password:pass,options:{data:{name:name}}});if(r.error){document.getElementById('auth-error').textContent=r.error.message;return}state.name=name;state.accountGate=false;authUser=r.data.user||null;state.onboarding=false;saveLocal();await syncProfile();if(!r.data.session)toast('Check your email to confirm your account');else toast('Account created · progress saved');render()}
async function login(){if(!sb){toast('Add your Supabase keys first');return}var email=(document.getElementById('auth-email').value||'').trim();var pass=document.getElementById('auth-password').value||'';var r=await sb.auth.signInWithPassword({email:email,password:pass});if(r.error){document.getElementById('auth-error').textContent=r.error.message;return}authUser=r.data.user;state.guest=false;state.accountGate=false;await loadUser();toast('Welcome back');render()}
async function signout(){if(sb)await sb.auth.signOut();authUser=null;state.guest=true;saveLocal();render();toast('Signed out')}
document.addEventListener('click',async function(e){var b=e.target.closest('[data-screen],[data-action],[data-goal],[data-confidence],[data-gameanswer],[data-answer],[data-buy],[data-sell]');if(!b)return;
if(b.dataset.goal){state.goal=b.dataset.goal;state.step++;saveLocal();if(state.step>=4){state.onboarding=false;state.accountGate=true;state.screen='home';}render();return}
if(b.dataset.confidence){state.confidence=Number(b.dataset.confidence);state.step++;state.onboarding=false;state.accountGate=true;saveLocal();render();return}
if(b.dataset.screen){state.screen=b.dataset.screen;saveLocal();render();return}
if(b.dataset.buy){var s=stocks.find(function(x){return x[0]===b.dataset.buy});if(!s)return;if(state.cash>=s[2]){state.cash-=s[2];state.holdings[s[0]]=(state.holdings[s[0]]||0)+1;state.xp+=5;saveLocal();await savePortfolio();toast('Bought 1 '+s[0]+' · +5 XP');render()}else toast('Not enough virtual cash');return}
if(b.dataset.sell){var t=b.dataset.sell;var s2=stocks.find(function(x){return x[0]===t});if(s2&&state.holdings[t]){state.cash+=s2[2];state.holdings[t]--;state.xp+=5;saveLocal();await savePortfolio();toast('Sold 1 '+t+' · +5 XP');render()}return}
if(b.dataset.answer!==undefined){var good=Number(b.dataset.answer)===(state.lesson%lessons.length===0?0:1);if(good){state.xp+=20;state.lesson++;saveLocal();await syncProfile();toast('🔥 Skill unlocked · +20 XP');render()}else toast('Not quite — think about the trade-off');return}
if(b.dataset.gameanswer!==undefined){var ok=Number(b.dataset.gameanswer)===0;if(ok){state.score+=10;toast('+10 · correct')}else toast('Not quite');state.round++;if(state.round>=5){state.xp+=state.score;saveLocal();await syncProfile();state.screen='home';render();toast('Run complete · '+state.score+' XP')}else document.getElementById('app').innerHTML=game();return}
if(b.dataset.action){var a=b.dataset.action;
if(a==='onnext'){if(state.step===0){state.name=(document.getElementById('on-name').value||'').trim();if(!state.name){toast('Give your dojo a name first');return}}if(state.step===1){state.income=Number(document.getElementById('on-income').value)||0;state.rent=Number(document.getElementById('on-rent').value)||0;state.weeklySpend=Number(document.getElementById('on-spend').value)||0}state.step++;saveLocal();render();return}
if(a==='decision'){document.getElementById('app').innerHTML=decision();return}
if(a==='analyse'){document.getElementById('app').innerHTML=consequence();return}
if(a==='bought'||a==='skipped'){state.decisions++;if(a==='skipped')state.saved+=Math.round(state.pending||0);state.xp+=25;saveLocal();await saveDecision(state.pending,a==='bought'?'bought':'skipped');await syncProfile();state.screen='home';render();toast(a==='skipped'?'+25 XP · smart skip':'Logged · keep training');return}
if(a==='games'){state.game='sprint';state.round=0;state.score=0;document.getElementById('app').innerHTML=game();return}
if(a==='account'){if(!configured){toast('Supabase is not connected yet');return}state.accountGate=true;render();return}
if(a==='signup'||a==='login'){document.querySelector('.modal').outerHTML=authModal(a);return}
if(a==='submit-signup'){await signup();return}
if(a==='submit-login'){await login();return}
if(a==='guest'){state.accountGate=false;state.guest=true;saveLocal();render();return}
if(a==='closemodal'){state.accountGate=false;render();return}
if(a==='signout'){await signout();return}
if(a==='reset'){localStorage.removeItem(key);location.reload();return}
}
});
if(sb){sb.auth.onAuthStateChange(function(event,session){authUser=session&&session.user?session.user:null;if(authUser){state.guest=false;loadUser()}else{state.guest=true;render()}})}
loadUser().then(function(){if(!state.name&&!state.onboarding){state.onboarding=true;state.step=0}if(state.onboarding){render()}else render()});
})();
</script>
</body>
</html>
