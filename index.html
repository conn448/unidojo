:var(--red);background:#2b1117}.input{display:block;width:100%;padding:13px;border:1px solid #3d3d3d;border-radius:13px;background:#090909;color:#fff;margin:7px 0 14px;outline:none}.tag{font-size:10px;font-weight:900;letter-spacing:.08em;color:#aaa}.lesson{display:flex;align-items:center;gap:12px;width:100%;border:1px solid #2c2c2c;background:#141414;text-align:left;margin:7px 0;padding:12px;border-radius:16px}.node{width:46px;height:46px;display:grid;place-items:center;flex:0 0 46px;border-radius:14px;background:#222;border:1px solid #3c3c3c;font-size:20px}.nav{position:fixed;z-index:100;left:0;right:0;bottom:0;background:rgba(9,9,9,.98);border-top:1px solid #292929;display:flex;padding:7px 8px}.nav button{flex:1;border:0;background:transparent;font-size:12px;padding:7px 3px}.nav button.active{color:var(--orange);background:#1d1d1d}.toast{position:fixed;z-index:999;top:14px;left:50%;transform:translateX(-50%);background:var(--orange);color:#111;padding:10px 15px;border-radius:99px;font-weight:900;display:none}.toast.show{display:block}.up{color:var(--green)}.down{color:var(--red)}.bar{height:9px;border-radius:9px;background:#292929;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}.chart{height:230px;width:100%;background:#0b0b0b;border:1px solid #292929;border-radius:15px;margin:12px 0}.markethead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stockrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #242424;gap:10px}.stockname b{display:block}.mini{font-size:12px;color:var(--muted)}.news{border-left:3px solid var(--orange);padding-left:12px}.scenario{background:#0e0e0e;border-radius:15px;padding:14px;margin:10px 0}.success{color:var(--green)}.danger{color:var(--red)}.booterr{border-color:var(--red)}@media(max-width:520px){h1{font-size:30px}.grid3{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><div id="toast" class="toast"></div> var LESSONS=[['Runway maths','🏃','Foundation','Calculate how much cash is genuinely flexible.',1],['Net income','🧾','Income','Use the money you can actually spend.',1],['Opportunity cost','⚔️','Decisions','Make the trade-off explicit.',1],['Credit comparison','💳','Credit','Compare total borrowing cost, not headlines.',1],['Real returns','📈','Economics','Separate nominal return from purchasing power.',2],['Compounding','🌱','Investing','See why time matters.',0],['Buffer design','🧱','Resilience','Protect money needed for shocks.',1],['Behaviour design','🧠','Behaviour','Build systems that survive real life.',1],['Concentration risk','🎯','Investing','See why one-company portfolios can swing hard.',0],['Debt vs investing','💰','Credit','Compare known borrowing costs with uncertain returns.',0],['Weekly reset','🥋','Mastery','Turn spending data into one useful intervention.',1],['Rent reality','🏠','Life','Compare total living costs.',1],['Subscription trap','🔁','Behaviour','Spot recurring costs.',1],['Liquidity first','🚨','Resilience','Match money to when it is needed.',1],['APR detective','🔎','Credit','Decode borrowing costs.',1],['Inflation shock','🌡️','Economics','Understand purchasing power.',2],['Diversification','🧺','Investing','Reduce single-company risk.',0],['Market psychology','😱','Behaviour','Recognise panic and FOMO.',1],['Emergency scenario','🛟','Life','Plan for an unexpected bill.',1],['Portfolio check','📊','Investing','Match a portfolio to a goal and horizon.',0],['ETF basics','🧩','Investing','Understand funds and fees.',0],['Dividends','💸','Investing','Understand dividend mechanics.',1],['Earnings day','📰','Markets','Read company results without chasing headlines.',2],['Interest rates','🏦','Economics','Connect rates to borrowing, saving and assets.',1],['Scam radar','🚨','Safety','Spot pressure tactics and fake certainty.',1],['Salary strategy','💼','Income','Build a first-payday system.',1],['Student loan reality','🎓','Life','Understand repayment mechanics.',1],['Car finance','🚗','Credit','Compare monthly and total cost.',2],['Rent deposit','🔑','Life','Plan a large known cost.',1],['Net worth','🧮','Foundation','See beyond your bank balance.',0]];
var BANK=[['You have £420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10','£17.14','£60','£70'],0,'£420 − £300 − £50 = £70; £70 ÷ 7 = £10 per day.'],['Which income figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer cost','Headline bonus'],1,'A spending plan should start from money you can actually access.'],['You have £90 flexible money. Spending £45 tonight means £45 cannot fund another goal. What is that trade-off?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1,'Opportunity cost is what you give up by choosing the next-best alternative.'],['Two cards advertise 19%. One has a compulsory annual fee. What should you compare?',['Headline rate only','APR / total borrowing cost','Minimum payment only','Brand'],1,'Fees can change the real cost. Compare APR and total borrowing cost.'],['Savings return is 4% and inflation is 3%. Approximate real gain?',['7%','4%','1%','3%'],2,'A rough shortcut is 4% − 3% = about 1%.'],['Why can starting earlier be powerful with the same monthly investment?',['More time for compounding','Risk disappears','Returns are guaranteed','Fees vanish'],0,'Time gives returns more opportunity to compound; it does not remove risk.'],['You have £250 cash, irregular income and no emergency reserve. Best default?',['Spend it','Keep a protected reserve','Put it all in a high-risk asset','Borrow instead'],1,'A buffer improves resilience when income or expenses move unexpectedly.'],['You repeatedly overspend on food during busy weeks. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking','Set an impossible target'],1,'Good behaviour design makes the desired action easier and realistic.'],['Which portfolio has clearest concentration risk?',['100% one company','Diversified global index fund','Cash across protected banks','Mixed asset classes'],0,'One company creates substantial company-specific risk.'],['You have a high-APR £600 card balance and £600 spare. What should you compare first?',['Expected investment return vs borrowing cost/risk','Best investment year','Card colour','Minimum payment'],0,'Borrowing costs are a known drag while investment returns are uncertain.'],['Your £120 flexible plan became £154. Food +£8, transport +£4, social +£22. First intervention?',['Blame yourself','Target the largest controllable variance','Delete budget','Cut everything'],1,'The largest controllable variance is social at +£22.'],['Option A rent £725. B £775 but saves £35 transport monthly. Which is cheaper on rent + transport alone?',['A by £180/year','B by £180/year','B by £600/year','Same'],0,'B costs £600 more rent but saves £420 transport, so A is £180 cheaper per year.']];
var SCENARIOS=[['The £80 week','Budgeting','You have £120 flexible money. Food £52, transport £18 and social £25. What remains?',['£15','£25','£35','£45'],1,'£120 − £52 − £18 − £25 = £25.'],['The 25% fall','Investing','A £2,000 diversified portfolio falls 25%. New value?',['£500','£1,250','£1,500','£1,750'],2,'You retain 75%: £2,000 × 0.75 = £1,500.'],['The overdraft','Credit','You are £300 into an expensive overdraft and have £300 spare. What deserves attention first?',['The investment opportunity','The borrowing cost and repayment plan','A new subscription','Nothing'],1,'Compare borrowing cost, risk and liquidity before chasing uncertain returns.'],['The buffer','Resilience','You need £700 in 10 weeks for a known university cost. Best home?',['Volatile stock','Accessible low-risk cash','Speculative token','Long-term locked investment'],1,'Match asset risk and access to the timing and certainty of the liability.'],['The headline','Markets','A stock jumps 14% after a headline. Strongest first move?',['Buy immediately','Short immediately','Read what changed and assess the company','Borrow to buy more'],2,'A price move is information, not an instruction.'],['The £1,000 choice','Investing','You need £1,000 in four months for a guaranteed cost. What matters most?',['Maximum return','Keeping money available with appropriate risk','Hottest stock','Leverage'],1,'A short deadline leaves little room to recover from a market fall.']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function money(n){return '£'+(Number(n)||0).toFixed(2)}function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(function(){x.classList.remove('show')},1400)}function safeRun(fn){try{fn()}catch(e){app.innerHTML='<div class="card hero booterr"><div class="eyebrow">RECOVERED ERROR</div><h1>Unidojo recovered.</h1><p class="muted">'+String(e&&e.message||e).replace(/[<>]/g,'')+'</p><button class="primary" onclick="location.reload()">Reload dojo</button></div>'}}function nav(x){['today','markets','train','account'].forEach(function(k){var el=document.getElementById('n'+k.charAt(0).toUpperCase()+k.slice(1));if(el)el.classList.toggle('active',k===x)})}function ready(){return !!(S.profile&&S.profile.done)}function esc(s){return String(s||'').replace(/[<>]/g,'')}function belt(){return S.xp>=900?'BLACK':S.xp>=550?'RED':S.xp>=250?'BLUE':S.xp>=80?'GREEN':'WHITE'}function award(n){S.xp+=n;save();toast('+'+n+' XP')}
function onboarding(step){nav('');var p=S.profile||{},h='';if(step===1)h='<div class="card hero"><span class="pill">SET UP · 1/4</span><h1>Build your money profile.</h1><p class="muted">This starting context helps personalise your training.</p><label>First name</label><input class="input" id="name" value="'+esc(p.name)+'" placeholder="Your first name"><label>Age</label><input class="input" id="age" type="number" value="'+(p.age||'')+'" placeholder="18"></div>';if(step===2)h='<div class="card hero"><span class="pill">SET UP · 2/4</span><h1>What does your month look like?</h1><p class="muted">Rough numbers are enough.</p><label>Monthly income / money available</label><input class="input" id="income" type="number" value="'+(p.income||'')+'" placeholder="850"><label>Monthly rent / housing</label><input class="input" id="rent" type="number" value="'+(p.rent||'')+'" placeholder="750"><label>Typical weekly flexible spend</label><input class="input" id="spend" type="number" value="'+(p.spend||'')+'" placeholder="80"></div>';if(step===3)h='<div class="card hero"><span class="pill">SET UP · 3/4</span><h1>What do you want to improve?</h1><p class="muted">This changes what Unidojo prioritises.</p>'+[['control','🎯 Control spending'],['save','🧱 Build a buffer'],['invest','📈 Understand investing'],['debt','💳 Understand debt'],['all','🥋 Become good with money overall']].map(function(x){return '<button class="choice" onclick="safeRun(function(){goal(\''+x[0]+'\')})">'+x[1]+'</button>'}).join('')+'</div>';if(step===4)h='<div class="card hero"><span class="pill">SET UP · 4/4</span><h1>How confident are you?</h1><p class="muted">This sets initial difficulty. Performance changes it later.</p>'+[['1','😵 Often lost'],['2','🙂 Know the basics'],['3','💪 Fairly confident'],['4','🧠 Give me hard questions']].map(function(x){return '<button class="choice" onclick="safeRun(function(){conf('+x[0]+')})">'+x[1]+'</button>'}).join('')+'</div>';app.innerHTML=h+'<div class="progress"><i style="width:'+step*25+'%"></i></div><div class="actions"><button onclick="'+(step>1?'safeRun(onback)':'')+'">'+(step>1?'← Back':'')+'</button><button class="primary" onclick="safeRun(function(){onnext('+step+')})">'+(step===4?'Enter my dojo':'Continue →')+'</button></div>';S.step=step}
function goal(v){S.profile=S.profile||{};S.profile.goal=v;save();onboarding(4)}function conf(v){S.profile=S.profile||{};S.profile.confidence=Number(v);save();onboarding(4)}function onback(){onboarding(Math.max(1,(S.step||1)-1))}function onnext(step){var p=S.profile||{};if(step===1){p.name=document.getElementById('name').value.trim();p.age=Number(document.getElementById('age').value);if(!p.name||!p.age)return toast('Add your name and age')}if(step===2){p.income=Number(document.getElementById('income').value)||0;p.rent=Number(document.getElementById('rent').value)||0;p.spend=Number(document.getElementById('spend').value)||0}if(step===3&&!p.goal)return toast('Pick a focus');if(step===4&&!p.confidence)return toast('Pick your confidence');if(step===4)p.done=true;S.profile=p;save();if(step===4)home();else onboarding(step+1)}
function focus(){var p=S.profile||{},g=p.goal||'all';return g==='invest'?'Investing':g==='debt'?'Credit':g==='save'?'Resilience':g==='control'?'Behaviour':'Foundation'}function nextLesson(){var f=focus(),ids=LESSONS.map(function(_,i){return i}).filter(function(i){return S.completed.indexOf(i)<0}),id=ids.find(function(i){return LESSONS[i][2]===f});if(id==null)id=ids[0]||0;return {id:id,title:LESSONS[id][0]}}function home(){if(!ready())return onboarding(1);nav('today');var p=S.profile,n=nextLesson();app.innerHTML='<div class="eyebrow">TODAY</div><div class="markethead"><div><h1>Train your money brain.</h1><p class="muted">Good morning, '+esc(p.name)+'. Your next session focuses on <b>'+focus()+'</b>.</p></div><span class="pill">🔥 '+S.streak+' day streak</span></div><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">BELT</div><b>'+belt()+'</b></div><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">MASTERED</div><b>'+S.completed.length+'</b></div></div><div class="progress"><i style="width:'+Math.min(100,S.completed.length/LESSONS.length*100)+'%"></i></div><p class="muted">Personalised next: <b>'+esc(n.title)+'</b></p><button class="primary" onclick="safeRun(function(){lessonStart('+n.id+')})">Start today's training →</button></div><div class="card"><div class="eyebrow">BRAIN INSIGHT</div><h2>Why this lesson?</h2><p class="muted">Your goal, confidence and completed skills shape what appears next. Every answer becomes evidence for the learning loop.</p></div><div class="card"><div class="eyebrow">MARKET PRACTICE</div><h2>Learn by doing</h2><p class="muted">Paper trade with £10,000, inspect trends and practise decisions without real money.</p><button onclick="safeRun(markets)">Open Markets →</button></div>'}
function train(){if(!ready())return onboarding(1);nav('train');var cats={};LESSONS.forEach(function(l,i){(cats[l[2]]||(cats[l[2]]=[])).push([l,i])});var h='<div class="eyebrow">TRAINING ACADEMY</div><h1>Build real financial judgement.</h1><p class="muted">30 core lessons plus scenario challenges. Short concepts, decisions and practical explanations.</p>';Object.keys(cats).forEach(function(c){h+='<div class="card"><div class="tag">'+c.toUpperCase()+'</div><h2>'+c+'</h2>';cats[c].forEach(function(x){var done=S.completed.indexOf(x[1])>=0;h+='<button class="lesson" onclick="safeRun(function(){lessonStart('+x[1]+')})"><span class="node">'+x[0][1]+'</span><span><b>'+x[0][0]+'</b><small>'+(done?'✓ Mastered · ':'')+x[0][3]+'</small></span></button>'});h+='</div>'});h+='<div class="card"><div class="eyebrow">SCENARIO LAB</div><h2>Real-life decisions</h2><p class="muted">Practise judgement in situations where more than one thing matters.</p>';SCENARIOS.forEach(function(s,i){h+='<button class="lesson" onclick="safeRun(function(){scenario('+i+')})"><span class="node">⚡</span><span><b>'+s[0]+'</b><small>'+s[1]+' · decision challenge</small></span></button>'});h+='</div>';app.innerHTML=h}
function lessonStart(i){var l=LESSONS[i],q=BANK[i%BANK.length];app.innerHTML='<div class="eyebrow">'+l[2].toUpperCase()+' · LESSON '+(i+1)+'</div><h1>'+l[1]+' '+l[0]+'</h1><div class="card hero"><p>'+q[0]+'</p>'+q[1].map(function(o,a){return '<button class="choice" onclick="safeRun(function(){answer('+i+','+a+','+q[2]+')})">'+o+'</button>'}).join('')+'</div><p class="muted">Lesson '+(i+1)+' of '+LESSONS.length+' · The Brain records mastery.</p>'}
function answer(i,a,c){var bs=[].slice.call(document.querySelectorAll('.choice'));bs.forEach(function(b){b.disabled=true});var ok=a===c;if(bs[a])bs[a].classList.add(ok?'correct':'wrong');if(ok){if(S.completed.indexOf(i)<0)S.completed.push(i);award(30);app.innerHTML+='<div class="card"><div class="eyebrow success">CORRECT</div><h2>Good judgement.</h2><p class="muted">'+BANK[i%BANK.length][3]+'</p><button class="primary" onclick="safeRun(train)">Continue training →</button></div>'}else{S.hearts=Math.max(0,S.hearts-1);save();app.innerHTML+='<div class="card"><div class="eyebrow danger">NOT QUITE</div><h2>That is the trap.</h2><p class="muted">'+BANK[i%BANK.length][3]+'</p><button onclick="safeRun(train)">Back to academy</button></div>'}}
function scenario(i){var s=SCENARIOS[i];app.innerHTML='<div class="eyebrow">SCENARIO LAB · '+s[1].toUpperCase()+'</div><h1>⚡ '+s[0]+'</h1><div class="card hero"><div class="scenario"><b>'+s[2]+'</b></div>'+s[3].map(function(o,a){return '<button class="choice" onclick="safeRun(function(){scenarioAnswer('+i+','+a+')})">'+o+'</button>'}).join('')+'</div>'}function scenarioAnswer(i,a){var s=SCENARIOS[i],bs=[].slice.call(document.querySelectorAll('.choice'));bs.forEach(function(b){b.disabled=true});var ok=a===s[4];if(bs[a])bs[a].classList.add(ok?'correct':'wrong');if(ok)award(50);app.innerHTML+='<div class="card"><div class="eyebrow">'+(ok?'STRONG DECISION':'LEARNING MOMENT')+'</div><h2>'+ (ok?'Exactly.':'Here is the better framework.')+'</h2><p class="muted">'+s[5]+'</p><button class="primary" onclick="safeRun(train)">Continue →</button></div>'}
function price(t){return STOCKS[t]?STOCKS[t].p:0}function portfolio(){var v=S.cash;Object.keys(S.holdings).forEach(function(t){v+=price(t)*S.holdings[t]});return v}function markets(){if(!ready())return onboarding(1);nav('markets');var h='<div class="eyebrow">PAPER MARKET</div><h1>Learn the market by doing.</h1><p class="muted">Simulated £10,000 account. No real money.</p><div class="card hero"><div class="grid3"><div class="stat"><div class="tag">PORTFOLIO</div><b>'+money(portfolio())+'</b></div><div class="stat"><div class="tag">CASH</div><b>'+money(S.cash)+'</b></div><div class="stat"><div class="tag">POSITIONS</div><b>'+Object.keys(S.holdings).length+'</b></div></div></div><div class="card"><div class="eyebrow">MARKET CHART</div><p class="news"><b>Rule:</b> a rising chart is not automatically a buy signal. Check evidence, risk and time horizon.</p><canvas id="chart" class="chart" width="700" height="230"></canvas><div class="actions"><button onclick="safeRun(function(){drawChart(\'AAPL\')})">AAPL</button><button onclick="safeRun(function(){drawChart(\'NVDA\')})">NVDA</button></div></div><div class="card"><div class="eyebrow">WATCHLIST</div>';Object.keys(STOCKS).forEach(function(t){var x=STOCKS[t];h+='<div class="stockrow"><div class="stockname"><b>'+t+' · '+x.n+'</b><span class="mini">'+x.sector+' · '+money(x.p)+'</span></div><div><b class="'+(x.trend>=0?'up':'down')+'">'+(x.trend>=0?'+':'')+x.trend.toFixed(1)+'%</b><br><button onclick="safeRun(function(){tradePanel(\''+t+'\')})">Trade</button></div></div>'});h+='</div><div id="trade"></div><div class="card"><div class="eyebrow">MARKET LESSON</div><h2>Read the trend, then ask why.</h2><p class="muted">These are fixed teaching prices in the MVP, designed for learning rather than live trading.</p></div>';app.innerHTML=h;setTimeout(function(){drawChart('AAPL')},30)}function drawChart(t){var c=document.getElementById('chart');if(!c)return;var ctx=c.getContext('2d'),x=STOCKS[t],pts=[],v=100;for(var i=0;i<30;i++){v+=Math.sin(i*1.7)*.7+Math.cos(i*.55)*.35+x.trend/30;pts.push(v)}ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#303030';ctx.lineWidth=1;for(var g=1;g<5;g++){ctx.beginPath();ctx.moveTo(0,g*c.height/5);ctx.lineTo(c.width,g*c.height/5);ctx.stroke()}ctx.strokeStyle=x.trend>=0?'#35d399':'#ff5d73';ctx.lineWidth=3;ctx.beginPath();var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts);pts.forEach(function(p,i){var px=i*(c.width-20)/(pts.length-1)+10,py=c.height-20-(p-mn)/(mx-mn||1)*(c.height-40);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.stroke();ctx.fillStyle='#aaa';ctx.font='13px system-ui';ctx.fillText(t+' · illustrative trend',12,18)}function tradePanel(t){var x=STOCKS[t];document.getElementById('trade').innerHTML='<div class="card"><div class="eyebrow">TRADE · '+t+'</div><h2>'+x.n+' · '+money(x.p)+'</h2><p class="muted">Ask: what is the thesis, what could go wrong, and how concentrated would you be?</p><div class="actions"><button class="primary" onclick="safeRun(function(){buy(\''+t+'\')})">Buy 1</button><button onclick="safeRun(function(){sell(\''+t+'\')})">Sell 1</button></div></div>'}function buy(t){var p=price(t);if(S.cash<p)return toast('Not enough simulated cash');S.cash-=p;S.holdings[t]=(S.holdings[t]||0)+1;save();markets()}function sell(t){if(!S.holdings[t])return toast('No shares held');S.cash+=price(t);S.holdings[t]--;if(!S.holdings[t])delete S.holdings[t];save();markets()}
function account(){if(!ready())return onboarding(1);nav('account');var p=S.profile;app.innerHTML='<div class="eyebrow">PROFILE</div><h1>'+esc(p.name)+'’s dojo.</h1><div class="card hero"><div class="grid"><div><div class="tag">GOAL</div><h2>'+esc(p.goal||'all')+'</h2></div><div><div class="tag">CONFIDENCE</div><h2>'+p.confidence+'/4</h2></div></div><div class="grid"><div class="stat"><div class="tag">XP</div><b>'+S.xp+'</b></div><div class="stat"><div class="tag">STREAK</div><b>'+S.streak+' days</b></div></div></div><div class="card"><div class="eyebrow">THE BRAIN</div><h2>Personalised learning loop</h2><p class="muted">Your profile sets the direction and your answers provide evidence about what you understand. The MVP uses that evidence to prioritise the next focus.</p><div class="bar"><i style="width:'+Math.min(100,S.completed.length/LESSONS.length*100)+'%"></i></div><p class="muted">'+S.completed.length+' of '+LESSONS.length+' core lessons completed.</p></div><div class="card"><div class="eyebrow">FINANCIAL SNAPSHOT</div><div class="grid"><div class="stat"><div class="tag">MONTHLY MONEY</div><b>'+money(p.income)+'</b></div><div class="stat"><div class="tag">HOUSING</div><b>'+money(p.rent)+'</b></div></div></div><button onclick="safeRun(function(){localStorage.removeItem(KEY);location.reload()})">Reset demo profile</button>'}
window.home=home;window.markets=markets;window.train=train;window.account=account;window.safeRun=safeRun;window.goal=goal;window.conf=conf;window.onnext=onnext;window.onback=onback;window.lessonStart=lessonStart;window.answer=answer;window.scenario=scenario;window.scenarioAnswer=scenarioAnswer;window.tradePanel=tradePanel;window.drawChart=drawChart;window.buy=buy;window.sell=sell;
try{if(ready())home();else onboarding(1)}catch(e){safeRun(function(){throw e})}
})();
</script></body></html>
