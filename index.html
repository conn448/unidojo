<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Unidojo — Train your money brain</title>
<style>
:root{--bg:#080808;--panel:#131313;--panel2:#191919;--line:#2b2b2b;--text:#fff;--muted:#9b9b9b;--accent:#ff9800;--green:#35d399;--red:#ff5d73;--blue:#6ea8fe}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 50% -10%,#241505 0,#0b0b0b 34%,#080808 70%);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{min-height:48px;border:1px solid #333;border-radius:14px;padding:12px 16px;background:var(--panel2);color:#fff;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.99)}button.primary{background:linear-gradient(135deg,#ff9800,#ffb000);border-color:#ff9800;color:#111;font-weight:950}.ghost{background:transparent;color:#bbb}.danger{color:#ff9aaa;border-color:#572731}.muted{color:var(--muted)}main{width:100%;max-width:680px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}.brand{font-weight:950;font-size:25px;letter-spacing:-1px;margin:2px 2px 16px}.brand span,.accent{color:var(--accent)}h1{font-size:35px;line-height:1.02;letter-spacing:-1.5px;margin:8px 0 14px}h2{font-size:25px;line-height:1.1;margin:6px 0 12px}h3{margin:7px 0}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}.sub{line-height:1.55}.card,.decision,.mission,.game,.stock{background:linear-gradient(145deg,#171717,#101010);border:1px solid var(--line);border-radius:21px;padding:17px;margin:12px 0;overflow:hidden}.hero{padding:21px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.input{display:block;width:100%;min-height:51px;padding:13px 14px;border:1px solid #3b3b3b;border-radius:13px;background:#090909;color:#fff;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #ff980022}.actions{display:flex;gap:9px;margin-top:14px}.actions>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#0d0d0d;border:1px solid #292929;border-radius:15px;padding:12px;text-align:center}.big{font-size:48px;font-weight:950;letter-spacing:-2px}.pill,.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;background:#242424;color:#bbb}.good{background:#073b2b;color:#86efac}.warn{background:#493008;color:#fcd34d}.bad{background:#42121b;color:#fda4af}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff9800,#ffb000);border-radius:99px}.choice{display:block;width:100%;text-align:left;margin:9px 0;min-height:54px}.choice.correct{border-color:var(--green);background:#09271f}.choice.wrong{border-color:var(--red);background:#2b1117}.choice:disabled{cursor:default}.lesson{display:flex;align-items:center;gap:13px;width:100%;padding:12px 3px;background:transparent;border:0;text-align:left}.lesson:disabled{opacity:.32}.node{width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center;border-radius:17px;background:#202020;border:1px solid #3b3b3b;font-size:22px}.tree-line{border-left:2px solid #303030;margin-left:27px;padding-left:12px}.game{cursor:pointer;text-align:left;width:100%;transition:.15s}.game:hover{border-color:#555;transform:translateY(-1px)}.game-icon{font-size:34px;float:right}.score{font-size:40px;font-weight:950}.timer{height:7px;background:#292929;border-radius:99px;overflow:hidden}.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width linear}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.price{font-size:23px;font-weight:950}.up{color:var(--green)}.down{color:var(--red)}.stock .actions{margin-top:10px}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(9,9,9,.96);backdrop-filter:blur(15px);border-top:1px solid #292929;display:flex;gap:6px}.nav button{flex:1;min-width:0;min-height:46px;padding:9px 4px;border:0;background:transparent;font-size:12px}.nav button.active{background:#1d1d1d;color:var(--accent)}.toast{position:fixed;z-index:99;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;padding:10px 15px;border-radius:99px;font-weight:950;display:none;box-shadow:0 8px 25px #000}.toast.show{display:block}.error{color:#ff9aaa;font-size:13px;margin-top:8px}.success{color:var(--green);font-size:13px;margin-top:8px}.hide{display:none!important}.locked{filter:saturate(.2)}.tiny{font-size:12px}.spacer{height:6px}@media(max-width:480px){main{padding:13px 11px calc(91px + env(safe-area-inset-bottom))}.card,.decision,.mission,.game,.stock{border-radius:17px;padding:15px}h1{font-size:30px}.big{font-size:38px}.actions{flex-direction:column}.actions>*{width:100%}.grid2{gap:8px}.nav button{font-size:11px}.row.mobile{align-items:flex-start;flex-direction:column}.stock .row{align-items:flex-start}.stock .price{font-size:20px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<main><div class="brand">uni<span>dojo</span></div><div id="app"></div></main>
<nav class="nav" id="nav"><button id="navToday" onclick="home()">⌂<br>Today</button><button id="navMarkets" onclick="markets()">◈<br>Markets</button><button id="navTrain" onclick="train()">◎<br>Train</button><button id="navAccount" onclick="account()">●<br>Account</button></nav>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const app=document.getElementById('app'),KEY='unidojo-core-v4';
const day=()=>new Date().toISOString().slice(0,10),money=n=>'£'+Math.max(0,Number(n)||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const LESSONS=[
['Runway maths','🏃','FOUNDATION','£420 cash, £300 rent due, £50 protected buffer and 7 days to payday. What is genuinely flexible per day?',['£10/day','£17.14/day','£60/day','£70/day'],1],
['Net income','🧾','INCOME','A graduate is offered £30,000 gross. Which figure belongs in a monthly spending plan?',['Gross salary','Expected net pay received','Employer payroll cost','Headline bonus'],1],
['Opportunity cost','⚔️','DECISIONS','You have £90 flexible money. Spending £45 on a night out means that £45 cannot fund another goal this week. What concept is this?',['Liquidity','Opportunity cost','Inflation','Compound interest'],1],
['Credit comparison','💳','CREDIT','Two cards advertise 19%. Card A has no mandatory fee; Card B has a compulsory £60 annual fee. What should you compare?',['Only headline rate','APR / total borrowing cost','Minimum payment only','Lender reputation'],1],
['Real returns','📈','ECONOMICS','Savings return is 4% and inflation is 3%. Ignoring tax and exact compounding, the approximate real gain is…',['7%','4%','1%','3%'],2],
['Compounding','🌱','INVESTING','Why can starting a diversified long-term investment earlier be powerful with the same monthly contribution?',['More time for returns to compound','It removes market risk','Returns become guaranteed','Fees disappear'],0],
['Buffer design','🧱','RESILIENCE','You have £250 cash, irregular income and rely on a laptop for university. What is most defensible with no emergency reserve?',['Spend it because cash loses value','Keep a protected reserve','Put it all in a high-risk asset','Borrow £100 instead'],1],
['Behaviour design','🧠','BEHAVIOUR','You repeatedly overspend on food during busy weeks despite a detailed budget. Best intervention?',['Make the spreadsheet longer','Create a realistic weekly rule + cheap default','Stop tracking entirely','Set an impossible target'],1],
['Concentration risk','🎯','INVESTING','Which portfolio has the clearest concentration risk?',['100% in one company','Diversified global index fund','Cash across several protected banks','Mixed asset classes'],0],
['Debt vs investing','💰','CREDIT','You can clear a £600 high-APR card or invest the same £600. What should you compare first?',['Expected investment return vs borrowing cost and risk','Only the investment best year','Card colour','Minimum payment'],0],
['Weekly reset','🥋','MASTERY','Plan £120 flexible spend; actual £154. Food +£8, transport +£4, social +£22. Best first intervention?',['Blame yourself for £34','Target the largest controllable variance','Delete the budget','Set next target to £86'],1],
['Rent reality','🏠','LIFE','Option A costs £725/month. B costs £775/month but saves £35/month transport. Ignoring other factors, annual net difference?',['A saves £600/year','B saves £600/year','B costs £1,020 more/year','They cost the same'],1],
['Subscription trap','🔁','BEHAVIOUR','Subscriptions cost £7, £6, £5, £5, £4 and £3 monthly. Cancelling £6 and £5 saves…',['£11/year','£11/month','£66/month','£132/month'],1],
['Liquidity first','🚨','RESILIENCE','You need £800 for a guaranteed university cost in three months. Strongest default principle?',['Take equity risk for upside','Keep required money accessible and low-risk','Use credit and invest the £800','Ignore the date'],1]
];
const GAMES=[['sprint','⚡','Money Sprint','Five finance decisions against the clock.','Speed + accuracy'],['duel','⚔️','Decision Duel','Fast trade-offs. Pick the stronger financial move.','Judgement'],['streak','🔥','Streak Run','Three small scenarios. Protect the combo.','Consistency']];
let S={profile:null,tab:'today',onStep:1,xp:0,streak:0,lastCheck:null,spent:0,decisions:[],completed:[],hearts:5,lesson:0,answer:null,purchase:0,saved:0,game:null,gameIndex:0,gameScore:0,combo:0,gameDone:false,cash:10000,holdings:{},live:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function setNav(x){['Today','Markets','Train','Account'].forEach(k=>document.getElementById('nav'+k).classList.toggle('active',k.toLowerCase()===x))}
function belt(){return S.xp>=800?'BLACK':S.xp>=450?'RED':S.xp>=220?'BLUE':S.xp>=80?'GREEN':'WHITE'}
function nextXP(){return S.xp<80?80:S.xp<220?220:S.xp<450?450:S.xp<800?800:1200}
function navOn(){return S.profile&&S.profile.onboardingComplete}
function shell(html){return html}
function onboarding(step){S.onStep=step;setNav('');const p=S.profile||{};let content='';
 if(step===1)content=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 1/4</span><h1>Build your money profile.</h1><p class="muted sub">A quick starting point so the training feels like your life, not a textbook.</p><div class="field"><label>First name</label><input class="input" id="obName" autocomplete="given-name" value="${esc(p.name||'')}" placeholder="e.g. Conn"></div><div class="field"><label>Age</label><input class="input" id="obAge" type="number" inputmode="numeric" min="13" max="100" value="${esc(p.age||'')}" placeholder="18"></div></div>`;
 if(step===2)content=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 2/4</span><h1>Know your monthly reality.</h1><p class="muted sub">Approximate figures are fine. This is about understanding the shape of your money.</p><div class="field"><label>Monthly income / money available (£)</label><input class="input" id="obIncome" type="number" inputmode="decimal" min="0" value="${esc(p.income??'')}" placeholder="850"></div><div class="field"><label>Monthly rent / housing (£)</label><input class="input" id="obRent" type="number" inputmode="decimal" min="0" value="${esc(p.rent??'')}" placeholder="750"></div><div class="field"><label>Typical weekly flexible spend (£)</label><input class="input" id="obSpend" type="number" inputmode="decimal" min="0" value="${esc(p.weeklySpend??'')}" placeholder="80"></div></div>`;
 if(step===3)content=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 3/4</span><h1>What are you trying to get better at?</h1><p class="muted">Choose the goal that matters most right now. You can change it later.</p><button class="choice ${p.goal==='control'?'selected':''}" data-obgoal="control">🎯 Control my spending</button><button class="choice ${p.goal==='save'?'selected':''}" data-obgoal="save">🧱 Build a cash buffer</button><button class="choice ${p.goal==='invest'?'selected':''}" data-obgoal="invest">📈 Understand investing</button><button class="choice ${p.goal==='debt'?'selected':''}" data-obgoal="debt">💳 Understand / reduce debt</button><button class="choice ${p.goal==='all'?'selected':''}" data-obgoal="all">🥋 Become good with money overall</button></div>`;
 if(step===4)content=`<div class="card hero"><span class="pill">SET UP YOUR DOJO · 4/4</span><h1>How confident are you?</h1><p class="muted">No right answer. This simply tunes the starting point.</p><button class="choice ${p.confidence===1?'selected':''}" data-confidence="1">1 · I have almost no idea</button><button class="choice ${p.confidence===2?'selected':''}" data-confidence="2">2 · I know some basics</button><button class="choice ${p.confidence===3?'selected':''}" data-confidence="3">3 · I’m fairly comfortable</button><button class="choice ${p.confidence===4?'selected':''}" data-confidence="4">4 · I’m confident</button><button class="choice ${p.confidence===5?'selected':''}" data-confidence="5">5 · I want advanced training</button></div>`;
 app.innerHTML=`<div class="eyebrow">TRAINING SETUP</div><div class="progress"><i style="width:${step*25}%"></i></div>${content}<div class="actions">${step>1?'<button class="ghost" onclick="onboarding('+(step-1)+')">← Back</button>':''}<button class="primary" onclick="nextOnboarding(${step})">${step===4?'Finish setup':'Continue →'}</button></div>`;
}
function nextOnboarding(step){const p=S.profile||{};
 if(step===1){let name=document.getElementById('obName').value.trim(),age=+document.getElementById('obAge').value;if(!name||age<13||age>100){toast('Add your name and age');return}S.profile={...p,name,age};save();onboarding(2);return}
 if(step===2){let income=+document.getElementById('obIncome').value,rent=+document.getElementById('obRent').value,weeklySpend=+document.getElementById('obSpend').value;if([income,rent,weeklySpend].some(x=>!Number.isFinite(x)||x<0)){toast('Add your three money figures');return}S.profile={...S.profile,income,rent,weeklySpend};save();onboarding(3);return}
 if(step===3){if(!S.profile.goal){toast('Choose a goal');return}save();onboarding(4);return}
 if(step===4){if(!S.profile.confidence){toast('Choose a confidence level');return}S.profile.onboardingComplete=true;save();accountGate();return}}
function accountGate(){setNav('');app.innerHTML=`<div class="card hero"><span class="pill">DOJO UNLOCKED</span><h1>You’re in.</h1><p class="muted sub">Create an account to save your Unidojo progress across devices, or try the full app as a guest on this device.</p><button class="primary" onclick="account()">Create a free account</button><button class="choice" onclick="account()">I already have an account</button><button class="choice" onclick="home()">Continue as guest</button><p class="muted tiny">Your account is handled by Supabase email/password authentication.</p></div>`}
function home(){if(!navOn()){onboarding(S.onStep||1);return}setNav('today');const income=+S.profile.income||0,rent=+S.profile.rent||0,weekly=+S.profile.weeklySpend||0,monthlyFlex=Math.max(0,income-rent),daily=monthlyFlex/30,left=Math.max(0,daily-S.spent);app.innerHTML=`<div class="eyebrow">${esc(S.profile.name||'YOUR')} · ${belt()} BELT</div><h1>Your money.<br><span class="accent">Your game.</span></h1><div class="card hero"><div class="eyebrow">PERSONAL MONEY SIGNAL</div><div class="big accent">${money(daily)}</div><div class="muted">approx flexible room / day after rent</div><div class="progress"><i style="width:${Math.min(100,(S.spent/(daily||1))*100)}%"></i></div><div class="row"><small class="muted">${money(S.spent)} logged today</small><small class="muted">${money(left)} remaining</small></div></div><div class="mission"><div class="eyebrow">🎯 DAILY MISSION · +25 XP</div><h2>${S.lastCheck===day()?'Mission complete':'Make one real money decision'}</h2><p class="muted">Use Unidojo before a purchase, then log what actually happened.</p><button class="primary" onclick="decide()">${S.lastCheck===day()?'Replay decision':'Start mission'}</button></div><div class="eyebrow" style="margin-top:24px">TRAIN</div><button class="game" onclick="train()"><span class="game-icon">🥋</span><div class="eyebrow">LEARNING PATH</div><h2>Continue your skill tree</h2><p class="muted tiny">${S.completed.length}/${LESSONS.length} skills mastered · next: ${LESSONS[Math.min(S.completed.length,LESSONS.length-1)][0]}</p></button><button class="game" onclick="gameMenu()"><span class="game-icon">⚡</span><div class="eyebrow">ARCADE</div><h2>Play a finance game</h2><p class="muted tiny">Money Sprint, Decision Duel and Streak Run.</p></button><div class="decision"><div class="eyebrow">REAL-WORLD MODE</div><h2>Can I afford it?</h2><p class="muted">See the consequence before the decision, without judgement.</p><button class="primary" onclick="decide()">Check a purchase</button></div><div class="grid2"><div class="stat"><b class="accent">${S.xp}</b><br><small class="muted">XP</small></div><div class="stat"><b>${S.decisions.length}</b><br><small class="muted">decisions</small></div></div><div class="card"><b>Weekly reality</b><p class="muted tiny">Income ${money(income)} · rent ${money(rent)} · typical flexible spend ${money(weekly)}/week</p><button class="ghost" onclick="checkin()">Update today’s spend</button></div>`}
function decide(){setNav('today');app.innerHTML=`<button class="ghost" onclick="home()">← Back</button><div class="card hero"><div class="eyebrow">REAL-WORLD MODE</div><h1>Can I afford it?</h1><p class="muted sub">No judgement. See the trade-off before you spend.</p><div class="field"><label>Purchase amount (£)</label><input class="input" id="purchase" type="number" inputmode="decimal" min="0" step=".01" placeholder="18"></div><button class="primary" onclick="analyse()">Show me the consequence →</button></div>`}
function analyse(){let v=+document.getElementById('purchase').value;if(!Number.isFinite(v)||v<0){toast('Enter a purchase amount');return}S.purchase=v;const income=+S.profile.income||0,rent=+S.profile.rent||0,daily=Math.max(0,(income-rent)/30),after=Math.max(0,daily-v/30),ratio=daily?v/daily:99;app.innerHTML=`<button class="ghost" onclick="decide()">← Change amount</button><div class="card hero"><div class="eyebrow">TRADE-OFF</div><div class="big accent">${money(v)}</div><p class="muted">purchase</p><div class="grid2"><div class="stat"><small class="muted">BEFORE</small><br><b>${money(daily)}</b>/day</div><div class="stat"><small class="muted">AFTER</small><br><b>${money(after)}</b>/day</div></div></div><div class="decision"><b>${ratio>2?'Pause first.':ratio>1?'Worth checking.':'Fits your current daily room.'}</b><p class="muted tiny">Now make the real-world call. The useful part is logging what you actually did.</p></div><div class="actions"><button class="primary" onclick="logDecision('bought')">I bought it</button><button onclick="logDecision('skipped')">I skipped it</button></div>`}
function logDecision(outcome){let v=S.purchase||0;S.decisions.push({date:day(),amount:v,outcome});if(outcome==='bought')S.spent+=v;else S.saved=(S.saved||0)+v;if(S.lastCheck!==day()){S.xp+=25;S.lastCheck=day();S.streak=S.streak?S.streak+1:1}save();home();toast(outcome==='skipped'?'Decision logged · +25 XP':'Decision logged')}
function checkin(){app.innerHTML=`<button class="ghost" onclick="home()">← Back</button><div class="card"><div class="eyebrow">DAILY RESET</div><h1>What did you spend today?</h1><p class="muted">Flexible spending only. This is for learning, not judgement.</p><div class="field"><label>Amount (£)</label><input class="input" id="spentToday" type="number" inputmode="decimal" min="0" value="${S.spent||0}"></div><button class="primary" onclick="saveCheckin()">Save today</button></div>`}
function saveCheckin(){let v=+document.getElementById('spentToday').value;if(!Number.isFinite(v)||v<0){toast('Enter a valid amount');return}S.spent=v;if(S.lastCheck!==day()){S.lastCheck=day();S.streak=S.streak?S.streak+1:1;S.xp+=10}save();home();toast('Daily reset saved · +10 XP')}
function train(){if(!navOn()){onboarding(S.onStep||1);return}setNav('train');const prog=Math.min(100,S.xp/nextXP()*100);let tree=LESSONS.map((l,i)=>{let open=i<=S.completed.length,done=S.completed.includes(i);return `<button class="lesson ${open?'':'locked'}" ${open?`onclick="openLesson(${i})"`:'disabled'}><span class="node">${done?'✓':l[1]}</span><span><span class="eyebrow">${l[2]}</span><br><b>${l[0]}</b><br><small class="muted">${done?'MASTERED · +20 XP':open?'READY · PLAY':'LOCKED'}</small></span></button>`}).join('');app.innerHTML=`<div class="eyebrow">TRAINING GROUND</div><h1>Build your<br><span class="accent">money brain.</span></h1><div class="card"><div class="row"><b>${belt()} BELT</b><b class="accent">${S.xp} XP</b></div><div class="progress"><i style="width:${prog}%"></i></div><small class="muted">${Math.max(0,nextXP()-S.xp)} XP to next belt</small></div><button class="game" onclick="gameMenu()"><span class="game-icon">⚡</span><div class="eyebrow">ARCADE</div><h2>Games are a feature of training</h2><p class="muted tiny">Use them to practise concepts. The skill tree remains the core curriculum.</p></button><div class="eyebrow" style="margin-top:24px">LEARNING PATH · ${S.completed.length}/${LESSONS.length}</div><div class="tree-line">${tree}</div>`}
function openLesson(i){S.lesson=i;S.answer=null;renderLesson()}
function renderLesson(){const l=LESSONS[S.lesson],answered=S.answer!==null;app.innerHTML=`<button class="ghost" onclick="train()">← Skill tree</button><div class="card hero"><div class="eyebrow">SKILL ${S.lesson+1}/${LESSONS.length} · ${l[2]}</div><h1>${l[1]} ${l[0]}</h1><p class="muted">University-level money training. Apply the concept rather than memorising a definition.</p><h2>${l[3]}</h2></div>${l[4].map((o,i)=>`<button class="choice ${answered?(i===l[5]?'correct':i===S.answer?'wrong':''):''}" ${answered?'disabled':''} onclick="answerLesson(${i})"><b>${i+1}.</b> ${o}</button>`).join('')}${answered?`<div class="card"><b>${S.answer===l[5]?'🔥 Nailed it.':'Not quite.'}</b><p class="muted tiny">${S.answer===l[5]?'Good. Now use it in a real decision.':'Correct answer: '+l[4][l[5]]+'.'}</p></div><button class="primary" onclick="nextLesson()">${S.lesson<LESSONS.length-1?'Next skill →':'Finish tree →'}</button>`:''}`}
function answerLesson(i){if(S.answer!==null)return;S.answer=i;if(i!==LESSONS[S.lesson][5])S.hearts=Math.max(0,S.hearts-1);save();renderLesson()}
function nextLesson(){if(S.answer!==LESSONS[S.lesson][5]){S.answer=null;renderLesson();toast('Try again');return}if(!S.completed.includes(S.lesson)){S.completed.push(S.lesson);S.xp+=20;save();toast('+20 XP · Skill mastered')}if(S.lesson<LESSONS.length-1){S.lesson++;S.answer=null;renderLesson()}else{S.answer=null;train()}}
function gameMenu(){setNav('train');app.innerHTML=`<button class="ghost" onclick="train()">← Train</button><div class="card hero"><div class="eyebrow">ARCADE</div><h1>Pick a game.</h1><p class="muted">Games practise the curriculum. They do not replace it.</p></div>${GAMES.map(g=>`<button class="game" onclick="startGame('${g[0]}')"><span class="game-icon">${g[1]}</span><div class="eyebrow">${g[4]}</div><h2>${g[2]}</h2><p class="muted tiny">${g[3]}</p><span class="tag">PLAY →</span></button>`).join('')}`}
function startGame(type){S.game=type;S.gameIndex=0;S.gameScore=0;S.combo=0;S.gameDone=false;save();renderGame();if(type==='sprint')timerStart()}
function renderGame(){if(S.gameDone){app.innerHTML=`<div class="card hero" style="text-align:center"><div style="font-size:60px">🏆</div><div class="eyebrow">RUN COMPLETE</div><h1>${S.gameScore} <span class="accent">XP</span></h1><p class="muted">Best combo ×${S.combo||1}. Keep training the weak spots in your skill tree.</p><button class="primary" onclick="gameMenu()">Play another</button><button class="ghost" onclick="train()">Back to Train</button></div>`;return}
 if(S.game==='sprint')return renderSprint();if(S.game==='duel')return renderDuel();return renderStreak()}
function renderSprint(){const q=LESSONS[S.gameIndex%LESSONS.length];app.innerHTML=`<div class="row"><div><div class="eyebrow">⚡ MONEY SPRINT</div><b>ROUND ${S.gameIndex+1}/5</b></div><div class="score accent">${S.gameScore}</div></div><div class="timer"><i id="timerBar"></i></div><div class="card"><span class="pill">COMBO ×${Math.max(1,S.combo)}</span><h2>${q[3]}</h2></div>${q[4].map((o,i)=>`<button class="choice" onclick="gameAnswer(${i})">${o}</button>`).join('')}`}
function renderDuel(){const qs=[['You have £75 until Friday. A £35 night out is offered.','Skip or downgrade the night out','Go and hope'],['Food spending is £22/week above your target.','Fix the default meal option','Make the budget more complicated'],['A card charges 29.9% APR and you have spare cash.','Clear expensive debt first','Invest it regardless']];const q=qs[S.gameIndex%3];app.innerHTML=`<div class="eyebrow">⚔️ DECISION DUEL</div><div class="score accent">${S.gameScore} XP</div><div class="card hero"><h2>${q[0]}</h2><p class="muted">Pick the stronger financial move.</p></div><button class="choice" onclick="duelAnswer(0)">A · ${q[1]}</button><button class="choice" onclick="duelAnswer(1)">B · ${q[2]}</button>`}
function renderStreak(){const qs=[['What protects you from a surprise £150 cost?','A protected cash buffer','A bigger subscription'],['Which habit is easier to sustain?','A realistic weekly rule','An impossible daily target'],['What is a recurring leak?','A subscription you rarely use','A one-off purchase']];const q=qs[S.gameIndex%3];app.innerHTML=`<div class="eyebrow">🔥 STREAK RUN</div><div class="card hero"><span class="pill">ROUND ${S.gameIndex+1}/3</span><h1>Stack the wins.</h1><h2>${q[0]}</h2><button class="choice" onclick="streakAnswer(0)">${q[1]}</button><button class="choice" onclick="streakAnswer(1)">${q[2]}</button></div>`}
function timerStart(){clearTimeout(window._ut);const b=document.getElementById('timerBar');if(!b)return;b.style.transition='none';b.style.width='100%';requestAnimationFrame(()=>{b.style.transition='width 8s linear';b.style.width='0%'});window._ut=setTimeout(()=>{if(S.game==='sprint'&&!S.gameDone){S.combo=0;S.gameIndex++;if(S.gameIndex>=5){S.xp+=S.gameScore;S.gameDone=true;save();renderGame()}else{save();renderGame();timerStart()}}},8000)}
function gameAnswer(i){const q=LESSONS[S.gameIndex%LESSONS.length],ok=i===q[5];S.combo=ok?S.combo+1:0;if(ok)S.gameScore+=10+(S.combo-1)*3;else S.hearts=Math.max(0,S.hearts-1);S.gameIndex++;if(S.gameIndex>=5){S.xp+=S.gameScore;S.gameDone=true;clearTimeout(window._ut)}save();renderGame();if(!S.gameDone&&S.game==='sprint')timerStart()}
function duelAnswer(i){const ok=i===0;S.combo=ok?S.combo+1:0;if(ok)S.gameScore+=15;S.gameIndex++;if(S.gameIndex>=3){S.xp+=S.gameScore;S.gameDone=true}save();renderGame()}
function streakAnswer(i){const ok=i===0;S.combo=ok?S.combo+1:0;if(ok)S.gameScore+=12;S.gameIndex++;if(S.gameIndex>=3){S.xp+=S.gameScore;S.gameDone=true}save();renderGame()}
function markets(){if(!navOn()){onboarding(S.onStep||1);return}setNav('markets');const list=Object.keys(seed).map(t=>{const p=S.live[t]||seed[t],base=seed[t],chg=(p/base-1)*100;return `<div class="stock"><div class="row"><div><b>${t}</b><br><small class="muted">${names[t]}</small></div><div style="text-align:right"><div class="price">$${p.toFixed(2)}</div><small class="${chg>=0?'up':'down'}">${chg>=0?'+':''}${chg.toFixed(2)}%</small></div></div><button class="primary" style="width:100%;margin-top:10px" onclick="stock('${t}')">Open ${t} →</button></div>`}).join('');app.innerHTML=`<div class="eyebrow">FEATURE · SIMULATED INVESTING</div><h1>Markets</h1><div class="card"><div class="row"><b>Virtual cash</b><b class="accent">£${S.cash.toFixed(2)}</b></div><p class="muted tiny">Paper trading is one part of Unidojo. Use it to apply what you learn in Train.</p><button class="ghost" onclick="refreshPrices()">Refresh prices</button></div>${list}`;refreshPrices()}
async function refreshPrices(){for(const t of Object.keys(seed)){try{const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?range=1d&interval=5m');const j=await r.json();const p=j?.chart?.result?.[0]?.meta?.regularMarketPrice;if(Number.isFinite(p))S.live[t]=p}catch(e){}}save();if(S.tab==='markets')markets()}
function stock(t){const p=S.live[t]||seed[t],qty=Number(S.holdings[t]||0);app.innerHTML=`<button class="ghost" onclick="markets()">← Markets</button><div class="card hero"><div class="eyebrow">${names[t]} · ${t}</div><div class="big">$${p.toFixed(2)}</div><p class="muted">Public market price when available; otherwise the seeded reference price keeps the simulator usable.</p><div class="field"><label>Quantity</label><input class="input" id="tradeQty" type="number" inputmode="numeric" min="1" step="1" value="1"></div><div class="actions"><button class="primary" onclick="buy('${t}')">Buy shares</button><button onclick="sell('${t}')">Sell shares</button></div></div><div class="card"><b>Your position</b><p class="muted">${qty} shares · virtual cash £${S.cash.toFixed(2)}</p><b>Unidojo Coach</b><p class="muted tiny">Before adding to a position: why this company, why now, what could invalidate the thesis, and how large should this position be?</p></div>`}
function buy(t){const q=Math.max(1,Math.floor(+document.getElementById('tradeQty').value||1)),p=S.live[t]||seed[t],cost=q*p;if(cost>S.cash){toast('Not enough virtual cash');return}S.cash-=cost;S.holdings[t]=(S.holdings[t]||0)+q;save();stock(t);toast('Position opened')}
function sell(t){const q=Math.max(1,Math.floor(+document.getElementById('tradeQty').value||1)),p=S.live[t]||seed[t],have=S.holdings[t]||0;if(q>have){toast('You do not own enough shares');return}S.cash+=q*p;S.holdings[t]=have-q;save();stock(t);toast('Position reduced')}
function account(){setNav('account');app.innerHTML=`<div class="eyebrow">ACCOUNT</div><h1>Save your dojo.</h1><div class="card"><p class="muted">Guest mode keeps progress on this device. A Supabase account lets Unidojo persist your profile and progress across devices.</p><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="new-password" placeholder="8+ characters"></div><div class="actions"><button class="primary" onclick="signup()">Create account</button><button onclick="signin()">Sign in</button></div><div id="authMsg"></div></div><div class="card"><b>Current guest progress</b><p class="muted tiny">${S.xp} XP · ${S.completed.length}/${LESSONS.length} skills · ${S.decisions.length} real decisions</p><button class="danger" onclick="resetAll()">Reset local dojo</button></div>`}
function client(){if(!window.supabase||!window.UNIDOJO_SUPABASE_URL||!window.UNIDOJO_SUPABASE_KEY)return null;return window.supabase.createClient(window.UNIDOJO_SUPABASE_URL,window.UNIDOJO_SUPABASE_KEY)}
async function signup(){const c=client(),msg=document.getElementById('authMsg');if(!c){msg.innerHTML='<div class="error">Account service is unavailable right now.</div>';return}const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<8){msg.innerHTML='<div class="error">Use a valid email and an 8+ character password.</div>';return}const r=await c.auth.signUp({email,password});if(r.error){msg.innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}msg.innerHTML='<div class="success">'+(r.data.session?'Account created and signed in.':'Account created. Check your email to confirm it.')+'</div>'}
async function signin(){const c=client(),msg=document.getElementById('authMsg');if(!c){msg.innerHTML='<div class="error">Account service is unavailable right now.</div>';return}const r=await c.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});msg.innerHTML=r.error?'<div class="error">'+esc(r.error.message)+'</div>':'<div class="success">Signed in.</div>'}
function resetAll(){if(confirm('Reset all Unidojo progress on this device?')){localStorage.removeItem(KEY);location.reload()}}
load();
if(!S.profile||!S.profile.onboardingComplete)onboarding(S.onStep||1);else home();
</script>
</body>
</html>
