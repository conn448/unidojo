<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidojo</title><style>body{margin:0;background:#080808;color:#fff;font:16px system-ui}main{max-width:620px;margin:auto;padding:18px 16px 100px}button,input{font:inherit}button{border:0;border-radius:12px;padding:13px;margin:5px 0;background:#181818;color:#fff;border:1px solid #333}.primary{background:#ff9800;color:#111;font-weight:900}.card,.stock{background:#131313;border:1px solid #292929;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#999}.up{color:#35d399}.down{color:#ff5d73}.nav{position:fixed;bottom:0;left:0;right:0;background:#090909;border-top:1px solid #333;text-align:center}.nav button{width:23%}.row{display:flex;justify-content:space-between;gap:10px}.price{font-size:24px;font-weight:900}.qty{width:100%;padding:12px;background:#090909;color:#fff;border:1px solid #333;border-radius:10px}</style></head><body><main><h1>uni<span style="color:#ff9800">dojo</span></h1><div id="app"></div></main><div class="nav"><button onclick="home()">Today</button><button onclick="markets()">Markets</button><button onclick="train()">Train</button><button onclick="account()">Account</button></div><script src="supabase-config.js"></script><script>var A=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','V','NFLX','JPM','KO','MCD'],N={AAPL:'Apple',MSFT:'Microsoft',NVDA:'NVIDIA',AMZN:'Amazon',GOOGL:'Alphabet',META:'Meta',TSLA:'Tesla',V:'Visa',NFLX:'Netflix',JPM:'JPMorgan',KO:'Coca-Cola',MCD:"McDonald's"},P={AAPL:332.27,MSFT:510,NVDA:176,AMZN:232,GOOGL:246,META:748,TSLA:350,V:350,NFLX:1180,JPM:300,KO:70,MCD:310},live={},cash=10000,H={};function get(t){return live[t]||P[t]}async function refresh(){for(const t of A){try{let j=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+t+'?range=1d&interval=5m').then(r=>r.json());live[t]=j.chart.result[0].meta.regularMarketPrice}catch(e){}}if(location.hash==='#markets')markets()}function home(){location.hash='home';app.innerHTML='<div class="card"><h2>Train your money brain.</h2><p class="muted">Make real spending decisions, learn investing, and practise with £10,000 virtual cash.</p><button class="primary" onclick="markets()">Enter Markets →</button></div><div class="card"><h3>Can I afford it?</h3><input id="amt" class="qty" type="number" placeholder="Purchase amount"><button class="primary" onclick="decision()">Check the trade-off</button></div>'}function decision(){let n=+amt.value||0;app.innerHTML='<div class="card"><h2>£'+n.toFixed(0)+'</h2><p class="muted">Compare this with your weekly flexible spending and your other priorities.</p><button class="primary" onclick="home()">I bought it</button><button onclick="home()">I skipped it</button></div>'}function markets(){location.hash='markets';app.innerHTML='<h2>Markets <span class="muted">LIVE</span></h2><div class="card"><div class="row"><b>Portfolio</b><b>£'+cash.toFixed(2)+'</b></div><p class="muted">Virtual cash · realistic simulated trading</p></div>'+A.map(t=>'<div class="stock"><div class="row"><div><b>'+t+'</b><br><span class="muted">'+N[t]+'</span></div><div style="text-align:right"><div class="price">$'+get(t).toFixed(2)+'</div><small class="'+(get(t)>=P[t]?'up':'down')+'">'+((get(t)/P[t]-1)*100).toFixed(2)+'%</small></div></div><button class="primary" onclick="trade(\''+t+'\')">Open '+t+' →</button></div>').join('')}function trade(t){let p=get(t),q=1;app.innerHTML='<button onclick="markets()">← Markets</button><div class="card"><small class="muted">'+N[t]+' · '+t+'</small><h1>$'+p.toFixed(2)+'</h1><p>Live market price where public data is available.</p><label>Quantity<br><input id="q" class="qty" type="number" min="1" value="1"></label><button class="primary" onclick="buy(\''+t+'\')">Buy multiple shares</button><button onclick="sell(\''+t+'\')">Sell shares</button></div><div class="card"><b>Unidojo Coach</b><p class="muted">Before you buy: why this company, why now, and what would make you change your mind?</p></div>'}function buy(t){let q=Math.max(1,+document.getElementById('q').value||1),c=q*get(t);if(c>cash)return alert('Not enough virtual cash');cash-=c;H[t]=(H[t]||0)+q;trade(t)}function sell(t){let q=Math.max(1,+document.getElementById('q').value||1);if((H[t]||0)<q)return alert('You do not own enough shares');cash+=q*get(t);H[t]-=q;trade(t)}function train(){app.innerHTML='<div class="card"><h2>Train</h2><h3>Concentration risk</h3><p>Putting 40% of a portfolio into one company means one thesis controls a huge part of your outcome.</p><button class="primary" onclick="markets()">Apply it in Markets →</button></div>'}function account(){app.innerHTML='<div class="card"><h2>Save your dojo</h2><p class="muted">Guest mode works locally. Account setup uses Supabase email/password authentication so progress can be saved across devices.</p><input id="em" class="qty" type="email" placeholder="Email"><input id="pw" class="qty" type="password" placeholder="Password (8+ characters)"><button class="primary" onclick="signup()">Create account</button><button onclick="signin()">Sign in</button></div>'}async function signup(){if(!window.supabase)return alert('Account service loading');let s=supabase.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY),r=await s.auth.signUp({email:em.value,password:pw.value});alert(r.error?r.error.message:(r.data.session?'Account created':'Check your email to confirm your account'))}async function signin(){if(!window.supabase)return;let s=supabase.createClient(UNIDOJO_SUPABASE_URL,UNIDOJO_SUPABASE_KEY),r=await s.auth.signInWithPassword({email:em.value,password:pw.value});alert(r.error?r.error.message:'Signed in')}home();refresh();setInterval(refresh,60000);</script></body></html>
