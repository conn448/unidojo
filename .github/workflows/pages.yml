name: Deploy Unidojo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deployment-only boot hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="Start today's training"
          new="Start today&#39;s training"
          if old not in s:
              raise SystemExit('Expected Unidojo boot bug was not found; refusing to deploy an unknown source')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('Applied deployment-only fix for the proven unescaped apostrophe')
          PY

      - name: Failure sweep — HTML, JavaScript and boot invariants
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          checks={
            'app mount': 'id="app"' in html,
            'loading fallback': 'Opening your dojo' in html,
            'boot function': 'function onboarding(step)' in html,
            'global home': 'window.home=home' in html,
            'global safeRun': 'window.safeRun=safeRun' in html,
            'localStorage guard': 'try{var raw=localStorage.getItem(KEY)' in html,
            'no external JS dependency': not re.search(r'<script[^>]+src=',html,re.I),
            'doctype': html.lower().startswith('<!doctype html>'),
          }
          bad=[k for k,v in checks.items() if not v]
          print('Failure sweep:', checks)
          if bad: raise SystemExit('Invariant failures: '+', '.join(bad))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline JavaScript found')
          js='\n'.join(scripts)
          Path('/tmp/unidojo-inline.js').write_text(js,encoding='utf-8')
          print('HTML bytes:',len(html),'JS bytes:',len(js))
          PY
          node --check /tmp/unidojo-inline.js
          echo "JAVASCRIPT SYNTAX OK"

      - name: Boot test in isolated DOM
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)[0]
          Path('/tmp/boot-test.js').write_text(r'''const vm=require('vm');
          const elements={};
          function el(id){return elements[id]||(elements[id]={id,innerHTML:'',textContent:'',classList:{add(){},remove(){},toggle(){}},value:'',disabled:false});}
          const context={console,window:{},document:{getElementById:el,querySelectorAll:()=>[]},localStorage:{_:{},getItem(k){return this._[k]??null},setItem(k,v){this._[k]=String(v)},removeItem(k){delete this._[k]}},setTimeout:(fn)=>fn(),clearTimeout:()=>{}};
          context.window=context.window; context.window.setTimeout=context.setTimeout; context.window.clearTimeout=context.clearTimeout;
          vm.createContext(context);
          try{vm.runInContext('''+repr(js)+''',context,{timeout:5000});
            const rendered=elements.app.innerHTML;
            if(!rendered || /Opening your dojo|Starting the learning engine|LOADING/i.test(rendered)) throw new Error('Boot left loading screen');
            console.log('ISOLATED BOOT OK:',rendered.slice(0,180));
          }catch(e){console.error('ISOLATED BOOT FAILED:',e&&e.stack||e);process.exit(1)}
          ''',encoding='utf-8')
          PY
          node /tmp/boot-test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live HTTP smoke test
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          echo "Testing $SITE_URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 15 "$SITE_URL" -o /tmp/live.html; then
              grep -q 'Unidojo' /tmp/live.html
              grep -q 'id="app"' /tmp/live.html
              grep -q 'Start today&#39;s training' /tmp/live.html
              echo "LIVE HTML OK"
              exit 0
            fi
            sleep 10
          done
          exit 1
