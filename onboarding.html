<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Unidojo — Onboarding</title><style>:root{--bg:#080808;--card:#151515;--card2:#1d1d1d;--line:#303030;--text:#fff;--muted:#9b9b9b;--orange:#ff9800}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid #3b3b3b;border-radius:14px;background:var(--card2);color:#fff;padding:14px 15px;min-height:52px;cursor:pointer;width:100%}.primary{background:var(--orange);border-color:var(--orange);color:#111;font-weight:900}.wrap{max-width:720px;margin:auto;padding:28px 14px}.brand{font-size:25px;font-weight:950;margin:2px 3px 28px}.brand span{color:var(--orange)}.card{background:linear-gradient(145deg,#181818,#101010);border:1px solid var(--line);border-radius:20px;padding:21px;margin:12px 0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--orange)}h1{font-size:34px;line-height:1.05;margin:8px 0 13px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:800;margin-top:14px}.input{display:block;width:100%;padding:13px;border:1px solid #3d3d3d;border-radius:13px;background:#090909;color:#fff;margin:7px 0;outline:none}.choice{display:block;text-align:left;margin:10px 0;position:relative;z-index:100;touch-action:manipulation}.choice.selected{border-color:var(--orange);background:#30200c}.actions{display:flex;gap:9px;margin-top:12px}.actions>*{flex:1}.progress{height:8px;background:#292929;border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:var(--orange)}</style></head><body><main class="wrap"><div class="brand">uni<span>dojo</span></div><div id="app"></div></main><script>
(function(){
'use strict';
var KEY='unidojo-core-v6';var S={profile:{}};try{var old=JSON.parse(localStorage.getItem(KEY)||'{}');if(old&&typeof old==='object')S=old}catch(e){}S.profile=S.profile||{};var step=1;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function render(){var p=S.profile,c='';if(step===1)c='<div class="card"><div class="eyebrow">SET UP · 1/4</div><h1>Build your money profile.</h1><p class="muted">A quick starting point so Unidojo can teach from your reality.</p><label>First name</label><input class="input" id="name" value="'+esc(p.name||'')+'" placeholder="e.g. Conn"><label>Age</label><input class="input" id="age" type="number" value="'+esc(p.age||'')+'" placeholder="18"></div>';if(step===2)c='<div class="card"><div class="eyebrow">SET UP · 2/4</div><h1>Know your monthly reality.</h1><p class="muted">Rough numbers are fine.</p><label>Monthly income / money available (£)</label><input class="input" id="income" type="number" value="'+esc(p.income??'')+'" placeholder="850"><label>Monthly rent / housing (£)</label><input class="input" id="rent" type="number" value="'+esc(p.rent??'')+'" placeholder="750"><label>Typical weekly flexible spend (£)</label><input class="input" id="spend" type="number" value="'+esc(p.weeklySpend??'')+'" placeholder="80"></div>';if(step===3)c='<div class="card"><div class="eyebrow">SET UP · 3/4</div><h1>What do you want to get better at?</h1><p class="muted">Tap one. The whole button is clickable.</p>'+[['control','🎯 Control my spending'],['save','🧱 Build a cash buffer'],['invest','📈 Understand investing'],['debt','💳 Understand debt'],['all','🥋 Become good with money overall']].map(function(a){return '<button type="button" class="choice '+(p.goal===a[0]?'selected':'')+'" data-goal="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>';if(step===4)c='<div class="card"><div class="eyebrow">SET UP · 4/4</div><h1>How confident are you?</h1><p class="muted">Tap one. The whole button is clickable.</p>'+[['1','😵 I often feel lost'],['2','🙂 I know the basics'],['3','💪 I am fairly confident'],['4','🧠 I want harder questions']].map(function(a){return '<button type="button" class="choice '+(String(p.confidence)===a[0]?'selected':'')+'" data-confidence="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>';document.getElementById('app').innerHTML=c+'<div class="progress"><i style="width:'+step*25+'%"></i></div><div class="actions"><button type="button" id="back">'+(step>1?'← Back':'')+'</button><button type="button" class="primary" id="next">'+(step===4?'Finish setup':'Continue →')+'</button></div>';}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function next(){var p=S.profile;if(step===1){p.name=(document.getElementById('name').value||'').trim();p.age=Number(document.getElementById('age').value);if(!p.name||!p.age)return alert('Add your name and age.')}else if(step===2){p.income=Number(document.getElementById('income').value)||0;p.rent=Number(document.getElementById('rent').value)||0;p.weeklySpend=Number(document.getElementById('spend').value)||0}else if(step===3&&!p.goal)return alert('Pick a goal first.');else if(step===4&&!p.confidence)return alert('Pick your confidence level first.');if(step===4){p.onboardingComplete=true;S.profile=p;save();location.href='index.html?fresh='+Date.now();return}S.profile=p;save();step++;render()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='next'){e.preventDefault();next();return}if(b.id==='back'){e.preventDefault();if(step>1){step--;render()}return}if(b.dataset.goal){e.preventDefault();S.profile.goal=b.dataset.goal;save();render();return}if(b.dataset.confidence){e.preventDefault();S.profile.confidence=Number(b.dataset.confidence);save();render();return}},true);render();
})();
</script></body></html>
