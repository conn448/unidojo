<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidojo Markets</title><style>body{margin:0;background:#080808;color:#fff;font:16px system-ui;padding:20px}main{max-width:600px;margin:auto}button{padding:12px;margin:5px;border-radius:10px;border:1px solid #444;background:#171717;color:#fff}.buy{background:#ff9800;color:#111}.stock{border:1px solid #333;border-radius:15px;padding:15px;margin:10px 0}.up{color:#35d399}.down{color:#ff5d73}</style><main><h1>Unidojo Markets</h1><p>Realistic paper-trading engine prototype. Multiple-share orders, live market refresh, portfolio and coach layers are being integrated into the main app.</p><div id="stocks"></div></main><script>const s=[['AAPL','Apple',332.27],['MSFT','Microsoft',510],['NVDA','NVIDIA',176],['AMZN','Amazon',232],['GOOGL','Alphabet',246],['META','Meta',748],['TSLA','Tesla',350],['V','Visa',350]];let p={};async function load(){for(const x of s){try{const j=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+x[0]+'?range=1d&interval=5m').then(r=>r.json());p[x[0]]=j.chart.result[0].meta.regularMarketPrice}catch(e){p[x[0]]=x[2]}}render()}function render(){stocks.innerHTML=s.map(x=>{let v=p[x[0]]||x[2];return '<div class="stock"><b>'+x[0]+' · '+x[1]+'</b><h2>$'+v.toFixed(2)+'</h2><span class="'+(v>=x[2]?'up':'down')+'">'+((v/x[2]-1)*100).toFixed(2)+'%</span><br><button class="buy" onclick="alert(\'Buy multiple shares in '+x[0]+' from the main Markets screen.\')">Buy</button></div>'}).join('')}load();</script>
